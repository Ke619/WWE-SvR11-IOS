          start = s.index('REXCVAR_DEFINE_BOOL(native_compact_tables, false, "GPU",')
          end = s.index(");\n", start) + 3
          stmt = s[start:end]
          ios_stmt = stmt.replace("native_compact_tables, false,", "native_compact_tables, true,", 1)
          block = ("#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n" + ios_stmt +
                   "#else\n" + stmt + "#endif\n")
          open(path, "w").write(s[:start] + block + s[end:])
          print("patched: backend_vulkan.cpp native_compact_tables default on iOS")
          PYEOF
          grep -n "__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__" port-src/port/src/svr2011_app.cpp port-src/port/src/native/native_renderer.cpp port-src/port/src/graphics_page.cpp port-src/port/src/native/backend_vulkan.cpp
          grep -n -B1 -A6 "native_compact_tables, true" port-src/port/src/native/backend_vulkan.cpp

      - name: iOS launcher (Play screen before the game starts)
        run: |
          set -euo pipefail
          cat > port-src/port/src/ios_launcher.mm <<'EOF'
          // iOS launcher: a tabbed screen shown before the game starts (Play, Mods, DLC, Save Manager, Online, Settings, Install) on an
          // arena backdrop, with a bevelled blue / red / grey look. (A file named skip_launcher in Documents turns it off.)
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #include <algorithm>
          #include <array>
          #include <cstdint>
          #include <stdexcept>
          #include <atomic>
          #include <chrono>
          #include <cctype>
          #include <cmath>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <filesystem>
          #include <fstream>
          #include <ctime>
          #include <functional>
          #include <map>
          #include <sstream>
          #include <string>
          #include <vector>
          #include <dirent.h>
          #include <fcntl.h>
          #include <strings.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <zlib.h>

          #define SVR_BG [UIColor colorWithRed:0.008 green:0.012 blue:0.04 alpha:1.0]
          #define SVR_RED [UIColor colorWithRed:0.75 green:0.05 blue:0.08 alpha:1.0]
          #define SVR_DIM [UIColor colorWithRed:0.663 green:0.690 blue:0.741 alpha:1.0]
          #define SVR_TEXT [UIColor whiteColor]
          #define SVR_OK [UIColor colorWithRed:0.427 green:0.941 blue:0.627 alpha:1.0]
          #define SVR_BAD [UIColor colorWithRed:1.0 green:0.451 blue:0.420 alpha:1.0]
          #define SVR_BLUE [UIColor colorWithRed:0.169 green:0.482 blue:0.878 alpha:1.0]

          static bool SvrFileExists(const std::string& path) {
            struct stat st;
            return stat(path.c_str(), &st) == 0;
          }

          static std::string SvrStd(NSString* s) {
            return s ? std::string([s UTF8String]) : std::string();
          }

          static NSString* SvrNS(const std::string& s) {
            NSString* r = [NSString stringWithUTF8String:s.c_str()];
            return r ? r : @"";
          }

          // A string from a JSON value (empty when it is not a string).
          static std::string SvrStr(id v) {
            return [v isKindOfClass:[NSString class]] ? SvrStd((NSString*)v) : std::string();
          }

          // ---- the settings file (Documents/svr2011.toml): flat "key = value" lines ----

          static std::string SvrConfigPath() {
            const char* home = getenv("HOME");
            return home ? std::string(home) + "/Documents/svr2011.toml" : std::string();
          }

          static std::string SvrTrim(const std::string& s) {
            const size_t a = s.find_first_not_of(" \t\r");
            if (a == std::string::npos) return std::string();
            const size_t b = s.find_last_not_of(" \t\r");
            return s.substr(a, b - a + 1);
          }

          static std::vector<std::string> SvrReadConfig() {
            std::vector<std::string> lines;
            std::ifstream in(SvrConfigPath());
            for (std::string line; std::getline(in, line);) lines.push_back(line);
            return lines;
          }

          // The value of a top-level key (quotes removed), or `fallback` when the key is not there.
          static std::string SvrGet(const std::vector<std::string>& lines, const std::string& key,
                                    const std::string& fallback) {
            for (const std::string& l : lines) {
              const size_t first = l.find_first_not_of(" \t");
              if (first == std::string::npos || l[first] == '#') continue;
              if (l[first] == '[') break;
              const size_t eq = l.find('=');
              if (eq == std::string::npos) continue;
              if (SvrTrim(l.substr(first, eq - first)) != key) continue;
              std::string v = l.substr(eq + 1);
              const size_t hash = v.find(" #");
              if (hash != std::string::npos) v = v.substr(0, hash);
              v = SvrTrim(v);
              if (v.size() >= 2 && v.front() == '"' && v.back() == '"') v = v.substr(1, v.size() - 2);
              return v;
            }
            return fallback;
          }

          // A TOML string: the text in quotes (quote, backslash and line breaks cannot be in these fields).
          static std::string SvrQuote(const std::string& v) {
            std::string out = "\"";
            for (char c : v) {
              if (c != '"' && c != '\\' && c != '\n' && c != '\r') out += c;
            }
            return out + "\"";
          }

          // Sets `key = value` among the top-level keys, keeping every other line (as the game does).
          static void SvrSet(const std::string& key, const std::string& value) {
            std::vector<std::string> lines = SvrReadConfig();
            const std::string entry = key + " = " + value;
            size_t insert_at = lines.size();
            bool done = false;
            for (size_t i = 0; i < lines.size(); ++i) {
              const std::string& l = lines[i];
              const size_t first = l.find_first_not_of(" \t");
              if (first == std::string::npos) continue;
              if (l[first] == '[') {
                insert_at = i;
                break;
              }
              const size_t eq = l.find('=');
              if (eq == std::string::npos || l[first] == '#') continue;
              if (SvrTrim(l.substr(first, eq - first)) == key) {
                lines[i] = entry;
                done = true;
                break;
              }
            }
            if (!done) lines.insert(lines.begin() + static_cast<std::ptrdiff_t>(insert_at), entry);
            const std::string path = SvrConfigPath();
            const std::string tmp = path + ".tmp";
            {
              std::ofstream out(tmp, std::ios::trunc);
              for (const std::string& l : lines) out << l << "\n";
              if (!out) {
                std::fprintf(stderr, "[boot] settings: could not write the settings file\n");
                return;
              }
            }
            if (std::rename(tmp.c_str(), path.c_str()) != 0) {
              std::fprintf(stderr, "[boot] settings: could not replace the settings file\n");
            }
          }

          // ---- the graphics options (the same values the in-game GRAPHICS page writes) ----

          struct SvrScale {
            int max_scale;
            double res;
            int height;
          };
          static const SvrScale kSvrScales[] = {
              {1, 0.5, 0}, {1, 2.0 / 3.0, 0}, {1, 1.0, 0}, {2, 1.0, 900}, {2, 1.0, 1080}};  // 360p 480p 720p 900p 1080p
          static const char* const kSvrTextureQualities[] = {"high", "medium", "low"};

          // ---- small UIKit helpers: the launcher's look (dark glass cards, bevelled blue / red / grey buttons) ----

          static UIColor* SvrHex(uint32_t rgb, CGFloat alpha) {
            return [UIColor colorWithRed:((rgb >> 16) & 0xFF) / 255.0
                                   green:((rgb >> 8) & 0xFF) / 255.0
                                    blue:(rgb & 0xFF) / 255.0
                                   alpha:alpha];
          }

          // Avenir Next Condensed: the iOS look-alike of the preview's Barlow Condensed.
          static UIFont* SvrCondensed(CGFloat size, BOOL heavyItalic) {
            UIFont* f = [UIFont fontWithName:heavyItalic ? @"AvenirNextCondensed-HeavyItalic" : @"AvenirNextCondensed-Bold" size:size];
            return f ? f : [UIFont systemFontOfSize:size weight:UIFontWeightHeavy];
          }

          static UILabel* SvrLabel(NSString* text, CGFloat size, UIColor* color, BOOL bold) {
            UILabel* l = [[UILabel alloc] init];
            l.text = text;
            l.textColor = color;
            l.font = bold ? [UIFont boldSystemFontOfSize:size] : [UIFont systemFontOfSize:size];
            l.numberOfLines = 0;
            return l;
          }

          // A card heading: condensed, capitals.
          static UILabel* SvrHeading(NSString* text) {
            UILabel* l = [[UILabel alloc] init];
            l.attributedText = [[NSAttributedString alloc]
                initWithString:text.uppercaseString
                    attributes:@{
                      NSFontAttributeName : SvrCondensed(20.0, NO),
                      NSForegroundColorAttributeName : SVR_TEXT,
                      NSKernAttributeName : @0.5
                    }];
            return l;
          }

          static UILabel* SvrMono(NSString* text) {
            UILabel* l = SvrLabel(text, 11.0, SVR_DIM, NO);
            l.font = [UIFont monospacedSystemFontOfSize:11.0 weight:UIFontWeightRegular];
            l.lineBreakMode = NSLineBreakByCharWrapping;
            return l;
          }

          // The button looks: a four-stop bevel gradient (top, upper half, lower half, bottom).
          enum { kSvrGray = 0, kSvrBlue = 1, kSvrRedStyle = 2, kSvrTab = 3, kSvrTabOn = 4, kSvrClear = 5 };

          static const uint32_t kSvrGradColors[5][4] = {
              {0x4a505c, 0x252a33, 0x14171d, 0x2a2f39},  // grey
              {0x8cc6ff, 0x2f86ec, 0x1458c0, 0x2f7be0},  // blue
              {0xff8a7a, 0xee2d22, 0xb50f0f, 0xd82020},  // red
              {0x3a3f4a, 0x15181e, 0x0b0d11, 0x1b1f27},  // tab
              {0x8cc6ff, 0x2f86ec, 0x1458c0, 0x2f7be0},  // tab, selected
          };
          static const CGFloat kSvrGradLocs[5][2] = {{0.50, 0.52}, {0.46, 0.54}, {0.46, 0.54}, {0.50, 0.52}, {0.46, 0.54}};

          static void SvrSetGradient(CAGradientLayer* g, NSInteger style) {
            if (style < 0 || style > 4) {
              g.hidden = YES;
              return;
            }
            g.hidden = NO;
            NSMutableArray* cols = [NSMutableArray array];
            for (int i = 0; i < 4; ++i) [cols addObject:(id)SvrHex(kSvrGradColors[style][i], 1.0).CGColor];
            g.colors = cols;
            g.locations = @[ @0.0, @(kSvrGradLocs[style][0]), @(kSvrGradLocs[style][1]), @1.0 ];
            g.startPoint = CGPointMake(0.5, 0.0);
            g.endPoint = CGPointMake(0.5, 1.0);
          }

          @interface SvrGradButton : UIButton
          @property(nonatomic) NSInteger style;
          @property(nonatomic) BOOL slanted;  // the tabs: the right edge leans
          @property(nonatomic) BOOL shine;    // the Start Game button: a light streak crossing it
          @property(nonatomic) BOOL caps;
          - (instancetype)initWithTitle:(NSString*)title
                                  style:(NSInteger)style
                               fontSize:(CGFloat)size
                                   kern:(CGFloat)kern
                                 radius:(CGFloat)radius
                                 insets:(NSDirectionalEdgeInsets)insets;
          @end

          @implementation SvrGradButton {
            CAGradientLayer* _grad;
            CALayer* _hi;
            CAGradientLayer* _glint;
            CGFloat _glintWidth;
            NSString* _title;
            CGFloat _size;
            CGFloat _kern;
            CGFloat _radius;
            NSInteger _style;
          }

          - (instancetype)initWithTitle:(NSString*)title
                                  style:(NSInteger)style
                               fontSize:(CGFloat)size
                                   kern:(CGFloat)kern
                                 radius:(CGFloat)radius
                                 insets:(NSDirectionalEdgeInsets)insets {
            self = [super initWithFrame:CGRectZero];
            if (!self) return nil;
            _title = [title copy];
            _size = size;
            _kern = kern;
            _radius = radius;
            _style = style;
            _caps = YES;
            _grad = [CAGradientLayer layer];
            [self.layer insertSublayer:_grad atIndex:0];
            _hi = [CALayer layer];
            _hi.backgroundColor = SvrHex(0xFFFFFF, 0.42).CGColor;
            [self.layer addSublayer:_hi];
            UIButtonConfiguration* cfg = [UIButtonConfiguration plainButtonConfiguration];
            cfg.contentInsets = insets;
            cfg.titleLineBreakMode = NSLineBreakByWordWrapping;
            cfg.background = [UIBackgroundConfiguration clearConfiguration];
            self.configuration = cfg;
            self.layer.cornerRadius = radius;
            self.layer.masksToBounds = YES;
            SvrSetGradient(_grad, style);
            _hi.hidden = style < 0 || style > 4;
            [self refreshCaption];
            return self;
          }

          - (NSInteger)style {
            return _style;
          }

          - (void)setStyle:(NSInteger)style {
            _style = style;
            SvrSetGradient(_grad, style);
            _hi.hidden = style < 0 || style > 4;
            [self refreshCaption];
          }

          - (void)setCaps:(BOOL)caps {
            _caps = caps;
            [self refreshCaption];
          }

          - (void)refreshCaption {
            UIColor* color = SVR_TEXT;
            if (_style == kSvrClear) color = SVR_DIM;
            if (_style == kSvrTab) color = SvrHex(0xdfe4ee, 1.0);
            NSMutableDictionary* attrs = [NSMutableDictionary dictionary];
            attrs[NSFontAttributeName] = SvrCondensed(_size, NO);
            attrs[NSForegroundColorAttributeName] = color;
            attrs[NSKernAttributeName] = @(_kern);
            if (_style != kSvrClear) {
              NSShadow* shadow = [[NSShadow alloc] init];
              shadow.shadowColor = SvrHex(0x000000, 0.55);
              shadow.shadowOffset = CGSizeMake(0.0, 1.0);
              shadow.shadowBlurRadius = 2.0;
              attrs[NSShadowAttributeName] = shadow;
            }
            UIButtonConfiguration* cfg = self.configuration;
            cfg.attributedTitle = [[NSAttributedString alloc] initWithString:_caps ? _title.uppercaseString : _title attributes:attrs];
            self.configuration = cfg;
          }

          - (void)updateLook {
            self.alpha = !self.enabled ? 0.45 : (self.highlighted ? 0.75 : 1.0);
          }

          - (void)setEnabled:(BOOL)enabled {
            [super setEnabled:enabled];
            [self updateLook];
          }

          - (void)setHighlighted:(BOOL)highlighted {
            [super setHighlighted:highlighted];
            [self updateLook];
          }

          - (void)layoutSubviews {
            [super layoutSubviews];
            const CGRect b = self.bounds;
            _grad.frame = b;
            _hi.frame = CGRectMake(0.0, 0.0, b.size.width, 1.0);
            if (_slanted) {
              UIBezierPath* p = [UIBezierPath bezierPath];
              [p moveToPoint:CGPointMake(0.0, 0.0)];
              [p addLineToPoint:CGPointMake(b.size.width, 0.0)];
              [p addLineToPoint:CGPointMake(b.size.width * 0.93, b.size.height)];
              [p addLineToPoint:CGPointMake(0.0, b.size.height)];
              [p closePath];
              CAShapeLayer* m = [CAShapeLayer layer];
              m.path = p.CGPath;
              self.layer.mask = m;
              self.layer.cornerRadius = 0.0;
            }
            [self startGlint];
          }

          - (void)didMoveToWindow {
            [super didMoveToWindow];
            _glintWidth = 0.0;  // (animations are dropped when a view leaves the window)
            [self startGlint];
          }

          - (void)startGlint {
            if (!_shine || self.bounds.size.width < 1.0 || !self.window) return;
            const CGFloat w = self.bounds.size.width, h = self.bounds.size.height;
            if (_glint && _glintWidth == w) return;
            _glintWidth = w;
            if (!_glint) {
              _glint = [CAGradientLayer layer];
              _glint.colors = @[ (id)SvrHex(0xFFFFFF, 0.0).CGColor, (id)SvrHex(0xFFFFFF, 0.38).CGColor, (id)SvrHex(0xFFFFFF, 0.0).CGColor ];
              _glint.startPoint = CGPointMake(0.0, 0.5);
              _glint.endPoint = CGPointMake(1.0, 0.5);
              _glint.transform = CATransform3DMakeAffineTransform(CGAffineTransformMake(1.0, 0.0, -0.364, 1.0, 0.0, 0.0));
              [self.layer addSublayer:_glint];
            }
            _glint.bounds = CGRectMake(0.0, 0.0, 60.0, h * 1.4);
            _glint.position = CGPointMake(-0.15 * w, h / 2.0);
            CAKeyframeAnimation* a = [CAKeyframeAnimation animationWithKeyPath:@"position.x"];
            a.values = @[ @(-0.15 * w), @(1.15 * w), @(1.15 * w) ];
            a.keyTimes = @[ @0.0, @0.45, @1.0 ];
            a.duration = 3.2;
            a.repeatCount = HUGE_VALF;
            [_glint addAnimation:a forKey:@"glint"];
          }

          @end

          static SvrGradButton* SvrButtonWith(NSString* title, NSInteger style, void (^onTap)(void)) {
            SvrGradButton* b = [[SvrGradButton alloc] initWithTitle:title
                                                              style:style
                                                           fontSize:14.0
                                                               kern:0.8
                                                             radius:6.0
                                                             insets:NSDirectionalEdgeInsetsMake(7.0, 14.0, 7.0, 14.0)];
            [b.heightAnchor constraintGreaterThanOrEqualToConstant:36.0].active = YES;
            [b addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              onTap();
            }] forControlEvents:UIControlEventTouchUpInside];
            return b;
          }

          static SvrGradButton* SvrButton(NSString* title, BOOL filled, void (^onTap)(void)) {
            return SvrButtonWith(title, filled ? kSvrBlue : kSvrGray, onTap);
          }

          // The on / off switch: a small bevelled slot with a square knob that shows a tick when on.
          @interface SvrSwitch : UIControl
          @property(nonatomic, getter=isOn) BOOL on;
          - (void)setOn:(BOOL)on animated:(BOOL)animated;
          @end

          @implementation SvrSwitch {
            CAGradientLayer* _track;
            CAGradientLayer* _thumb;
            CAShapeLayer* _tick;
            BOOL _on;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
            self = [super initWithFrame:CGRectMake(0.0, 0.0, 48.0, 28.0)];
            if (!self) return nil;
            _track = [CAGradientLayer layer];
            _track.cornerRadius = 7.0;
            _track.borderWidth = 1.0;
            _track.startPoint = CGPointMake(0.5, 0.0);
            _track.endPoint = CGPointMake(0.5, 1.0);
            _track.frame = CGRectMake(0.0, 0.0, 48.0, 28.0);
            [self.layer addSublayer:_track];
            _thumb = [CAGradientLayer layer];
            _thumb.cornerRadius = 4.5;
            _thumb.startPoint = CGPointMake(0.5, 0.0);
            _thumb.endPoint = CGPointMake(0.5, 1.0);
            _thumb.bounds = CGRectMake(0.0, 0.0, 20.0, 20.0);
            [self.layer addSublayer:_thumb];
            _tick = [CAShapeLayer layer];
            UIBezierPath* p = [UIBezierPath bezierPath];
            [p moveToPoint:CGPointMake(5.0, 10.5)];
            [p addLineToPoint:CGPointMake(8.5, 14.0)];
            [p addLineToPoint:CGPointMake(15.0, 6.5)];
            _tick.path = p.CGPath;
            _tick.fillColor = nil;
            _tick.strokeColor = SvrHex(0x1458c0, 1.0).CGColor;
            _tick.lineWidth = 3.0;
            _tick.lineJoin = kCALineJoinMiter;
            _tick.frame = _thumb.bounds;
            [_thumb addSublayer:_tick];
            [self addTarget:self action:@selector(tapped) forControlEvents:UIControlEventTouchUpInside];
            [self setOn:NO animated:NO];
            return self;
          }

          - (CGSize)intrinsicContentSize {
            return CGSizeMake(48.0, 28.0);
          }

          - (BOOL)isOn {
            return _on;
          }

          - (void)setOn:(BOOL)on {
            [self setOn:on animated:NO];
          }

          - (void)setOn:(BOOL)on animated:(BOOL)animated {
            _on = on;
            [CATransaction begin];
            [CATransaction setDisableActions:!animated];
            if (on) {
              SvrSetGradient(_track, kSvrBlue);
              _track.borderColor = SvrHex(0xFFFFFF, 0.30).CGColor;
              _thumb.colors = @[ (id)SvrHex(0xFFFFFF, 1.0).CGColor, (id)SvrHex(0x9aa3b2, 1.0).CGColor, (id)SvrHex(0xe8ecf2, 1.0).CGColor ];
              _thumb.locations = @[ @0.0, @0.5, @1.0 ];
              _thumb.position = CGPointMake(23.0 + 10.0, 3.0 + 10.0);
            } else {
              _track.colors = @[ (id)SvrHex(0x000000, 1.0).CGColor, (id)SvrHex(0x0b0c10, 1.0).CGColor ];
              _track.locations = @[ @0.0, @1.0 ];
              _track.borderColor = SvrHex(0xFFFFFF, 0.25).CGColor;
              _thumb.colors = @[ (id)SvrHex(0xd9dee8, 1.0).CGColor, (id)SvrHex(0x7d8594, 1.0).CGColor ];
              _thumb.locations = @[ @0.0, @1.0 ];
              _thumb.position = CGPointMake(3.0 + 10.0, 3.0 + 10.0);
            }
            _tick.opacity = on ? 1.0f : 0.0f;
            [CATransaction commit];
          }

          - (void)tapped {
            [self setOn:!_on animated:YES];
            [self sendActionsForControlEvents:UIControlEventValueChanged];
          }

          - (void)setEnabled:(BOOL)enabled {
            [super setEnabled:enabled];
            self.alpha = enabled ? 1.0 : 0.45;
          }

          @end

          static SvrSwitch* SvrToggle(BOOL on, void (^onChange)(BOOL)) {
            SvrSwitch* sw = [[SvrSwitch alloc] init];
            sw.on = on;
            __weak SvrSwitch* weakSw = sw;
            [sw addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              SvrSwitch* s = weakSw;
              if (s) onChange(s.isOn);
            }] forControlEvents:UIControlEventValueChanged];
            return sw;
          }

          // A row of choices in a black slot; the chosen one is lit blue.
          @interface SvrSegmented : UIControl
          @property(nonatomic) NSInteger selectedSegmentIndex;
          - (instancetype)initWithItems:(NSArray<NSString*>*)items;
          @end

          @implementation SvrSegmented {
            NSMutableArray<SvrGradButton*>* _buttons;
            NSInteger _selected;
          }

          - (instancetype)initWithItems:(NSArray<NSString*>*)items {
            self = [super initWithFrame:CGRectZero];
            if (!self) return nil;
            _selected = UISegmentedControlNoSegment;
            _buttons = [NSMutableArray array];
            self.backgroundColor = [UIColor blackColor];
            self.layer.cornerRadius = 7.0;
            self.layer.borderWidth = 1.0;
            self.layer.borderColor = SvrHex(0xFFFFFF, 0.19).CGColor;
            UIStackView* stack = [[UIStackView alloc] init];
            stack.axis = UILayoutConstraintAxisHorizontal;
            stack.translatesAutoresizingMaskIntoConstraints = NO;
            [self addSubview:stack];
            [NSLayoutConstraint activateConstraints:@[
              [stack.topAnchor constraintEqualToAnchor:self.topAnchor constant:3.0],
              [stack.bottomAnchor constraintEqualToAnchor:self.bottomAnchor constant:-3.0],
              [stack.leadingAnchor constraintEqualToAnchor:self.leadingAnchor constant:3.0],
              [stack.trailingAnchor constraintEqualToAnchor:self.trailingAnchor constant:-3.0],
            ]];
            __weak SvrSegmented* weakSelf = self;
            NSInteger index = 0;
            for (NSString* item in items) {
              SvrGradButton* b = [[SvrGradButton alloc] initWithTitle:item
                                                                style:kSvrClear
                                                             fontSize:12.0
                                                                 kern:0.0
                                                               radius:5.0
                                                               insets:NSDirectionalEdgeInsetsMake(0.0, 8.0, 0.0, 8.0)];
              b.caps = NO;
              {
                // one line only: a wrapped second line was clipped by the fixed 28pt height
                UIButtonConfiguration* bc = b.configuration;
                bc.titleLineBreakMode = NSLineBreakByClipping;
                b.configuration = bc;
                [b setContentCompressionResistancePriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
              }
              [b.heightAnchor constraintEqualToConstant:28.0].active = YES;
              [b setContentHuggingPriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
              const NSInteger i = index++;
              [b addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
                SvrSegmented* s = weakSelf;
                if (!s || s->_selected == i) return;
                s.selectedSegmentIndex = i;
                [s sendActionsForControlEvents:UIControlEventValueChanged];
              }] forControlEvents:UIControlEventTouchUpInside];
              [stack addArrangedSubview:b];
              [_buttons addObject:b];
            }
            return self;
          }

          - (NSInteger)selectedSegmentIndex {
            return _selected;
          }

          - (void)setSelectedSegmentIndex:(NSInteger)index {
            _selected = index;
            for (NSUInteger i = 0; i < _buttons.count; ++i) {
              _buttons[i].style = static_cast<NSInteger>(i) == index ? kSvrBlue : kSvrClear;
            }
          }

          - (void)setEnabled:(BOOL)enabled {
            [super setEnabled:enabled];
            self.alpha = enabled ? 1.0 : 0.45;
            self.userInteractionEnabled = enabled;
          }

          @end

          static SvrSegmented* SvrSegment(NSArray<NSString*>* items, NSInteger selected, void (^onChange)(NSInteger)) {
            SvrSegmented* seg = [[SvrSegmented alloc] initWithItems:items];
            seg.selectedSegmentIndex = selected;
            __weak SvrSegmented* weakSeg = seg;
            [seg addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              SvrSegmented* s = weakSeg;
              if (s) onChange(s.selectedSegmentIndex);
            }] forControlEvents:UIControlEventValueChanged];
            return seg;
          }

          // A dark glass panel (card), or the smaller flat box that holds one list entry.
          @interface SvrCardView : UIView
          @property(nonatomic, readonly) UIStackView* stack;
          - (instancetype)initAsBox:(BOOL)box;
          @end

          @implementation SvrCardView {
            CAGradientLayer* _grad;
          }

          - (instancetype)initAsBox:(BOOL)box {
            self = [super initWithFrame:CGRectZero];
            if (!self) return nil;
            self.layer.cornerRadius = box ? 6.0 : 8.0;
            self.layer.borderWidth = 1.0;
            self.layer.borderColor = SvrHex(0xFFFFFF, box ? 0.10 : 0.17).CGColor;
            self.layer.masksToBounds = YES;
            if (box) {
              self.backgroundColor = SvrHex(0x000000, 0.38);
            } else {
              _grad = [CAGradientLayer layer];
              _grad.colors = @[ (id)SvrHex(0x1c222c, 0.90).CGColor, (id)SvrHex(0x0a0d13, 0.90).CGColor, (id)SvrHex(0x05070b, 0.90).CGColor ];
              _grad.locations = @[ @0.0, @0.55, @1.0 ];
              _grad.startPoint = CGPointMake(0.5, 0.0);
              _grad.endPoint = CGPointMake(0.5, 1.0);
              [self.layer insertSublayer:_grad atIndex:0];
            }
            _stack = [[UIStackView alloc] init];
            _stack.axis = box ? UILayoutConstraintAxisHorizontal : UILayoutConstraintAxisVertical;
            _stack.alignment = box ? UIStackViewAlignmentCenter : UIStackViewAlignmentFill;
            _stack.spacing = box ? 12.0 : 10.0;
            _stack.translatesAutoresizingMaskIntoConstraints = NO;
            [self addSubview:_stack];
            const UIEdgeInsets pad = box ? UIEdgeInsetsMake(8.0, 10.0, 8.0, 10.0) : UIEdgeInsetsMake(12.0, 14.0, 12.0, 14.0);
            [NSLayoutConstraint activateConstraints:@[
              [_stack.topAnchor constraintEqualToAnchor:self.topAnchor constant:pad.top],
              [_stack.bottomAnchor constraintEqualToAnchor:self.bottomAnchor constant:-pad.bottom],
              [_stack.leadingAnchor constraintEqualToAnchor:self.leadingAnchor constant:pad.left],
              [_stack.trailingAnchor constraintEqualToAnchor:self.trailingAnchor constant:-pad.right],
            ]];
            return self;
          }

          - (void)layoutSubviews {
            [super layoutSubviews];
            _grad.frame = self.bounds;
          }

          @end

          static SvrCardView* SvrCard(NSArray<UIView*>* views) {
            SvrCardView* card = [[SvrCardView alloc] initAsBox:NO];
            for (UIView* v in views) [card.stack addArrangedSubview:v];
            return card;
          }

          // One list entry: a bold title with a small line under it, and its controls on the right.
          static UIView* SvrRowBox(NSString* title, NSString* sub, NSArray<UIView*>* controls) {
            SvrCardView* box = [[SvrCardView alloc] initAsBox:YES];
            UIStackView* text = [[UIStackView alloc] init];
            text.axis = UILayoutConstraintAxisVertical;
            text.spacing = 2.0;
            [text addArrangedSubview:SvrLabel(title, 15.0, SVR_TEXT, YES)];
            if (sub.length > 0) [text addArrangedSubview:SvrLabel(sub, 12.0, SVR_DIM, NO)];
            [text setContentHuggingPriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisHorizontal];
            [box.stack addArrangedSubview:text];
            for (UIView* c in controls) {
              [c setContentHuggingPriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
              [c setContentCompressionResistancePriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
              [box.stack addArrangedSubview:c];
            }
            return box;
          }

          // A label with a smaller grey line under it on the left, its control on the right.
          static UIView* SvrHintRow(NSString* title, NSString* hint, UIView* control) {
            NSMutableAttributedString* a = [[NSMutableAttributedString alloc]
                initWithString:title
                    attributes:@{NSFontAttributeName : [UIFont systemFontOfSize:15.0], NSForegroundColorAttributeName : SVR_TEXT}];
            [a appendAttributedString:[[NSAttributedString alloc]
                                          initWithString:[@"\n" stringByAppendingString:hint]
                                              attributes:@{NSFontAttributeName : [UIFont systemFontOfSize:12.0], NSForegroundColorAttributeName : SVR_DIM}]];
            UILabel* label = [[UILabel alloc] init];
            label.numberOfLines = 0;
            label.attributedText = a;
            [label setContentHuggingPriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisHorizontal];
            [control setContentHuggingPriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
            [control setContentCompressionResistancePriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
            UIStackView* row = [[UIStackView alloc] initWithArrangedSubviews:@[ label, control ]];
            row.axis = UILayoutConstraintAxisHorizontal;
            row.alignment = UIStackViewAlignmentCenter;
            row.spacing = 12.0;
            return row;
          }

          // A label on the left, its control on the right.
          static UIView* SvrRow(NSString* title, UIView* control) {
            UILabel* label = SvrLabel(title, 15.0, SVR_TEXT, NO);
            [label setContentHuggingPriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisHorizontal];
            [control setContentHuggingPriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
            [control setContentCompressionResistancePriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
            UIStackView* row = [[UIStackView alloc] initWithArrangedSubviews:@[ label, control ]];
            row.axis = UILayoutConstraintAxisHorizontal;
            row.alignment = UIStackViewAlignmentCenter;
            row.spacing = 12.0;
            return row;
          }

          static UITextField* SvrField(NSString* placeholder, BOOL secure) {
            UITextField* f = [[UITextField alloc] init];
            f.borderStyle = UITextBorderStyleNone;
            f.backgroundColor = [UIColor blackColor];
            f.layer.cornerRadius = 6.0;
            f.layer.borderWidth = 1.0;
            f.layer.borderColor = SvrHex(0xFFFFFF, 0.19).CGColor;
            f.textColor = [UIColor whiteColor];
            f.font = [UIFont systemFontOfSize:15.0];
            f.attributedPlaceholder = [[NSAttributedString alloc] initWithString:placeholder ? placeholder : @""
                                                                      attributes:@{NSForegroundColorAttributeName : SVR_DIM}];
            f.leftView = [[UIView alloc] initWithFrame:CGRectMake(0.0, 0.0, 10.0, 10.0)];
            f.leftViewMode = UITextFieldViewModeAlways;
            f.secureTextEntry = secure;
            f.autocapitalizationType = UITextAutocapitalizationTypeNone;
            f.autocorrectionType = UITextAutocorrectionTypeNo;
            f.spellCheckingType = UITextSpellCheckingTypeNo;
            f.returnKeyType = UIReturnKeyDone;
            f.keyboardAppearance = UIKeyboardAppearanceDark;
            [f.heightAnchor constraintGreaterThanOrEqualToConstant:36.0].active = YES;
            __weak UITextField* weakField = f;
            [f addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              [weakField resignFirstResponder];
            }] forControlEvents:UIControlEventEditingDidEndOnExit];
            return f;
          }

          // A small caption above a field.
          static UIView* SvrFieldRow(NSString* title, UIView* field) {
            UIStackView* s = [[UIStackView alloc] initWithArrangedSubviews:@[ SvrLabel(title, 13.0, SVR_DIM, NO), field ]];
            s.axis = UILayoutConstraintAxisVertical;
            s.spacing = 4.0;
            return s;
          }

          // A scrolling page: a vertical stack as wide as the page.
          static UIScrollView* SvrScrollPage(UIStackView** outStack) {
            UIScrollView* scroll = [[UIScrollView alloc] init];
            scroll.keyboardDismissMode = UIScrollViewKeyboardDismissModeInteractive;
            scroll.alwaysBounceVertical = YES;
            scroll.indicatorStyle = UIScrollViewIndicatorStyleWhite;
            scroll.contentInset = UIEdgeInsetsMake(8.0, 0.0, 8.0, 0.0);
            UIStackView* stack = [[UIStackView alloc] init];
            stack.axis = UILayoutConstraintAxisVertical;
            stack.spacing = 10.0;
            stack.translatesAutoresizingMaskIntoConstraints = NO;
            [scroll addSubview:stack];
            [NSLayoutConstraint activateConstraints:@[
              [stack.topAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.topAnchor],
              [stack.bottomAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.bottomAnchor],
              [stack.leadingAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.leadingAnchor],
              [stack.trailingAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.trailingAnchor],
              [stack.widthAnchor constraintEqualToAnchor:scroll.frameLayoutGuide.widthAnchor],
            ]];
            *outStack = stack;
            return scroll;
          }

          // ---- the Settings page ----

          static UIView* SvrBuildSettingsPage(void) {
            UIStackView* stack = nil;
            UIScrollView* page = SvrScrollPage(&stack);

            if (!SvrFileExists(SvrConfigPath())) {
              [stack addArrangedSubview:SvrCard(@[ SvrLabel(@"The settings file does not exist yet.\nPress Start Game once so the game creates it, then come back here.",
                                                            14.0, SVR_DIM, NO) ])];
              return page;
            }

            // Both overlay keys missing: the game would show the frame rate (its own default). The launcher's defaults
            // are "off" and "false", so write them: what the page shows is then what the game does.
            {
              const std::vector<std::string> first = SvrReadConfig();
              if (SvrGet(first, "perf_overlay", "?") == "?" && SvrGet(first, "show_fps", "?") == "?") {
                SvrSet("perf_overlay", "0");
                SvrSet("show_fps", "false");
              }
            }

            const std::vector<std::string> cfg = SvrReadConfig();
            NSMutableArray<UIView*>* quality = [NSMutableArray array];  // the first card: resolution, textures, AA, frame rate, overlay
            NSMutableArray<UIView*>* options = [NSMutableArray array];  // the second card: the on / off options
            NSMutableArray<UIView*>* gameplay = [NSMutableArray array];  // the third card: Created Superstar limits, intros, practice ring

            // Resolution: the three keys the in-game "RENDER RESOLUTION" row sets together.
            {
              const int max_scale = std::atoi(SvrGet(cfg, "native_max_scale", "1").c_str());
              const double res = std::atof(SvrGet(cfg, "native_render_scale", "1").c_str());
              const int height = std::atoi(SvrGet(cfg, "native_scene_height", "0").c_str());
              NSInteger current = UISegmentedControlNoSegment;
              for (NSInteger i = 0; i < 5; ++i) {
                if (kSvrScales[i].max_scale == max_scale && std::fabs(kSvrScales[i].res - res) < 0.01 &&
                    kSvrScales[i].height == height) {
                  current = i;
                }
              }
              [quality addObject:SvrRow(@"Resolution", SvrSegment(@[ @"360p", @"480p", @"720p", @"900p", @"1080p" ], current,
                                                                  ^(NSInteger i) {
                if (i < 0 || i > 4) return;
                char buf[16];
                std::snprintf(buf, sizeof(buf), "%.4f", kSvrScales[i].res);
                SvrSet("native_max_scale", std::to_string(kSvrScales[i].max_scale));
                SvrSet("native_render_scale", buf);
                SvrSet("native_scene_height", std::to_string(kSvrScales[i].height));
              }))];
            }

            // Texture quality (shown Low, Medium, High; kSvrTextureQualities is High, Medium, Low)
            {
              const std::string q = SvrGet(cfg, "native_texture_quality", "high");
              NSInteger current = 2;
              for (NSInteger i = 0; i < 3; ++i) {
                if (q == kSvrTextureQualities[i]) current = 2 - i;
              }
              [quality addObject:SvrRow(@"Textures", SvrSegment(@[ @"Low", @"Medium", @"High" ], current, ^(NSInteger i) {
                if (i < 0 || i > 2) return;
                SvrSet("native_texture_quality", std::string("\"") + kSvrTextureQualities[2 - i] + "\"");
              }))];
            }

            // Anti-aliasing: native_aa 1 (off), 2x, 3x, 4x; native_2x_msaa follows.
            {
              int aa = std::atoi(SvrGet(cfg, "native_aa", "0").c_str());
              if (aa < 1 || aa > 4) aa = SvrGet(cfg, "native_2x_msaa", "true") == "false" ? 1 : 2;
              [quality addObject:SvrRow(@"Anti-aliasing", SvrSegment(@[ @"Off", @"2x", @"3x", @"4x" ], aa - 1, ^(NSInteger i) {
                if (i < 0 || i > 3) return;
                const int value = static_cast<int>(i) + 1;
                SvrSet("native_aa", std::to_string(value));
                SvrSet("native_2x_msaa", value >= 2 ? "true" : "false");
              }))];
            }

            // Frame rate
            {
              const int fps = std::atoi(SvrGet(cfg, "frame_rate", "60").c_str());
              [quality addObject:SvrRow(@"Frame rate", SvrSegment(@[ @"30 FPS (original)", @"60 FPS" ], fps == 30 ? 0 : 1, ^(NSInteger i) {
                SvrSet("frame_rate", i == 0 ? "30" : "60");
              }))];
            }

            // Performance overlay (perf_overlay 0 off, 1 minimal, 2 extended) and Show FPS (show_fps): the game takes the
            // overlay's level when it is set, and show_fps only when it is not - so the two are kept in step here.
            UIView* fpsRow = nil;
            __block __weak SvrSegmented* overlaySeg = nil;
            __block __weak SvrSwitch* fpsSwitch = nil;
            {
              const int perf = std::atoi(SvrGet(cfg, "perf_overlay", "-1").c_str());
              const int level = perf >= 0 ? std::min(perf, 2) : (SvrGet(cfg, "show_fps", "false") == "true" ? 1 : 0);
              SvrSegmented* seg = SvrSegment(@[ @"Off", @"Minimal", @"Extended" ], level, ^(NSInteger i) {
                if (i < 0 || i > 2) return;
                SvrSet("perf_overlay", std::to_string(i));
                SvrSet("show_fps", i > 0 ? "true" : "false");
                SvrSwitch* sw = fpsSwitch;
                if (sw) sw.on = i > 0;
              });
              overlaySeg = seg;
              [quality addObject:SvrHintRow(@"Performance overlay", @"Minimal: the frame rate. Extended: also the game's memory.", seg)];

              SvrSwitch* fps = SvrToggle(level > 0, ^(BOOL on) {
                SvrSegmented* s = overlaySeg;
                const NSInteger current = s ? s.selectedSegmentIndex : 0;
                const NSInteger next = on ? (current > 0 ? current : 1) : 0;
                SvrSet("show_fps", on ? "true" : "false");
                SvrSet("perf_overlay", std::to_string(next));
                if (s) s.selectedSegmentIndex = next;
              });
              fpsSwitch = fps;
              fpsRow = SvrHintRow(@"Show FPS", @"The frame rate in a corner of the screen.", fps);
            }

            // On / off options
            [options addObject:SvrRow(@"Soft filter", SvrToggle(SvrGet(cfg, "soft_filter", "false") == "true", ^(BOOL on) {
              SvrSet("soft_filter", on ? "true" : "false");
            }))];
            [options addObject:SvrRow(@"Motion blur", SvrToggle(SvrGet(cfg, "motion_blur", "true") == "true", ^(BOOL on) {
              SvrSet("motion_blur", on ? "true" : "false");
            }))];
            [options addObject:SvrRow(@"Depth of field", SvrToggle(SvrGet(cfg, "depth_of_field", "true") == "true", ^(BOOL on) {
              SvrSet("depth_of_field", on ? "true" : "false");
            }))];
            [options addObject:SvrRow(@"Crowd", SvrToggle(SvrGet(cfg, "arena_crowd", "on") != "off", ^(BOOL on) {
              SvrSet("arena_crowd", on ? "\"on\"" : "\"off\"");
            }))];
            [options addObject:SvrHintRow(@"VSync", @"No tearing: waits for the screen's refresh.", SvrToggle(SvrGet(cfg, "vsync", "true") == "true", ^(BOOL on) {
              SvrSet("vsync", on ? "true" : "false");
            }))];
            [options addObject:fpsRow];
            [options addObject:SvrRow(@"Touch controls", SvrToggle(SvrGet(cfg, "touch_controls", "true") == "true", ^(BOOL on) {
              SvrSet("touch_controls", on ? "true" : "false");
            }))];

            // The game
            [gameplay addObject:SvrHintRow(@"Create a Superstar: no limits", @"No points budget; stack any parts (they may clip). Off: the game's own limits.",
                                           SvrToggle(SvrGet(cfg, "caw_no_limits", "true") == "true", ^(BOOL on) {
              SvrSet("caw_no_limits", on ? "true" : "false");
            }))];
            [gameplay addObject:SvrHintRow(@"Skip the intro movies", @"Straight to the Start Screen at launch.",
                                           SvrToggle(SvrGet(cfg, "skip_intros", "false") == "true", ^(BOOL on) {
              SvrSet("skip_intros", on ? "true" : "false");
            }))];
            [gameplay addObject:SvrHintRow(@"Skip the practice ring", @"Straight to the main menu after the Start Screen.",
                                           SvrToggle(SvrGet(cfg, "skip_training", "false") == "true", ^(BOOL on) {
              SvrSet("skip_training", on ? "true" : "false");
            }))];

            [stack addArrangedSubview:SvrCard(quality)];
            [stack addArrangedSubview:SvrCard(options)];
            [stack addArrangedSubview:SvrCard(gameplay)];
            return page;
          }

          // ---- the Online page: server, account, friends (the server's JSON API, as on Android) ----

          static NSString* const kSvrDefaultServer = @"https://sho-ti.me/svr";
          static NSString* const kSvrCustomServer = @"127.0.0.1:8411";

          // GETs (body nil) or POSTs JSON; calls `done` on the main queue with the answer's JSON (any status,
          // "_status" added) or, when the server could not be reached, a failure text.
          static void SvrRequest(NSString* url, NSDictionary* body, NSString* token,
                                 void (^done)(NSDictionary* json, NSString* failure)) {
            NSURL* u = [NSURL URLWithString:url];
            if (!u) {
              done(nil, @"the server address is not valid");
              return;
            }
            NSMutableURLRequest* req = [NSMutableURLRequest requestWithURL:u
                                                               cachePolicy:NSURLRequestReloadIgnoringLocalCacheData
                                                           timeoutInterval:20.0];
            req.HTTPMethod = body ? @"POST" : @"GET";
            if (token.length) [req setValue:[@"Bearer " stringByAppendingString:token] forHTTPHeaderField:@"Authorization"];
            if (body) {
              [req setValue:@"application/json" forHTTPHeaderField:@"Content-Type"];
              req.HTTPBody = [NSJSONSerialization dataWithJSONObject:body options:0 error:nil];
            }
            NSURLSessionDataTask* task = [[NSURLSession sharedSession]
                dataTaskWithRequest:req
                  completionHandler:^(NSData* data, NSURLResponse* response, NSError* error) {
                    NSMutableDictionary* json = [NSMutableDictionary dictionary];
                    NSString* failure = nil;
                    if (error) {
                      failure = error.localizedDescription;
                    } else {
                      id parsed = data.length ? [NSJSONSerialization JSONObjectWithData:data options:0 error:nil] : nil;
                      if ([parsed isKindOfClass:[NSDictionary class]]) [json addEntriesFromDictionary:parsed];
                      json[@"_status"] = @([(NSHTTPURLResponse*)response statusCode]);
                    }
                    dispatch_async(dispatch_get_main_queue(), ^{
                      done(failure ? nil : json, failure);
                    });
                  }];
            [task resume];
          }

          static NSString* SvrErrorText(NSDictionary* r, NSString* failure, BOOL create) {
            if (r) {
              id e = r[@"error"];
              if ([e isKindOfClass:[NSString class]] && [(NSString*)e length]) return e;
              const NSInteger code = [r[@"_status"] integerValue];
              if (code == 403) return create ? @"That name is taken." : @"Wrong name or password.";
              if (code == 429) return @"Too many tries - wait a little and try again.";
              return [NSString stringWithFormat:@"The server said no (%ld).", (long)code];
            }
            return failure.length ? [@"Could not reach the server: " stringByAppendingString:failure]
                                  : @"Could not reach the server.";
          }

          @interface SvrOnlinePage : NSObject
          @property(nonatomic, strong) UIScrollView* view;
          @property(nonatomic) BOOL busy;
          @property(nonatomic) BOOL friendsBusy;
          - (void)refresh;
          @end

          @implementation SvrOnlinePage {
            UIStackView* _main;
            UIView* _noFile;
            UIView* _options;
            UIStackView* _cols;
            SvrSwitch* _enabled;
            SvrSegmented* _kind;
            UITextField* _address;
            UITextField* _name;
            UITextField* _password;
            UITextField* _friendName;
            UILabel* _who;
            UILabel* _accountStatus;
            UILabel* _friendsStatus;
            UIStackView* _serverBox;
            UIStackView* _signedIn;
            UIStackView* _signedOut;
            UIView* _accountCard;
            UIView* _friendsBox;
            UIStackView* _friendRows;
            UIButton* _signInBtn;
            UIButton* _createBtn;
            UIButton* _signOutBtn;
          }

          - (instancetype)init {
            self = [super init];
            if (!self) return nil;
            UIStackView* stack = nil;
            _view = SvrScrollPage(&stack);
            _main = stack;
            __weak SvrOnlinePage* weakSelf = self;

            _noFile = SvrCard(@[ SvrLabel(@"The settings file does not exist yet.\nPress Start Game once so the game creates it, then come back here.",
                                          14.0, SVR_DIM, NO) ]);
            [stack addArrangedSubview:_noFile];

            _enabled = SvrToggle(NO, ^(BOOL on) {
              SvrSet("online_enabled", on ? "true" : "false");
            });
            _kind = SvrSegment(@[ @"Default", @"Custom" ], 0, ^(NSInteger i) {
              [weakSelf serverKindChanged:i];
            });
            _address = SvrField(kSvrCustomServer, NO);
            _address.keyboardType = UIKeyboardTypeURL;
            [_address addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              [weakSelf saveServer];
            }] forControlEvents:UIControlEventEditingDidEnd];
            _serverBox = [[UIStackView alloc] initWithArrangedSubviews:@[ SvrFieldRow(@"Address", _address) ]];
            _serverBox.axis = UILayoutConstraintAxisVertical;
            _options = SvrCard(@[
              SvrLabel(@"Community Creations: share Created Superstars, Paint Tool logos, highlight reels and more with other players, through a Community Creations server (the original servers closed in 2014). Online matches too: Player Match and Royal Rumble.",
                       13.0, SVR_DIM, NO),
              SvrRow(@"Play online", _enabled), SvrRow(@"Server", _kind), _serverBox
            ]);
            [stack addArrangedSubview:_options];

            _who = SvrLabel(@"", 15.0, SVR_TEXT, NO);
            _signedIn = [[UIStackView alloc] initWithArrangedSubviews:@[ _who ]];
            _signedIn.axis = UILayoutConstraintAxisVertical;
            _name = SvrField(@"3-15 letters, digits, space _ . -", NO);
            _password = SvrField(@"at least 6 characters", YES);
            _signedOut = [[UIStackView alloc] initWithArrangedSubviews:@[ SvrFieldRow(@"Name", _name), SvrFieldRow(@"Password", _password) ]];
            _signedOut.axis = UILayoutConstraintAxisVertical;
            _signedOut.spacing = 8.0;
            _accountStatus = SvrLabel(@"", 13.0, SVR_DIM, NO);
            _signInBtn = SvrButton(@"Sign in", YES, ^{
              [weakSelf signIn:NO];
            });
            _createBtn = SvrButton(@"Create account", NO, ^{
              [weakSelf signIn:YES];
            });
            _signOutBtn = SvrButton(@"Sign out", NO, ^{
              [weakSelf signOut];
            });
            UIStackView* buttons = [[UIStackView alloc] initWithArrangedSubviews:@[ _signInBtn, _createBtn, _signOutBtn ]];
            buttons.axis = UILayoutConstraintAxisVertical;
            buttons.spacing = 8.0;
            _accountCard = SvrCard(@[ SvrHeading(@"Account"), _signedIn, _signedOut, _accountStatus, buttons ]);

            _friendRows = [[UIStackView alloc] init];
            _friendRows.axis = UILayoutConstraintAxisVertical;
            _friendsStatus = SvrLabel(@"", 13.0, SVR_DIM, NO);
            _friendName = SvrField(@"Type a name, or tap a friend", NO);
            UIButton* add = SvrButton(@"Add friend", YES, ^{
              [weakSelf changeFriend:YES];
            });
            UIButton* remove = SvrButton(@"Remove", NO, ^{
              [weakSelf changeFriend:NO];
            });
            UIButton* reload = SvrButton(@"Refresh", NO, ^{
              [weakSelf fetchFriends:nil];
            });
            UIStackView* friendButtons = [[UIStackView alloc] initWithArrangedSubviews:@[ add, remove ]];
            friendButtons.axis = UILayoutConstraintAxisHorizontal;
            friendButtons.spacing = 8.0;
            friendButtons.distribution = UIStackViewDistributionFillEqually;
            [reload setContentHuggingPriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
            UIStackView* friendsHead = [[UIStackView alloc] initWithArrangedSubviews:@[ SvrHeading(@"Friends"), reload ]];
            friendsHead.axis = UILayoutConstraintAxisHorizontal;
            friendsHead.alignment = UIStackViewAlignmentCenter;
            friendsHead.spacing = 8.0;
            _friendsBox = SvrCard(@[ friendsHead, _friendRows, _friendsStatus, _friendName, friendButtons ]);

            // (Account and Friends side by side; with nobody signed in the account card has the whole width)
            _cols = [[UIStackView alloc] initWithArrangedSubviews:@[ _accountCard, _friendsBox ]];
            _cols.axis = UILayoutConstraintAxisHorizontal;
            _cols.spacing = 10.0;
            _cols.alignment = UIStackViewAlignmentTop;
            _cols.distribution = UIStackViewDistributionFillEqually;
            [stack addArrangedSubview:_cols];

            [self refresh];
            return self;
          }

          + (NSString*)baseFor:(NSString*)server {
            NSString* b = [server containsString:@"://"] ? server : [@"http://" stringByAppendingString:server];
            while ([b hasSuffix:@"/"]) b = [b substringToIndex:b.length - 1];
            return b;
          }

          + (BOOL)validName:(NSString*)n {
            if (n.length < 3 || n.length > 15) return NO;
            for (NSUInteger i = 0; i < n.length; ++i) {
              const unichar c = [n characterAtIndex:i];
              const BOOL ok = (c >= '0' && c <= '9') || (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c == ' ' ||
                              c == '_' || c == '.' || c == '-';
              if (!ok) return NO;
            }
            return YES;
          }

          - (NSString*)currentServer {
            return SvrNS(SvrGet(SvrReadConfig(), "online_server", SvrStd(kSvrDefaultServer)));
          }

          // Reads the saved state into the controls.
          - (void)refresh {
            const BOOL hasFile = SvrFileExists(SvrConfigPath());
            _noFile.hidden = hasFile;
            _options.hidden = !hasFile;
            _cols.hidden = !hasFile;
            if (!hasFile) return;
            const std::vector<std::string> cfg = SvrReadConfig();
            _enabled.on = SvrGet(cfg, "online_enabled", "false") == "true";
            const std::string server = SvrGet(cfg, "online_server", SvrStd(kSvrDefaultServer));
            const BOOL custom = !server.empty() && server != SvrStd(kSvrDefaultServer);
            _kind.selectedSegmentIndex = custom ? 1 : 0;
            _serverBox.hidden = !custom;
            _address.text = custom ? SvrNS(server) : kSvrCustomServer;
            [self refreshAccount];
          }

          - (void)refreshAccount {
            const std::vector<std::string> cfg = SvrReadConfig();
            const std::string token = SvrGet(cfg, "online_token", "");
            const std::string name = SvrGet(cfg, "online_name", "");
            const std::string server = SvrGet(cfg, "online_server", SvrStd(kSvrDefaultServer));
            const BOOL custom = !server.empty() && server != SvrStd(kSvrDefaultServer);
            const BOOL in = !token.empty();
            _signedIn.hidden = !in;
            _signedOut.hidden = in;
            _who.text = [NSString stringWithFormat:@"Signed in as %@%@.", SvrNS(name),
                                                   custom ? [@" on " stringByAppendingString:SvrNS(server)] : @""];
            if (!in && _name.text.length == 0) _name.text = SvrNS(name);
            _signInBtn.hidden = in;
            _createBtn.hidden = in;
            _signOutBtn.hidden = !in;
            // (an account works on the server that made it: sign out to change servers)
            _kind.enabled = !in;
            _address.enabled = !in;
            _signInBtn.enabled = !self.busy;
            _createBtn.enabled = !self.busy;
            _signOutBtn.enabled = !self.busy;
            _friendsBox.hidden = !in;
            if (in) {
              [self fetchFriends:nil];
            } else {
              for (UIView* v in [_friendRows.arrangedSubviews copy]) [v removeFromSuperview];
            }
          }

          - (void)serverKindChanged:(NSInteger)i {
            const BOOL custom = i == 1;
            _serverBox.hidden = !custom;
            if (custom && _address.text.length == 0) _address.text = kSvrCustomServer;
            [self saveServer];
          }

          - (void)saveServer {
            const BOOL custom = _kind.selectedSegmentIndex == 1;
            const std::string value = custom ? SvrTrim(SvrStd(_address.text)) : SvrStd(kSvrDefaultServer);
            if (custom && value.empty()) return;
            SvrSet("online_server", SvrQuote(value));
          }

          - (void)signIn:(BOOL)create {
            if (self.busy) return;
            NSString* name = [_name.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
            NSString* password = _password.text ? _password.text : @"";
            if (![SvrOnlinePage validName:name]) {
              _accountStatus.text = @"Names are 3-15 letters, digits, spaces or _ . -";
              return;
            }
            if (password.length < 6) {
              _accountStatus.text = @"Passwords are at least 6 characters.";
              return;
            }
            self.busy = YES;
            _accountStatus.text = create ? @"Creating the account…" : @"Signing in…";
            [self refreshAccount];
            NSString* base = [SvrOnlinePage baseFor:[self currentServer]];
            __weak SvrOnlinePage* weakSelf = self;
            SvrRequest([base stringByAppendingString:create ? @"/api/register" : @"/api/login"],
                       @{@"name" : name, @"password" : password}, nil, ^(NSDictionary* r, NSString* failure) {
                         [weakSelf finishSignIn:r failure:failure create:create name:name];
                       });
          }

          - (void)finishSignIn:(NSDictionary*)r failure:(NSString*)failure create:(BOOL)create name:(NSString*)name {
            self.busy = NO;
            if (r && [r[@"ok"] boolValue]) {
              std::string shown = SvrStr(r[@"name"]);
              if (shown.empty()) shown = SvrStd(name);
              SvrSet("online_token", SvrQuote(SvrStr(r[@"token"])));
              SvrSet("online_xuid", SvrQuote(SvrStr(r[@"xuid"])));
              SvrSet("online_name", SvrQuote(shown));
              SvrSet("online_enabled", "true");
              _password.text = @"";
              _accountStatus.text = create ? @"Account created. Signed in - online play is on."
                                           : @"Signed in - online play is on.";
              [self refresh];
            } else {
              _accountStatus.text = SvrErrorText(r, failure, create);
              [self refreshAccount];
            }
          }

          - (void)signOut {
            if (self.busy) return;
            const std::string token = SvrGet(SvrReadConfig(), "online_token", "");
            NSString* base = [SvrOnlinePage baseFor:[self currentServer]];
            self.busy = YES;
            [self refreshAccount];
            __weak SvrOnlinePage* weakSelf = self;
            // (signed out here whatever the server says)
            SvrRequest([base stringByAppendingString:@"/api/logout"], @{}, SvrNS(token),
                       ^(NSDictionary* r, NSString* failure) {
                         [weakSelf finishSignOut];
                       });
          }

          - (void)finishSignOut {
            self.busy = NO;
            SvrSet("online_token", "\"\"");
            SvrSet("online_xuid", "\"\"");
            _accountStatus.text = @"Signed out.";
            [self refreshAccount];
          }

          // body nil: the list; else {"add": name} / {"remove": name}.
          - (void)fetchFriends:(NSDictionary*)body {
            const std::string token = SvrGet(SvrReadConfig(), "online_token", "");
            if (token.empty() || self.friendsBusy) return;
            self.friendsBusy = YES;
            NSString* url = [[SvrOnlinePage baseFor:[self currentServer]] stringByAppendingString:@"/api/friends"];
            __weak SvrOnlinePage* weakSelf = self;
            SvrRequest(url, body, SvrNS(token), ^(NSDictionary* r, NSString* failure) {
              SvrOnlinePage* s = weakSelf;
              if (!s) return;
              s.friendsBusy = NO;
              [s showFriends:r failure:failure];
            });
          }

          - (void)addFriendRow:(NSString*)name status:(NSString*)status online:(BOOL)on {
            UIButtonConfiguration* cfg = [UIButtonConfiguration plainButtonConfiguration];
            cfg.title = [NSString stringWithFormat:@"%@   -   %@", name, status];
            cfg.baseForegroundColor = on ? SVR_OK : SVR_TEXT;
            UIButton* row = [UIButton buttonWithConfiguration:cfg primaryAction:nil];
            row.contentHorizontalAlignment = UIControlContentHorizontalAlignmentLeading;
            __weak UITextField* field = _friendName;
            [row addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              field.text = name;
            }] forControlEvents:UIControlEventTouchUpInside];
            [_friendRows addArrangedSubview:row];
          }

          - (void)showFriends:(NSDictionary*)r failure:(NSString*)failure {
            if (SvrGet(SvrReadConfig(), "online_token", "").empty()) return;
            id list = r ? r[@"friends"] : nil;
            if (![list isKindOfClass:[NSArray class]]) {
              const NSInteger code = [r[@"_status"] integerValue];
              id e = r ? r[@"error"] : nil;
              const BOOL noError = ![e isKindOfClass:[NSString class]] || [(NSString*)e length] == 0;
              _friendsStatus.text = (r && code == 404 && noError) ? @"This server has no friends list yet."
                                                                  : SvrErrorText(r, failure, NO);
              return;
            }
            for (UIView* v in [_friendRows.arrangedSubviews copy]) [v removeFromSuperview];
            NSUInteger online = 0;
            for (id item in (NSArray*)list) {
              if (![item isKindOfClass:[NSDictionary class]]) continue;
              NSDictionary* f = item;
              NSString* status = [f[@"status"] isKindOfClass:[NSString class]] ? f[@"status"] : @"";
              NSString* name = [f[@"name"] isKindOfClass:[NSString class]] ? f[@"name"] : @"";
              NSString* label = @"Offline";
              if ([status isEqualToString:@"playing"]) {
                label = @"In an online match";
                online++;
              } else if ([status isEqualToString:@"online"]) {
                label = @"Online";
                online++;
              } else if (![f[@"mutual"] boolValue]) {
                label = @"Offline (hasn't added you)";
              }
              [self addFriendRow:name status:label online:![status isEqualToString:@"offline"]];
            }
            id added = r[@"added_you"];
            if ([added isKindOfClass:[NSArray class]]) {
              for (id n in (NSArray*)added) {
                if ([n isKindOfClass:[NSString class]]) [self addFriendRow:n status:@"Added you - add them back" online:NO];
              }
            }
            const NSUInteger count = [(NSArray*)list count];
            NSMutableString* text = [NSMutableString string];
            if (count == 0) {
              [text appendString:@"No friends yet: type a player's name and add them."];
            } else {
              [text appendFormat:@"%lu of %lu friend%@ online.", (unsigned long)online, (unsigned long)count,
                                 count == 1 ? @"" : @"s"];
            }
            id now = r[@"online_now"];
            if ([now isKindOfClass:[NSNumber class]] && [now integerValue] >= 0) {
              [text appendFormat:@"  %ld player%@ playing now.", (long)[now integerValue], [now integerValue] == 1 ? @"" : @"s"];
            }
            _friendsStatus.text = text;
          }

          - (void)changeFriend:(BOOL)add {
            NSString* name = [_friendName.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
            if (name.length == 0) {
              _friendsStatus.text = add ? @"Type the player's name to add." : @"Tap a friend (or type the name) to remove.";
              return;
            }
            NSString* action = add ? @"add" : @"remove";
            [self fetchFriends:@{action : name}];
            if (add) _friendName.text = @"";
          }

          @end

          // ---- the Install page: the game from an Xbox 360 disc image (XDVDFS), as the Android launcher does ----

          static const uint64_t kSvrSector = 2048;
          static const uint64_t kSvrBases[] = {0, 0x18300000ULL, 0xFD90000ULL, 0x2080000ULL};  // XISO, XGD2, XGD1, XGD3
          static const uint32_t kSvrTitleId = 0x5451085D;
          static const uint64_t kSvrXexSize = 15020032;
          static const uint32_t kSvrXexCrc = 0xD2719517;
          static std::atomic<bool> gSvrCancel{false};

          struct SvrEntry {
            std::string path;
            uint64_t sector = 0;
            uint64_t size = 0;
            bool dir = false;
          };

          struct SvrDisc {
            int fd = -1;
            uint64_t base = 0;
            std::vector<SvrEntry> entries;
          };

          static bool SvrPread(int fd, uint64_t at, void* buf, size_t n) {
            uint8_t* p = static_cast<uint8_t*>(buf);
            while (n > 0) {
              const ssize_t r = pread(fd, p, n, static_cast<off_t>(at));
              if (r <= 0) return false;
              p += r;
              at += static_cast<uint64_t>(r);
              n -= static_cast<size_t>(r);
            }
            return true;
          }

          static uint32_t SvrLe16(const uint8_t* b) { return static_cast<uint32_t>(b[0]) | static_cast<uint32_t>(b[1]) << 8; }
          static uint32_t SvrLe32(const uint8_t* b) {
            return static_cast<uint32_t>(b[0]) | static_cast<uint32_t>(b[1]) << 8 | static_cast<uint32_t>(b[2]) << 16 |
                   static_cast<uint32_t>(b[3]) << 24;
          }
          static uint32_t SvrBe32(const uint8_t* b) {
            return static_cast<uint32_t>(b[3]) | static_cast<uint32_t>(b[2]) << 8 | static_cast<uint32_t>(b[1]) << 16 |
                   static_cast<uint32_t>(b[0]) << 24;
          }

          static uint32_t SvrCrc32(uint32_t crc, const uint8_t* p, size_t n) {
            static uint32_t table[256];
            static bool ready = false;
            if (!ready) {
              for (uint32_t i = 0; i < 256; ++i) {
                uint32_t c = i;
                for (int k = 0; k < 8; ++k) c = (c & 1) ? (0xEDB88320u ^ (c >> 1)) : (c >> 1);
                table[i] = c;
              }
              ready = true;
            }
            crc = ~crc;
            while (n--) crc = table[(crc ^ *p++) & 0xFF] ^ (crc >> 8);
            return ~crc;
          }

          static NSString* SvrHuman(uint64_t bytes) {
            if (bytes >= (1ULL << 30)) return [NSString stringWithFormat:@"%.1f GB", static_cast<double>(bytes) / 1073741824.0];
            if (bytes >= (1ULL << 20)) return [NSString stringWithFormat:@"%.0f MB", static_cast<double>(bytes) / 1048576.0];
            return [NSString stringWithFormat:@"%.0f KB", static_cast<double>(bytes) / 1024.0];
          }

          static uint64_t SvrFreeBytes(const std::string& dir) {
            struct statfs s;
            if (statfs(dir.c_str(), &s) != 0) return 0;
            return static_cast<uint64_t>(s.f_bavail) * static_cast<uint64_t>(s.f_bsize);
          }

          // A directory table, in stored order (as the PC launcher walks it).
          static void SvrReadDir(SvrDisc& d, uint64_t sector, uint64_t size, const std::string& prefix, int depth) {
            if (depth > 32 || size == 0 || size > (64u << 20)) return;
            std::vector<uint8_t> t(static_cast<size_t>(size));
            if (!SvrPread(d.fd, d.base + sector * kSvrSector, t.data(), t.size())) return;
            size_t at = 0;
            while (at + 14 <= t.size()) {
              const uint32_t left = SvrLe16(&t[at]);
              const size_t nameLen = t[at + 13];
              if (left == 0xFFFF || nameLen == 0) {
                at = (at / kSvrSector + 1) * kSvrSector;
                continue;
              }
              if (at + 14 + nameLen > t.size()) break;
              const std::string name(reinterpret_cast<const char*>(&t[at + 14]), nameLen);
              SvrEntry e;
              e.sector = SvrLe32(&t[at + 4]);
              e.size = SvrLe32(&t[at + 8]);
              e.dir = (t[at + 12] & 0x10) != 0;
              if (name.find('\\') == std::string::npos && name.find('/') == std::string::npos &&
                  name.find(':') == std::string::npos && name != "." && name != "..") {
                e.path = prefix + name;
                d.entries.push_back(e);
                if (e.dir) SvrReadDir(d, e.sector, e.size, e.path + "/", depth + 1);
              }
              at = (at + 14 + nameLen + 3) & ~static_cast<size_t>(3);
            }
          }

          // Finds the partition (the magic at sector 32) and lists the tree. Returns an error text or "".
          static std::string SvrOpenDisc(SvrDisc& d) {
            struct stat st;
            if (fstat(d.fd, &st) != 0) return "the image can't be read";
            const uint64_t size = static_cast<uint64_t>(st.st_size);
            for (uint64_t b : kSvrBases) {
              const uint64_t at = b + 32 * kSvrSector;
              if (at + 32 > size) continue;
              uint8_t vd[28];
              if (!SvrPread(d.fd, at, vd, sizeof(vd))) continue;
              if (std::memcmp(vd, "MICROSOFT*XBOX*MEDIA", 20) == 0) {
                d.base = b;
                SvrReadDir(d, SvrLe32(vd + 20), SvrLe32(vd + 24), "", 0);
                return "";
              }
            }
            return "this isn't an Xbox 360 disc image (no XDVDFS file system found)";
          }

          static const SvrEntry* SvrFind(const SvrDisc& d, const char* path) {
            for (const SvrEntry& e : d.entries) {
              if (strcasecmp(e.path.c_str(), path) == 0) return &e;
            }
            return nullptr;
          }

          // default.xex: "XEX2" and the execution info's title ID (header 0x00040006), then its size and CRC.
          static std::string SvrCheckDisc(const SvrDisc& d) {
            const SvrEntry* xex = SvrFind(d, "default.xex");
            if (!xex || xex->dir) return "the image has no default.xex";
            const uint64_t xexAt = d.base + xex->sector * kSvrSector;
            std::vector<uint8_t> h(4096);
            if (!SvrPread(d.fd, xexAt, h.data(), h.size()) || std::memcmp(h.data(), "XEX2", 4) != 0) {
              return "default.xex can't be read";
            }
            const uint32_t count = SvrBe32(&h[20]);
            bool found = false;
            for (uint32_t i = 0; i < count && 24 + static_cast<size_t>(i) * 8 + 8 <= h.size(); ++i) {
              if (SvrBe32(&h[24 + i * 8]) != 0x00040006) continue;
              uint8_t info[24];
              if (!SvrPread(d.fd, xexAt + SvrBe32(&h[24 + i * 8 + 4]), info, sizeof(info))) return "default.xex can't be read";
              const uint32_t id = SvrBe32(info + 12);
              if (id != kSvrTitleId) {
                char buf[96];
                std::snprintf(buf, sizeof(buf), "this is another game (its title ID is %08X)", id);
                return buf;
              }
              found = true;
              break;
            }
            if (!found) return "default.xex has no title ID";
            // The port's addresses fit one exact executable.
            if (xex->size != kSvrXexSize) return "this is another version of the game (only the original release works)";
            uint32_t crc = 0;
            std::vector<uint8_t> chunk(4u << 20);
            for (uint64_t off = 0; off < xex->size;) {
              const size_t n = static_cast<size_t>(std::min<uint64_t>(chunk.size(), xex->size - off));
              if (!SvrPread(d.fd, xexAt + off, chunk.data(), n)) return "default.xex can't be read";
              crc = SvrCrc32(crc, chunk.data(), n);
              off += n;
            }
            if (crc != kSvrXexCrc) {
              char buf[112];
              std::snprintf(buf, sizeof(buf), "this is another version of the game (its default.xex has CRC %08X)", crc);
              return buf;
            }
            return "";
          }

          // Copies the disc tree 1:1 into `dest`, resumably (files already there at the same size are kept),
          // each file through <name>.part, default.xex last. Returns the text to show.
          static std::string SvrInstallImage(int fd, const std::string& dest, void (^report)(double, NSString*)) {
            SvrDisc disc;
            disc.fd = fd;
            std::string err = SvrOpenDisc(disc);
            if (err.empty()) err = SvrCheckDisc(disc);
            if (!err.empty()) return "Can't install: " + err + ".";

            NSFileManager* fm = [NSFileManager defaultManager];
            uint64_t total = 0, need = 0;
            std::vector<SvrEntry> files;
            for (const SvrEntry& e : disc.entries) {
              const std::string full = dest + "/" + e.path;
              if (e.dir) {
                [fm createDirectoryAtPath:SvrNS(full) withIntermediateDirectories:YES attributes:nil error:nil];
                continue;
              }
              files.push_back(e);
              total += e.size;
              struct stat st;
              if (!(stat(full.c_str(), &st) == 0 && S_ISREG(st.st_mode) && static_cast<uint64_t>(st.st_size) == e.size)) {
                need += e.size;
              }
            }
            const uint64_t margin = 64ULL << 20;
            const uint64_t free = SvrFreeBytes(dest);
            if (need + margin > free) {
              return SvrStd([NSString stringWithFormat:@"Not enough free space: %@ needed, %@ free.", SvrHuman(need + margin),
                                                       SvrHuman(free)]);
            }
            std::sort(files.begin(), files.end(), [](const SvrEntry& a, const SvrEntry& b) { return a.sector < b.sector; });
            std::stable_partition(files.begin(), files.end(),
                                  [](const SvrEntry& e) { return strcasecmp(e.path.c_str(), "default.xex") != 0; });

            std::vector<uint8_t> buffer(8u << 20);
            uint64_t done = 0;
            const auto started = std::chrono::steady_clock::now();
            for (const SvrEntry& e : files) {
              if (gSvrCancel) return "Stopped. Install again to carry on where it stopped.";
              const std::string full = dest + "/" + e.path;
              struct stat st;
              if (stat(full.c_str(), &st) == 0 && S_ISREG(st.st_mode) && static_cast<uint64_t>(st.st_size) == e.size) {
                done += e.size;
                continue;
              }
              [fm createDirectoryAtPath:[SvrNS(full) stringByDeletingLastPathComponent] withIntermediateDirectories:YES
                             attributes:nil error:nil];
              const std::string part = full + ".part";
              const int out = open(part.c_str(), O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (out < 0) return "Installing failed: can't write " + e.path;
              uint64_t at = disc.base + e.sector * kSvrSector;
              uint64_t left = e.size;
              bool ok = true;
              while (left > 0) {
                if (gSvrCancel) break;
                const size_t n = static_cast<size_t>(std::min<uint64_t>(buffer.size(), left));
                if (!SvrPread(fd, at, buffer.data(), n)) {
                  ok = false;
                  break;
                }
                size_t off = 0;
                while (off < n) {
                  const ssize_t w = write(out, buffer.data() + off, n - off);
                  if (w <= 0) {
                    ok = false;
                    break;
                  }
                  off += static_cast<size_t>(w);
                }
                if (!ok) break;
                at += n;
                left -= n;
                done += n;
                const double secs = std::chrono::duration<double>(std::chrono::steady_clock::now() - started).count();
                const double rate = secs > 0.5 ? static_cast<double>(done) / secs : 0.0;
                NSString* eta = rate > 0 ? [NSString stringWithFormat:@" · %ld s left", static_cast<long>((total - done) / rate)] : @"";
                report(total > 0 ? static_cast<double>(done) / static_cast<double>(total) : 0.0,
                       [NSString stringWithFormat:@"Installing… %d%% · %@ of %@%@",
                                                  static_cast<int>(total > 0 ? done * 100 / total : 0), SvrHuman(done),
                                                  SvrHuman(total), eta]);
              }
              close(out);
              if (!ok) {
                unlink(part.c_str());
                return "Installing failed while writing " + e.path + " (is the phone full, or the image unreadable?)";
              }
              if (gSvrCancel) {
                unlink(part.c_str());
                return "Stopped. Install again to carry on where it stopped.";
              }
              unlink(full.c_str());
              if (rename(part.c_str(), full.c_str()) != 0) return "Installing failed: can't write " + e.path;
            }
            return SvrStd([NSString stringWithFormat:@"Installed (%lu files, %@). Press Play.", static_cast<unsigned long>(files.size()),
                                                     SvrHuman(total)]);
          }

          // The Import folder (Documents/Import): copy a disc image or DLC there with the Files app and pick it
          // in the launcher - no system file picker needed.
          static std::string SvrImportDir() {
            const char* home = getenv("HOME");
            return std::string(home ? home : "") + "/Documents/Import";
          }

          struct SvrImportFile {
            std::string name;
            uint64_t size = 0;
          };

          static std::vector<SvrImportFile> SvrImportFiles() {
            std::vector<SvrImportFile> out;
            const std::string dir = SvrImportDir();
            mkdir(dir.c_str(), 0755);
            DIR* d = opendir(dir.c_str());
            if (!d) return out;
            while (const struct dirent* e = readdir(d)) {
              const std::string n = e->d_name;
              if (n.empty() || n[0] == '.' || (n.size() > 5 && n.compare(n.size() - 5, 5, ".part") == 0)) continue;
              struct stat st;
              if (stat((dir + "/" + n).c_str(), &st) != 0 || !S_ISREG(st.st_mode)) continue;
              SvrImportFile f;
              f.name = n;
              f.size = static_cast<uint64_t>(st.st_size);
              out.push_back(f);
            }
            closedir(d);
            std::sort(out.begin(), out.end(), [](const SvrImportFile& a, const SvrImportFile& b) {
              return strcasecmp(a.name.c_str(), b.name.c_str()) < 0;
            });
            return out;
          }

          @interface SvrInstallPage : NSObject <UIDocumentPickerDelegate>
          @property(nonatomic, strong) UIScrollView* view;
          @property(nonatomic, weak) UIViewController* presenter;
          @property(nonatomic) BOOL busy;
          - (void)refresh;
          @end

          @implementation SvrInstallPage {
            UILabel* _state;
            UILabel* _progressText;
            UIProgressView* _progress;
            UIButton* _installBtn;
            UIButton* _cancelBtn;
            UIStackView* _files;
            NSString* _signature;
            NSTimer* _timer;
          }

          - (instancetype)init {
            self = [super init];
            if (!self) return nil;
            UIStackView* stack = nil;
            _view = SvrScrollPage(&stack);
            __weak SvrInstallPage* weakSelf = self;

            _state = SvrLabel(@"", 15.0, SVR_OK, YES);
            [stack addArrangedSubview:SvrCard(@[
              SvrHeading(@"Game"), _state,
              SvrLabel(@"Install from your own copy of the game: its Xbox 360 disc image (ISO). Installing again keeps the files already there. It needs several GB of free space; keep this screen open while it runs.",
                       13.0, SVR_DIM, NO)
            ])];
            _files = [[UIStackView alloc] init];
            _files.axis = UILayoutConstraintAxisVertical;
            _files.spacing = 10.0;
            [stack addArrangedSubview:SvrCard(@[
              SvrLabel(@"Easiest: copy the disc image into this folder with the Files app, then tap Install next to it:", 14.0, SVR_TEXT, NO),
              SvrMono(SvrNS(SvrImportDir())), _files,
              SvrButton(@"Refresh the list", NO, ^{
                [weakSelf refreshFiles:YES];
              })
            ])];
            // (the list follows the folder by itself while this page is on screen)
            _timer = [NSTimer scheduledTimerWithTimeInterval:2.0 repeats:YES block:^(NSTimer* timer) {
              SvrInstallPage* s = weakSelf;
              if (!s) {
                [timer invalidate];
                return;
              }
              if (s.view.window && !s.busy) [s refreshFiles:NO];
            }];
            _installBtn = SvrButton(@"Or pick the disc image with the Files app…", NO, ^{
              [weakSelf pickImage];
            });
            [stack addArrangedSubview:_installBtn];
            _progress = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
            _progress.progressTintColor = SVR_BLUE;
            _progress.trackTintColor = [UIColor colorWithWhite:1.0 alpha:0.15];
            _progress.hidden = YES;
            [stack addArrangedSubview:_progress];
            _progressText = SvrLabel(@"", 13.0, SVR_DIM, NO);
            [stack addArrangedSubview:_progressText];
            _cancelBtn = SvrButton(@"Cancel", NO, ^{
              gSvrCancel = true;
            });
            _cancelBtn.hidden = YES;
            [stack addArrangedSubview:_cancelBtn];
            [self refresh];
            return self;
          }

          - (void)refresh {
            const char* home = getenv("HOME");
            const std::string dest = std::string(home ? home : "") + "/Documents";
            const BOOL installed = SvrFileExists(dest + "/default.xex");
            _state.text = [NSString stringWithFormat:@"%@ (%@ free).", installed ? @"Installed in the game folder" : @"Not installed yet",
                                                     SvrHuman(SvrFreeBytes(dest))];
            [self refreshFiles:YES];
          }

          // The Import folder's files, each with Install and Delete (rebuilt only when the folder changed).
          - (void)refreshFiles:(BOOL)force {
            const std::vector<SvrImportFile> found = SvrImportFiles();
            NSMutableString* signature = [NSMutableString string];
            for (const SvrImportFile& f : found) {
              [signature appendFormat:@"%s:%llu;", f.name.c_str(), static_cast<unsigned long long>(f.size)];
            }
            if (!force && _signature && [_signature isEqualToString:signature]) return;
            _signature = signature;
            for (UIView* v in [_files.arrangedSubviews copy]) [v removeFromSuperview];
            if (found.empty()) {
              [_files addArrangedSubview:SvrLabel(@"Nothing in the Import folder yet. Copy your disc image there with the Files app: it shows up here by itself, with an Install button next to it.",
                                                  14.0, SVR_DIM, NO)];
            }
            __weak SvrInstallPage* weakSelf = self;
            for (const SvrImportFile& f : found) {
              NSString* name = SvrNS(f.name);
              UIButton* install = SvrButton(@"Install", YES, ^{
                [weakSelf installImported:name];
              });
              UIButton* del = SvrButton(@"Delete", NO, ^{
                [weakSelf confirmDelete:name];
              });
              [install.widthAnchor constraintEqualToConstant:100.0].active = YES;
              [del.widthAnchor constraintEqualToConstant:100.0].active = YES;
              [_files addArrangedSubview:SvrRowBox(name, SvrHuman(f.size), @[ install, del ])];
            }
          }

          - (void)installImported:(NSString*)name {
            if (self.busy) return;
            [self installPath:[SvrNS(SvrImportDir()) stringByAppendingPathComponent:name] url:nil];
          }

          - (void)confirmDelete:(NSString*)name {
            UIViewController* host = self.presenter;
            if (!host || self.busy) return;
            UIAlertController* alert = [UIAlertController alertControllerWithTitle:@"Delete this file?"
                                                                           message:[NSString stringWithFormat:@"%@ will be deleted from the Import folder (the installed game is not touched).", name]
                                                                    preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
            __weak SvrInstallPage* weakSelf = self;
            [alert addAction:[UIAlertAction actionWithTitle:@"Delete" style:UIAlertActionStyleDestructive
                                                    handler:^(UIAlertAction* action) {
                                                      const std::string path = SvrImportDir() + "/" + SvrStd(name);
                                                      if (name.length > 0 && ![name containsString:@"/"]) unlink(path.c_str());
                                                      [weakSelf refresh];
                                                    }]];
            [host presentViewController:alert animated:YES completion:nil];
          }

          - (void)pickImage {
            if (self.busy) return;
            UIViewController* host = self.presenter;
            if (!host) return;
            UIDocumentPickerViewController* picker =
                [[UIDocumentPickerViewController alloc] initWithDocumentTypes:@[ @"public.data" ] inMode:UIDocumentPickerModeOpen];
            picker.delegate = self;
            picker.allowsMultipleSelection = NO;
            [host presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController*)controller didPickDocumentsAtURLs:(NSArray<NSURL*>*)urls {
            NSURL* url = urls.firstObject;
            if (url) [self installPath:url.path url:url];
          }

          // `url` is the picked file's security-scoped URL, or nil for a file in the Import folder.
          - (void)installPath:(NSString*)path url:(NSURL*)url {
            const BOOL scoped = url ? [url startAccessingSecurityScopedResource] : NO;
            const int fd = open([path fileSystemRepresentation], O_RDONLY);
            if (fd < 0) {
              if (scoped) [url stopAccessingSecurityScopedResource];
              _progressText.text = @"The disc image can't be opened.";
              return;
            }
            self.busy = YES;
            gSvrCancel = false;
            [UIApplication sharedApplication].idleTimerDisabled = YES;  // (a locked screen would stop the copy)
            _installBtn.enabled = NO;
            _cancelBtn.hidden = NO;
            _progress.hidden = NO;
            _progress.progress = 0.0f;
            _progressText.text = @"Reading the disc image…";
            const char* home = getenv("HOME");
            const std::string dest = std::string(home ? home : "") + "/Documents";
            __weak SvrInstallPage* weakSelf = self;
            dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
              const std::string message = SvrInstallImage(fd, dest, ^(double fraction, NSString* text) {
                dispatch_async(dispatch_get_main_queue(), ^{
                  [weakSelf showProgress:fraction text:text];
                });
              });
              close(fd);
              if (scoped) [url stopAccessingSecurityScopedResource];
              dispatch_async(dispatch_get_main_queue(), ^{
                [weakSelf finish:SvrNS(message)];
              });
            });
          }

          - (void)showProgress:(double)fraction text:(NSString*)text {
            _progress.progress = static_cast<float>(fraction);
            _progressText.text = text;
          }

          - (void)finish:(NSString*)message {
            self.busy = NO;
            [UIApplication sharedApplication].idleTimerDisabled = NO;
            _installBtn.enabled = YES;
            _cancelBtn.hidden = YES;
            _progress.hidden = YES;
            _progressText.text = message;
            [self refresh];
          }

          @end

          // ---- the DLC tab: the game's downloadable content (Xbox 360 STFS packages), as on Android ----
          // ---- DLC core begin ----

          static const uint32_t kSvrDlcHeader = 0x491;

          struct SvrDlcResult {
            std::vector<std::string> added;
            int already = 0;
            int updates = 0;
            std::string error;
          };

          typedef std::function<ssize_t(uint8_t*, size_t)> SvrReadFn;

          static std::string SvrDocs() {
            const char* home = getenv("HOME");
            return std::string(home ? home : "") + "/Documents";
          }

          static std::string SvrDlcDir() { return SvrDocs() + "/DLC"; }

          // The package kind from its first bytes: 2 DLC, 1 title update, 0 not this game's.
          static int SvrDlcKind(const uint8_t* h, size_t n) {
            if (n < kSvrDlcHeader) return 0;
            const bool magic = !std::memcmp(h, "LIVE", 4) || !std::memcmp(h, "PIRS", 4) || !std::memcmp(h, "CON ", 4);
            if (!magic || SvrBe32(h + 0x360) != kSvrTitleId) return 0;
            const uint32_t type = SvrBe32(h + 0x344);
            return type == 0x00000002 ? 2 : type == 0x000B0000 ? 1 : 0;
          }

          // The package's display name (UTF-16BE at 0x411, up to 0x80 bytes) as UTF-8.
          static std::string SvrDlcTitle(const uint8_t* h) {
            std::string out;
            for (size_t i = 0; i + 1 < 0x80; i += 2) {
              const uint32_t c = static_cast<uint32_t>(h[0x411 + i]) << 8 | h[0x412 + i];
              if (c == 0) break;
              if (c < 0x80) {
                out += static_cast<char>(c);
              } else if (c < 0x800) {
                out += static_cast<char>(0xC0 | (c >> 6));
                out += static_cast<char>(0x80 | (c & 0x3F));
              } else if (c >= 0xD800 && c <= 0xDFFF) {
                out += '?';
              } else {
                out += static_cast<char>(0xE0 | (c >> 12));
                out += static_cast<char>(0x80 | ((c >> 6) & 0x3F));
                out += static_cast<char>(0x80 | (c & 0x3F));
              }
            }
            return SvrTrim(out);
          }

          // Reads until `n` bytes or the end; returns how many.
          static size_t SvrFill(const SvrReadFn& rd, uint8_t* buf, size_t n) {
            size_t got = 0;
            while (got < n) {
              const ssize_t r = rd(buf + got, n - got);
              if (r <= 0) break;
              got += static_cast<size_t>(r);
            }
            return got;
          }

          // One file's bytes: copied to DLC if it is this game's downloadable content.
          static void SvrDlcAddStream(const SvrReadFn& rd, const std::string& name, int64_t size, SvrDlcResult& r) {
            uint8_t h[kSvrDlcHeader];
            const size_t n = SvrFill(rd, h, sizeof(h));
            const int kind = SvrDlcKind(h, n);
            if (kind == 1) r.updates++;
            if (kind != 2) return;
            const std::string dir = SvrDlcDir();
            mkdir(dir.c_str(), 0755);
            const std::string dest = dir + "/" + name;
            struct stat st;
            if (size >= 0 && stat(dest.c_str(), &st) == 0 && S_ISREG(st.st_mode) && static_cast<int64_t>(st.st_size) == size) {
              r.already++;
              return;
            }
            const std::string part = dest + ".part";
            const int out = open(part.c_str(), O_WRONLY | O_CREAT | O_TRUNC, 0644);
            if (out < 0) {
              r.error = "can't write " + name;
              return;
            }
            bool ok = write(out, h, n) == static_cast<ssize_t>(n);
            std::vector<uint8_t> buf(1u << 20);
            while (ok) {
              const ssize_t got = rd(buf.data(), buf.size());
              if (got < 0) {
                ok = false;
                break;
              }
              if (got == 0) break;
              size_t off = 0;
              while (off < static_cast<size_t>(got)) {
                const ssize_t w = write(out, buf.data() + off, static_cast<size_t>(got) - off);
                if (w <= 0) {
                  ok = false;
                  break;
                }
                off += static_cast<size_t>(w);
              }
            }
            close(out);
            if (!ok) {
              unlink(part.c_str());
              r.error = "can't copy " + name + " (is the phone full, or the file unreadable?)";
              return;
            }
            unlink(dest.c_str());
            if (rename(part.c_str(), dest.c_str()) != 0) {
              r.error = "can't write " + name;
              return;
            }
            const std::string title = SvrDlcTitle(h);
            r.added.push_back(title.empty() ? name : title);
          }

          // ---- zip archives (stored and deflated entries; no ZIP64) ----

          struct SvrZipEntry {
            std::string name;
            uint32_t method = 0;
            uint32_t comp = 0;
            uint32_t uncomp = 0;
            uint64_t local = 0;
          };

          static bool SvrZipList(int fd, std::vector<SvrZipEntry>* out, std::string* error) {
            struct stat st;
            if (fstat(fd, &st) != 0 || st.st_size < 22) {
              *error = "not a zip file";
              return false;
            }
            const uint64_t size = static_cast<uint64_t>(st.st_size);
            const size_t tailLen = static_cast<size_t>(std::min<uint64_t>(size, 66000));
            std::vector<uint8_t> tail(tailLen);
            if (!SvrPread(fd, size - tailLen, tail.data(), tailLen)) {
              *error = "can't read the zip file";
              return false;
            }
            int64_t at = -1;
            for (int64_t i = static_cast<int64_t>(tailLen) - 22; i >= 0; --i) {
              if (SvrLe32(&tail[static_cast<size_t>(i)]) == 0x06054b50) {
                at = i;
                break;
              }
            }
            if (at < 0) {
              *error = "not a zip file";
              return false;
            }
            const uint8_t* e = &tail[static_cast<size_t>(at)];
            const uint32_t cdSize = SvrLe32(e + 12);
            const uint32_t cdOff = SvrLe32(e + 16);
            if (SvrLe16(e + 10) == 0xFFFF || cdSize == 0xFFFFFFFFu || cdOff == 0xFFFFFFFFu) {
              *error = "ZIP64 archives aren't supported";
              return false;
            }
            if (cdSize > (64u << 20)) {
              *error = "the zip file's index is too big";
              return false;
            }
            std::vector<uint8_t> cd(cdSize);
            if (!SvrPread(fd, cdOff, cd.data(), cd.size())) {
              *error = "can't read the zip file";
              return false;
            }
            size_t p = 0;
            while (p + 46 <= cd.size() && SvrLe32(&cd[p]) == 0x02014b50) {
              const uint32_t flags = SvrLe16(&cd[p + 8]);
              const size_t nameLen = SvrLe16(&cd[p + 28]);
              const size_t extraLen = SvrLe16(&cd[p + 30]);
              const size_t commentLen = SvrLe16(&cd[p + 32]);
              if (p + 46 + nameLen > cd.size()) break;
              SvrZipEntry z;
              z.method = (flags & 1) ? 0xFFFF : SvrLe16(&cd[p + 10]);  // (encrypted entries are skipped)
              z.comp = SvrLe32(&cd[p + 20]);
              z.uncomp = SvrLe32(&cd[p + 24]);
              z.local = SvrLe32(&cd[p + 42]);
              z.name.assign(reinterpret_cast<const char*>(&cd[p + 46]), nameLen);
              out->push_back(z);
              p += 46 + nameLen + extraLen + commentLen;
            }
            return true;
          }

          class SvrZipReader {
           public:
            SvrZipReader(int fd, const SvrZipEntry& e) : fd_(fd), e_(e) {}
            ~SvrZipReader() {
              if (inflating_) inflateEnd(&zs_);
            }
            bool open() {
              uint8_t lh[30];
              if (!SvrPread(fd_, e_.local, lh, sizeof(lh)) || SvrLe32(lh) != 0x04034b50) return false;
              start_ = e_.local + 30 + SvrLe16(lh + 26) + SvrLe16(lh + 28);
              left_ = e_.comp;
              if (e_.method == 8) {
                std::memset(&zs_, 0, sizeof(zs_));
                if (inflateInit2(&zs_, -MAX_WBITS) != Z_OK) return false;
                inflating_ = true;
                in_.resize(1u << 16);
                return true;
              }
              return e_.method == 0;
            }
            // Bytes read (0 at the end), or -1.
            ssize_t read(uint8_t* out, size_t n) {
              if (e_.method == 0) {
                const size_t want = static_cast<size_t>(std::min<uint64_t>(n, left_));
                if (want == 0) return 0;
                if (!SvrPread(fd_, start_ + pos_, out, want)) return -1;
                pos_ += want;
                left_ -= want;
                return static_cast<ssize_t>(want);
              }
              if (done_) return 0;
              zs_.next_out = out;
              zs_.avail_out = static_cast<uInt>(n);
              while (true) {
                if (zs_.avail_in == 0 && left_ > 0) {
                  const size_t take = static_cast<size_t>(std::min<uint64_t>(in_.size(), left_));
                  if (!SvrPread(fd_, start_ + pos_, in_.data(), take)) return -1;
                  pos_ += take;
                  left_ -= take;
                  zs_.next_in = in_.data();
                  zs_.avail_in = static_cast<uInt>(take);
                }
                const int r = inflate(&zs_, Z_NO_FLUSH);
                const size_t produced = n - zs_.avail_out;
                if (r == Z_STREAM_END) done_ = true;
                else if (r != Z_OK && r != Z_BUF_ERROR) return -1;
                if (produced > 0) return static_cast<ssize_t>(produced);
                if (done_) return 0;
                if (zs_.avail_in == 0 && left_ == 0) return -1;  // (cut short)
              }
            }

           private:
            int fd_;
            SvrZipEntry e_;
            uint64_t start_ = 0, pos_ = 0, left_ = 0;
            z_stream zs_;
            bool inflating_ = false;
            bool done_ = false;
            std::vector<uint8_t> in_;
          };

          static bool SvrEndsWith(const std::string& s, const char* suffix) {
            const size_t n = std::strlen(suffix);
            return s.size() >= n && strcasecmp(s.c_str() + s.size() - n, suffix) == 0;
          }

          static void SvrDlcAddZip(const std::string& path, SvrDlcResult& r) {
            const int fd = open(path.c_str(), O_RDONLY);
            if (fd < 0) return;
            std::vector<SvrZipEntry> entries;
            std::string error;
            if (!SvrZipList(fd, &entries, &error)) {
              close(fd);
              r.error = error;
              return;
            }
            for (const SvrZipEntry& e : entries) {
              if (e.name.empty() || e.name.back() == '/') continue;
              const size_t slash = e.name.find_last_of("/\\");
              const std::string base = slash == std::string::npos ? e.name : e.name.substr(slash + 1);
              if (base.empty() || base[0] == '.' || e.name.find("__MACOSX") != std::string::npos) continue;
              SvrZipReader zr(fd, e);
              if (!zr.open()) continue;
              SvrDlcAddStream([&zr](uint8_t* b, size_t n) { return zr.read(b, n); }, base, e.uncomp, r);
              if (!r.error.empty()) break;
            }
            close(fd);
          }

          // One picked file (a package, or a zip with packages in it).
          static void SvrDlcAddPath(const std::string& path, const std::string& name, SvrDlcResult& r) {
            if (SvrEndsWith(name, ".rar") || SvrEndsWith(name, ".7z")) {
              r.error = name + ": RAR and 7z archives can't be opened on the phone - extract them (or zip them) first";
              return;
            }
            if (SvrEndsWith(name, ".zip")) {
              SvrDlcAddZip(path, r);
              return;
            }
            const int fd = open(path.c_str(), O_RDONLY);
            if (fd < 0) return;
            struct stat st;
            const int64_t size = fstat(fd, &st) == 0 ? static_cast<int64_t>(st.st_size) : -1;
            SvrDlcAddStream([fd](uint8_t* b, size_t n) { return read(fd, b, n); }, name, size, r);
            close(fd);
          }

          // A picked folder: everything inside it (up to 8 levels down).
          static void SvrDlcAddTree(const std::string& dir, int depth, SvrDlcResult& r) {
            if (depth > 8) return;
            DIR* d = opendir(dir.c_str());
            if (!d) return;
            std::vector<std::string> names;
            while (const struct dirent* e = readdir(d)) {
              const std::string n = e->d_name;
              if (n != "." && n != "..") names.push_back(n);
            }
            closedir(d);
            std::sort(names.begin(), names.end());
            for (const std::string& n : names) {
              const std::string full = dir + "/" + n;
              struct stat st;
              if (stat(full.c_str(), &st) != 0) continue;
              if (S_ISDIR(st.st_mode)) {
                SvrDlcAddTree(full, depth + 1, r);
              } else if (S_ISREG(st.st_mode)) {
                SvrDlcAddPath(full, n, r);
              }
              if (!r.error.empty()) return;
            }
          }

          // The files in the DLC folder, by name.
          static std::vector<std::string> SvrDlcList() {
            std::vector<std::string> names;
            const std::string dir = SvrDlcDir();
            DIR* d = opendir(dir.c_str());
            if (!d) return names;
            while (const struct dirent* e = readdir(d)) {
              const std::string n = e->d_name;
              if (n == "." || n == ".." || SvrEndsWith(n, ".part")) continue;
              struct stat st;
              if (stat((dir + "/" + n).c_str(), &st) == 0 && S_ISREG(st.st_mode)) names.push_back(n);
            }
            closedir(d);
            std::sort(names.begin(), names.end(),
                      [](const std::string& a, const std::string& b) { return strcasecmp(a.c_str(), b.c_str()) < 0; });
            return names;
          }

          // Removes a package and what the game set up from it (UserData/.../00000002/<name> and its header).
          static bool SvrDlcRemove(const std::string& name) {
            if (name.empty() || name.find('/') != std::string::npos || name == "." || name == "..") return false;
            namespace fs = std::filesystem;
            std::error_code ec;
            char title[16];
            std::snprintf(title, sizeof(title), "%08X", kSvrTitleId);
            const fs::path root = fs::path(SvrDocs()) / "UserData" / "0000000000000000" / title;
            fs::remove(fs::path(SvrDlcDir()) / name, ec);
            fs::remove_all(root / "00000002" / name, ec);
            fs::remove(root / "Headers" / "00000002" / (name + ".header"), ec);
            return true;
          }

          // ---- DLC core end ----

          @interface SvrDlcPage : NSObject <UIDocumentPickerDelegate>
          @property(nonatomic, strong) UIScrollView* view;
          @property(nonatomic, weak) UIViewController* presenter;
          @property(nonatomic) BOOL busy;
          - (void)refresh;
          @end

          @implementation SvrDlcPage {
            UILabel* _status;
            UIStackView* _list;
            UILabel* _importInfo;
            NSTimer* _timer;
            UIButton* _importBtn;
            UIButton* _filesBtn;
            UIButton* _folderBtn;
            BOOL _pickingFolder;
          }

          - (instancetype)init {
            self = [super init];
            if (!self) return nil;
            UIStackView* stack = nil;
            _view = SvrScrollPage(&stack);
            __weak SvrDlcPage* weakSelf = self;

            _importInfo = SvrLabel(@"", 13.0, SVR_DIM, NO);
            _importBtn = SvrButton(@"Add everything from the Import folder", YES, ^{
              [weakSelf addImport];
            });
            _timer = [NSTimer scheduledTimerWithTimeInterval:2.0 repeats:YES block:^(NSTimer* timer) {
              SvrDlcPage* s = weakSelf;
              if (!s) {
                [timer invalidate];
                return;
              }
              if (s.view.window && !s.busy) [s updateImportInfo];
            }];
            _filesBtn = SvrButton(@"Or pick files with the Files app…", NO, ^{
              [weakSelf pick:NO];
            });
            _folderBtn = SvrButton(@"Or pick a folder…", NO, ^{
              [weakSelf pick:YES];
            });
            UIStackView* buttons = [[UIStackView alloc] initWithArrangedSubviews:@[ _filesBtn, _folderBtn ]];
            buttons.axis = UILayoutConstraintAxisHorizontal;
            buttons.spacing = 8.0;
            buttons.distribution = UIStackViewDistributionFillEqually;
            _status = SvrLabel(@"", 13.0, SVR_DIM, NO);
            [stack addArrangedSubview:SvrCard(@[
              SvrLabel(@"Add the game's downloadable content: Xbox 360 packages (as downloaded), or zip files with them inside, or a folder. Packages for other games and title updates are skipped. They are set up the next time the game starts.",
                       13.0, SVR_DIM, NO),
              SvrLabel(@"Easiest: copy your DLC files (or zips, or folders) into this folder with the Files app, then tap the button:", 14.0, SVR_TEXT, NO),
              SvrMono(SvrNS(SvrImportDir())), _importInfo, _importBtn, buttons, _status
            ])];
            _list = [[UIStackView alloc] init];
            _list.axis = UILayoutConstraintAxisVertical;
            _list.spacing = 10.0;
            [stack addArrangedSubview:SvrCard(@[ SvrHeading(@"Installed"), _list ])];
            [self refresh];
            return self;
          }

          - (void)updateImportInfo {
            const std::vector<SvrImportFile> found = SvrImportFiles();
            uint64_t total = 0;
            for (const SvrImportFile& f : found) total += f.size;
            _importInfo.text = found.empty()
                ? @"The Import folder is empty."
                : [NSString stringWithFormat:@"Import folder: %lu file%@ (%@).", static_cast<unsigned long>(found.size()),
                                             found.size() == 1 ? @"" : @"s", SvrHuman(total)];
          }

          - (void)refresh {
            [self updateImportInfo];
            for (UIView* v in [_list.arrangedSubviews copy]) [v removeFromSuperview];
            const std::vector<std::string> names = SvrDlcList();
            if (names.empty()) {
              [_list addArrangedSubview:SvrLabel(@"None yet.", 15.0, SVR_DIM, NO)];
              return;
            }
            __weak SvrDlcPage* weakSelf = self;
            for (const std::string& name : names) {
              uint8_t h[kSvrDlcHeader];
              size_t n = 0;
              struct stat st;
              const std::string path = SvrDlcDir() + "/" + name;
              const int fd = open(path.c_str(), O_RDONLY);
              if (fd >= 0) {
                const ssize_t got = read(fd, h, sizeof(h));
                n = got > 0 ? static_cast<size_t>(got) : 0;
                close(fd);
              }
              const uint64_t size = stat(path.c_str(), &st) == 0 ? static_cast<uint64_t>(st.st_size) : 0;
              const std::string title = SvrDlcKind(h, n) == 2 ? SvrDlcTitle(h) : std::string();
              NSString* shown = SvrNS(title.empty() ? name : title);
              NSString* fileName = SvrNS(name);
              UIButton* remove = SvrButton(@"Remove", NO, ^{
                [weakSelf confirmRemove:fileName title:shown];
              });
              [remove.widthAnchor constraintEqualToConstant:100.0].active = YES;
              [_list addArrangedSubview:SvrRowBox(shown, [NSString stringWithFormat:@"%@  ·  %@", fileName, SvrHuman(size)], @[ remove ])];
            }
          }

          // Everything in Documents/Import: packages, zips with packages, folders.
          - (void)addImport {
            if (self.busy) return;
            if (!SvrFileExists(SvrDocs() + "/default.xex")) {
              _status.text = @"Install the game first (Install tab).";
              return;
            }
            self.busy = YES;
            _importBtn.enabled = NO;
            _filesBtn.enabled = NO;
            _folderBtn.enabled = NO;
            _status.text = @"Looking for DLC…";
            __weak SvrDlcPage* weakSelf = self;
            dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
              SvrDlcResult result;
              mkdir(SvrImportDir().c_str(), 0755);
              SvrDlcAddTree(SvrImportDir(), 0, result);
              dispatch_async(dispatch_get_main_queue(), ^{
                [weakSelf finishAdding:result];
              });
            });
          }

          - (void)pick:(BOOL)folder {
            if (self.busy) return;
            if (!SvrFileExists(SvrDocs() + "/default.xex")) {
              _status.text = @"Install the game first (Install tab).";
              return;
            }
            UIViewController* host = self.presenter;
            if (!host) return;
            _pickingFolder = folder;
            UIDocumentPickerViewController* picker = [[UIDocumentPickerViewController alloc]
                initWithDocumentTypes:@[ folder ? @"public.folder" : @"public.data" ]
                               inMode:UIDocumentPickerModeOpen];
            picker.delegate = self;
            picker.allowsMultipleSelection = !folder;
            [host presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController*)controller didPickDocumentsAtURLs:(NSArray<NSURL*>*)urls {
            if (urls.count == 0) return;
            self.busy = YES;
            _importBtn.enabled = NO;
            _filesBtn.enabled = NO;
            _folderBtn.enabled = NO;
            _status.text = @"Looking for DLC…";
            const BOOL folder = _pickingFolder;
            NSArray<NSURL*>* picked = [urls copy];
            __weak SvrDlcPage* weakSelf = self;
            dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
              SvrDlcResult result;
              for (NSURL* url in picked) {
                const BOOL scoped = [url startAccessingSecurityScopedResource];
                const std::string path = SvrStd(url.path);
                if (folder) {
                  SvrDlcAddTree(path, 0, result);
                } else {
                  SvrDlcAddPath(path, SvrStd(url.lastPathComponent), result);
                }
                if (scoped) [url stopAccessingSecurityScopedResource];
                if (!result.error.empty()) break;
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                [weakSelf finishAdding:result];
              });
            });
          }

          - (void)finishAdding:(SvrDlcResult)r {
            self.busy = NO;
            _importBtn.enabled = YES;
            _filesBtn.enabled = YES;
            _folderBtn.enabled = YES;
            NSMutableString* text = [NSMutableString string];
            if (!r.error.empty()) {
              [text appendFormat:@"Adding DLC failed: %@", SvrNS(r.error)];
            } else if (r.added.empty() && r.already == 0) {
              [text appendString:@"No DLC for this game was found"];
              [text appendString:r.updates > 0 ? @" (only title updates, not needed)." : @"."];
            } else {
              [text appendFormat:@"%lu DLC package%@ installed%@%@. They are set up the next time the game starts",
                                 static_cast<unsigned long>(r.added.size()), r.added.size() == 1 ? @"" : @"s",
                                 r.already > 0 ? @", others already there" : @"",
                                 r.updates > 0 ? @" (title update skipped: not needed)" : @""];
              if (!r.added.empty()) {
                NSMutableArray<NSString*>* names = [NSMutableArray array];
                for (const std::string& a : r.added) [names addObject:SvrNS(a)];
                [text appendFormat:@": %@.", [names componentsJoinedByString:@", "]];
              } else {
                [text appendString:@"."];
              }
            }
            _status.text = text;
            [self refresh];
          }

          - (void)confirmRemove:(NSString*)fileName title:(NSString*)title {
            UIViewController* host = self.presenter;
            if (!host || self.busy) return;
            UIAlertController* alert = [UIAlertController
                alertControllerWithTitle:@"Remove this DLC?"
                                 message:[NSString stringWithFormat:@"%@ will be deleted, with what the game set up from it.", title]
                          preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
            __weak SvrDlcPage* weakSelf = self;
            [alert addAction:[UIAlertAction actionWithTitle:@"Remove" style:UIAlertActionStyleDestructive
                                                    handler:^(UIAlertAction* action) {
                                                      SvrDlcPage* s = weakSelf;
                                                      if (!s) return;
                                                      SvrDlcRemove(SvrStd(fileName));
                                                      s->_status.text = [NSString stringWithFormat:@"%@ removed.", title];
                                                      [s refresh];
                                                    }]];
            [host presentViewController:alert animated:YES completion:nil];
          }

          @end

          // ---- the Mods tab: arenas, superstars, signs, media, backstage, match types, attires, menu backgrounds ----
          // ---- Mods core begin ----

          struct SvrModKind {
            const char* type;    // manifest.txt "type="
            const char* folder;  // Mods/<folder>
            const char* marker;  // the file a mod of this kind must have ("" = any .dds picture)
            const char* label;
          };
          static const SvrModKind kSvrModKinds[] = {
              {"arena", "Arenas", "arena.pac", "Arena"},
              {"superstar", "Superstars", "ch.pac", "Superstar"},
              {"signs", "Signs", "manifest.txt", "Signs"},
              {"media", "Media", "manifest.txt", "Media"},
              {"backstage", "Backstage", "arena.pac", "Backstage"},
              {"matchtype", "MatchTypes", "manifest.txt", "Match type"},
              {"attire", "Attires", "attire.pac", "Attire"},
              {"background", "Backgrounds", "", "Menu background"},
          };

          static std::string SvrModsDir() { return SvrDocs() + "/Mods"; }

          static const SvrModKind* SvrModKindFor(const std::string& type) {
            for (const SvrModKind& k : kSvrModKinds) {
              if (type == k.type) return &k;
            }
            return nullptr;
          }

          static std::map<std::string, std::string> SvrModManifest(const std::string& dir) {
            std::map<std::string, std::string> m;
            std::ifstream in(dir + "/manifest.txt");
            if (!in.is_open()) in.open(dir + "/info.txt");
            for (std::string line; std::getline(in, line);) {
              const size_t eq = line.find('=');
              if (eq != std::string::npos && eq > 0) m[SvrTrim(line.substr(0, eq))] = SvrTrim(line.substr(eq + 1));
            }
            return m;
          }

          static bool SvrHasDds(const std::string& dir) {
            DIR* d = opendir(dir.c_str());
            if (!d) return false;
            bool found = false;
            while (const struct dirent* e = readdir(d)) {
              const std::string n = e->d_name;
              struct stat st;
              if (SvrEndsWith(n, ".dds") && stat((dir + "/" + n).c_str(), &st) == 0 && S_ISREG(st.st_mode)) {
                found = true;
                break;
              }
            }
            closedir(d);
            return found;
          }

          static bool SvrModHasMarker(const SvrModKind& k, const std::string& dir) {
            if (k.marker[0] == '\0') return SvrHasDds(dir);
            struct stat st;
            return stat((dir + "/" + k.marker).c_str(), &st) == 0 && S_ISREG(st.st_mode);
          }

          static bool SvrCopyEntryToFile(int fd, const SvrZipEntry& e, const std::string& out) {
            SvrZipReader zr(fd, e);
            if (!zr.open()) return false;
            const int o = open(out.c_str(), O_WRONLY | O_CREAT | O_TRUNC, 0644);
            if (o < 0) return false;
            std::vector<uint8_t> buf(1u << 20);
            bool ok = true;
            while (ok) {
              const ssize_t n = zr.read(buf.data(), buf.size());
              if (n < 0) {
                ok = false;
                break;
              }
              if (n == 0) break;
              size_t off = 0;
              while (off < static_cast<size_t>(n)) {
                const ssize_t w = write(o, buf.data() + off, static_cast<size_t>(n) - off);
                if (w <= 0) {
                  ok = false;
                  break;
                }
                off += static_cast<size_t>(w);
              }
            }
            close(o);
            return ok;
          }

          // A superstar mod's move pack (<mod>/moves/pack.txt, or <mod>/pack.txt): every "motion" and "pacentry"
          // line names a file in the pack's folder; the game reports a missing one only in its log, and the
          // move then has no motion (it freezes in the ring). Counts the files and lists the missing ones.
          struct SvrPackCheck {
            bool hasPack = false;
            int total = 0;
            int missing = 0;
            std::vector<std::string> examples;  // the first few missing files
          };

          static SvrPackCheck SvrMovePackCheck(const std::string& modDir) {
            SvrPackCheck r;
            for (const std::string& dir : {modDir + "/moves", modDir}) {
              std::ifstream f(dir + "/pack.txt");
              if (!f) continue;
              r.hasPack = true;
              for (std::string line; std::getline(f, line);) {
                if (!line.empty() && line.back() == '\r') line.pop_back();
                std::istringstream in(line);
                std::string kind, file;
                in >> kind;
                if (kind == "motion") {
                  std::string pac, path, hdr;
                  unsigned id = 0, x = 0, y = 0, frames = 0;
                  in >> pac >> path >> id >> x >> y >> frames >> file >> hdr;
                } else if (kind == "pacentry") {
                  std::string pac, group, name;
                  in >> pac >> group >> name >> file;
                } else {
                  continue;
                }
                if (file.empty()) continue;
                r.total++;
                struct stat st;
                if (stat((dir + "/" + file).c_str(), &st) != 0 || !S_ISREG(st.st_mode)) {
                  r.missing++;
                  if (r.examples.size() < 3) r.examples.push_back(file);
                }
              }
              break;  // (the first folder with a pack.txt is the pack, as the game reads it)
            }
            return r;
          }

          // Installs a .svrmod (a zip with manifest.txt and the mod's files) into Mods/<kind>/<id>.
          // Returns "" (and the mod's name in *name) or the reason it was refused.
          static std::string SvrModInstall(const std::string& zipPath, std::string* name, std::string* warning = nullptr) {
            namespace fs = std::filesystem;
            const int fd = open(zipPath.c_str(), O_RDONLY);
            if (fd < 0) return "can't read it";
            std::vector<SvrZipEntry> entries;
            std::string error;
            if (!SvrZipList(fd, &entries, &error)) {
              close(fd);
              return error;
            }
            const std::string mods = SvrModsDir();
            const std::string stage = mods + "/.stage";
            std::error_code ec;
            fs::remove_all(stage, ec);
            fs::create_directories(stage, ec);
            for (const SvrZipEntry& e : entries) {
              if (e.name.empty() || e.name.back() == '/' || e.name.back() == '\\') continue;
              std::string n = e.name;
              std::replace(n.begin(), n.end(), '\\', '/');
              const size_t slash = n.find_last_of('/');
              const std::string leaf = slash == std::string::npos ? n : n.substr(slash + 1);
              // (subfolders are kept - a superstar mod's moves/motions/ - but nothing outside the mod's folder)
              if (leaf.empty() || leaf[0] == '.' || n[0] == '/' || n.find(':') != std::string::npos ||
                  ("/" + n + "/").find("/../") != std::string::npos) {
                continue;
              }
              const std::string out = stage + "/" + n;
              fs::create_directories(fs::path(out).parent_path(), ec);
              if (!SvrCopyEntryToFile(fd, e, out)) {
                close(fd);
                fs::remove_all(stage, ec);
                return "can't unpack " + n;
              }
            }
            close(fd);

            std::map<std::string, std::string> m = SvrModManifest(stage);
            std::string type = m.count("type") ? m["type"] : "arena";
            for (char& c : type) c = static_cast<char>(tolower(static_cast<unsigned char>(c)));
            const SvrModKind* kind = SvrModKindFor(type);
            if (!kind) {
              fs::remove_all(stage, ec);
              return "its type \"" + type + "\" isn't known";
            }
            const bool pic = type == "background";
            if (type == "attire" && !SvrModHasMarker(*kind, stage)) {
              fs::remove_all(stage, ec);
              return "that attire mod has no attire.pac";
            }
            if (pic && !SvrModHasMarker(*kind, stage)) {
              fs::remove_all(stage, ec);
              return "it has no pictures (.dds)";
            }
            if (!pic && type != "attire" && type != "signs" && type != "media" && type != "matchtype" &&
                !SvrModHasMarker(*kind, stage)) {
              fs::remove_all(stage, ec);
              return type == "superstar" ? "it has no ch.pac" : "it has no arena (not a SvR2011 mod?)";
            }
            std::string id;
            if (m.count("id")) {
              for (char c : m["id"]) id += (isalnum(static_cast<unsigned char>(c)) || c == '_' || c == '-') ? c : '_';
            }
            if (id.empty()) id = type;
            const std::string need = (pic || type == "signs" || type == "media" || type == "matchtype") ? "manifest.txt"
                                                                                                         : kind->marker;
            const std::string kindDir = mods + "/" + kind->folder;
            const std::string dest = kindDir + "/" + id;
            const std::string fresh = mods + "/.new-" + kind->folder + "-" + id;
            const std::string old = mods + "/.old-" + kind->folder + "-" + id;
            fs::remove_all(fresh, ec);
            fs::remove_all(old, ec);
            fs::create_directories(kindDir, ec);
            // The new copy beside the old one first, then the old one aside, the new one in (the old one back if
            // that fails) and only then the old one deleted: a failure leaves the installed copy as it was.
            if (rename(stage.c_str(), fresh.c_str()) != 0) {
              fs::remove_all(stage, ec);
              return "can't write to the game folder; the installed copy is unchanged";
            }
            struct stat st;
            if (stat((fresh + "/" + need).c_str(), &st) != 0) {
              fs::remove_all(fresh, ec);
              return "it has no " + need;
            }
            const bool existed = stat(dest.c_str(), &st) == 0;
            if (existed && rename(dest.c_str(), old.c_str()) != 0) {
              fs::remove_all(fresh, ec);
              return "can't replace the installed copy (it is unchanged)";
            }
            if (rename(fresh.c_str(), dest.c_str()) != 0) {
              if (existed) rename(old.c_str(), dest.c_str());
              fs::remove_all(fresh, ec);
              return "can't move the new copy in (the installed copy is unchanged)";
            }
            fs::remove_all(old, ec);
            if (type == "attire") {  // (the install order: the newer moves)
              std::ofstream(dest + "/.installed") << static_cast<long long>(time(nullptr)) * 1000;
            }
            *name = m.count("name") && !m["name"].empty() ? m["name"] : id;
            if (warning) {
              const SvrPackCheck pack = SvrMovePackCheck(dest);
              if (pack.missing > 0) {
                *warning = std::to_string(pack.missing) + " of " + std::to_string(pack.total) +
                           " move files are missing from the mod (for example " + pack.examples[0] +
                           "): moves that use them will freeze in the ring";
              }
            }
            return "";
          }

          struct SvrModInfo {
            const SvrModKind* kind = nullptr;
            std::string id;
            std::string name;
            std::string hint;
            bool enabled = true;
          };

          static std::vector<SvrModInfo> SvrModsList() {
            std::vector<SvrModInfo> out;
            for (const SvrModKind& k : kSvrModKinds) {
              const std::string dir = SvrModsDir() + "/" + k.folder;
              DIR* d = opendir(dir.c_str());
              if (!d) continue;
              std::vector<std::string> names;
              while (const struct dirent* e = readdir(d)) {
                const std::string n = e->d_name;
                struct stat st;
                if (n[0] != '.' && stat((dir + "/" + n).c_str(), &st) == 0 && S_ISDIR(st.st_mode)) names.push_back(n);
              }
              closedir(d);
              std::sort(names.begin(), names.end(),
                        [](const std::string& a, const std::string& b) { return strcasecmp(a.c_str(), b.c_str()) < 0; });
              for (const std::string& n : names) {
                const std::string path = dir + "/" + n;
                if (!SvrModHasMarker(k, path)) continue;
                std::map<std::string, std::string> m = SvrModManifest(path);
                SvrModInfo info;
                info.kind = &k;
                info.id = n;
                info.name = m.count("name") && !m["name"].empty() ? m["name"] : n;
                info.hint = k.label;
                if (std::string(k.type) == "attire" && m.count("attire")) info.hint += " " + m["attire"];
                if (m.count("author") && !m["author"].empty()) info.hint += " by " + m["author"];
                if (m.count("version")) info.hint += ", v" + m["version"];
                struct stat st;
                if (k.marker[0] != '\0' && std::string(k.marker) != "manifest.txt" && stat((path + "/" + k.marker).c_str(), &st) == 0) {
                  info.hint += ", " + std::to_string(static_cast<unsigned long long>(st.st_size) / 1048576) + " MB";
                }
                info.enabled = stat((path + "/disabled").c_str(), &st) != 0;
                if (std::string(k.type) == "superstar") {
                  const SvrPackCheck pack = SvrMovePackCheck(path);
                  if (pack.hasPack) {
                    info.hint += pack.missing > 0 ? ", MOVES: " + std::to_string(pack.missing) + " of " + std::to_string(pack.total) +
                                                        " files MISSING (e.g. " + pack.examples[0] + ")"
                                                  : ", moves: " + std::to_string(pack.total) + " files ok";
                  }
                }
                out.push_back(info);
              }
            }
            return out;
          }

          static void SvrModSetEnabled(const SvrModKind& k, const std::string& id, bool on) {
            const std::string flag = SvrModsDir() + "/" + k.folder + "/" + id + "/disabled";
            if (on) {
              unlink(flag.c_str());
            } else {
              std::ofstream(flag).put('\n');
            }
          }

          // A removed superstar mod gives its id back: its line ("<folder>\t<id>") leaves Mods/Superstars/slots.txt.
          static void SvrFreeSuperstarSlot(const std::string& folderName) {
            const std::string slots = SvrModsDir() + "/Superstars/slots.txt";
            std::ifstream in(slots);
            if (!in) return;
            std::string keep;
            bool dropped = false;
            for (std::string line; std::getline(in, line);) {
              const size_t tab = line.rfind('\t');
              if (tab != std::string::npos && line.substr(0, tab) == folderName) {
                dropped = true;
                continue;
              }
              keep += line + "\n";
            }
            in.close();
            if (dropped) std::ofstream(slots, std::ios::trunc) << keep;
          }

          // Remove: a match type can't be taken out (the game has no folder for it), so it is switched off.
          static std::string SvrModRemove(const SvrModKind& k, const std::string& id) {
            if (id.empty() || id.find('/') != std::string::npos || id == "." || id == "..") return "bad name";
            if (std::string(k.type) == "matchtype") {
              SvrModSetEnabled(k, id, false);
              return "Match types can't be removed - it is switched off instead.";
            }
            std::error_code ec;
            std::filesystem::remove_all(SvrModsDir() + "/" + k.folder + "/" + id, ec);
            if (std::string(k.type) == "superstar") SvrFreeSuperstarSlot(id);
            return "";
          }

          // ---- Mods core end ----

          @interface SvrModsPage : NSObject
          @property(nonatomic, strong) UIScrollView* view;
          @property(nonatomic, weak) UIViewController* presenter;
          @property(nonatomic) BOOL busy;
          - (void)refresh;
          @end

          @implementation SvrModsPage {
            UILabel* _status;
            UILabel* _importInfo;
            UIStackView* _list;
            UIButton* _installBtn;
            NSTimer* _timer;
          }

          - (instancetype)init {
            self = [super init];
            if (!self) return nil;
            UIStackView* stack = nil;
            _view = SvrScrollPage(&stack);
            __weak SvrModsPage* weakSelf = self;

            _importInfo = SvrLabel(@"", 13.0, SVR_DIM, NO);
            _installBtn = SvrButton(@"Install every .svrmod from the Import folder", YES, ^{
              [weakSelf installImport];
            });
            _status = SvrLabel(@"", 13.0, SVR_DIM, NO);
            [stack addArrangedSubview:SvrCard(@[
              SvrLabel(@"Arenas, superstars, signs, media, backstage areas, match types, attires and menu backgrounds, as .svrmod files. Copy them into the Import folder (the same one as for the game and DLC) with the Files app, then tap the button. Mods start working the next time the game starts.",
                       13.0, SVR_DIM, NO),
              SvrMono(SvrNS(SvrImportDir())), _importInfo, _installBtn, _status
            ])];
            _list = [[UIStackView alloc] init];
            _list.axis = UILayoutConstraintAxisVertical;
            _list.spacing = 10.0;
            [stack addArrangedSubview:SvrCard(@[ SvrHeading(@"Installed"), _list ])];
            _timer = [NSTimer scheduledTimerWithTimeInterval:2.0 repeats:YES block:^(NSTimer* timer) {
              SvrModsPage* s = weakSelf;
              if (!s) {
                [timer invalidate];
                return;
              }
              if (s.view.window && !s.busy) [s updateImportInfo];
            }];
            [self refresh];
            return self;
          }

          - (std::vector<std::string>)importedMods {
            std::vector<std::string> names;
            for (const SvrImportFile& f : SvrImportFiles()) {
              if (SvrEndsWith(f.name, ".svrmod")) names.push_back(f.name);
            }
            return names;
          }

          - (void)updateImportInfo {
            const size_t count = [self importedMods].size();
            _importInfo.text = count == 0 ? @"No .svrmod files in the Import folder."
                                          : [NSString stringWithFormat:@"%lu .svrmod file%@ in the Import folder.",
                                                                       static_cast<unsigned long>(count), count == 1 ? @"" : @"s"];
          }

          - (void)refresh {
            [self updateImportInfo];
            for (UIView* v in [_list.arrangedSubviews copy]) [v removeFromSuperview];
            const std::vector<SvrModInfo> mods = SvrModsList();
            if (mods.empty()) {
              [_list addArrangedSubview:SvrLabel(@"None yet.", 15.0, SVR_DIM, NO)];
              return;
            }
            __weak SvrModsPage* weakSelf = self;
            for (const SvrModInfo& m : mods) {
              NSString* name = SvrNS(m.name);
              NSString* modId = SvrNS(m.id);
              const SvrModKind* kind = m.kind;
              SvrSwitch* sw = SvrToggle(m.enabled, ^(BOOL on) {
                SvrModSetEnabled(*kind, SvrStd(modId), on);
                SvrModsPage* s = weakSelf;
                if (s) s->_status.text = [NSString stringWithFormat:@"%@ is %@. (from the next game start)", name, on ? @"on" : @"off"];
              });
              UIButton* remove = SvrButton(@"Remove", NO, ^{
                [weakSelf confirmRemove:kind modId:modId name:name];
              });
              [remove.widthAnchor constraintEqualToConstant:100.0].active = YES;
              [_list addArrangedSubview:SvrRowBox(name, SvrNS(m.hint), @[ sw, remove ])];
            }
          }

          - (void)installImport {
            if (self.busy) return;
            if (!SvrFileExists(SvrDocs() + "/default.xex")) {
              _status.text = @"Install the game first (Install tab).";
              return;
            }
            const std::vector<std::string> files = [self importedMods];
            if (files.empty()) {
              _status.text = @"Copy .svrmod files into the Import folder first.";
              return;
            }
            self.busy = YES;
            _installBtn.enabled = NO;
            _status.text = @"Installing…";
            __weak SvrModsPage* weakSelf = self;
            dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
              std::vector<std::string> ok, failed;
              for (const std::string& f : files) {
                std::string name, warning;
                const std::string error = SvrModInstall(SvrImportDir() + "/" + f, &name, &warning);
                if (error.empty()) {
                  ok.push_back(name);
                  if (!warning.empty()) failed.push_back(name + " installed, but " + warning);
                } else {
                  failed.push_back(f + " - " + error);
                }
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                [weakSelf finishInstall:ok failed:failed];
              });
            });
          }

          - (void)finishInstall:(std::vector<std::string>)ok failed:(std::vector<std::string>)failed {
            self.busy = NO;
            _installBtn.enabled = YES;
            NSMutableString* text = [NSMutableString string];
            if (!ok.empty()) {
              NSMutableArray<NSString*>* names = [NSMutableArray array];
              for (const std::string& n : ok) [names addObject:SvrNS(n)];
              [text appendFormat:@"Installed: %@. They work from the next game start.", [names componentsJoinedByString:@", "]];
            }
            for (const std::string& f : failed) [text appendFormat:@"%@%@", text.length ? @"\n" : @"", SvrNS(f)];
            _status.text = text;
            [self refresh];
          }

          - (void)confirmRemove:(const SvrModKind*)kind modId:(NSString*)modId name:(NSString*)name {
            UIViewController* host = self.presenter;
            if (!host || self.busy) return;
            const BOOL matchType = std::string(kind->type) == "matchtype";
            UIAlertController* alert = [UIAlertController
                alertControllerWithTitle:matchType ? @"Switch this match type off?" : @"Remove this mod?"
                                 message:matchType ? [NSString stringWithFormat:@"%@ can't be removed (the game keeps match types); it will be switched off.", name]
                                                   : [NSString stringWithFormat:@"%@ will be deleted.", name]
                          preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
            __weak SvrModsPage* weakSelf = self;
            [alert addAction:[UIAlertAction actionWithTitle:matchType ? @"Switch off" : @"Remove" style:UIAlertActionStyleDestructive
                                                    handler:^(UIAlertAction* action) {
                                                      SvrModsPage* s = weakSelf;
                                                      if (!s) return;
                                                      const std::string note = SvrModRemove(*kind, SvrStd(modId));
                                                      s->_status.text = note.empty() ? [NSString stringWithFormat:@"Removed %@.", name]
                                                                                     : [NSString stringWithFormat:@"%@ - %@", name, SvrNS(note)];
                                                      [s refresh];
                                                    }]];
            [host presentViewController:alert animated:YES completion:nil];
          }

          @end

          // ---- Created Superstar import: a C++ port of the Android launcher's CawImport and the parts of its PaintTool
          // that logos need (byte for byte the same: the record, checksums, palette + pixels, the DXT5 picture). ----

          namespace svrsave {

          namespace fs = std::filesystem;
          using Bytes = std::vector<uint8_t>;

          constexpr int kCasSize = 1347532;
          constexpr int kRecInCas = 0x1483C4, kRecBase = 0x13FB8, kRecSize = 0x6BC, kMaxCaw = 50;
          constexpr int kSdSumFrom = 0x1C, kSdSumTo = 0x812DC;
          constexpr int kCache0 = 20, kCacheSize = 186580, kAttires = 4;
          constexpr int kLowUsed = 12168, kHighUsed = 12178, kPalettes = 12180, kHighPixels = 14228;
          constexpr int kLowPixels = 22420, kHighIds = 145300, kLowIds = 186260, kExtOffset = 160000;
          constexpr int32_t kExtMagic = 0x584C4731;
          constexpr int kMaxHigh = 10, kLogoBin = 1024 + 65536;
          constexpr int32_t kTitleId = 0x5451085D;
          static const int kTail[13][2] = {{0x54A, 0x02}, {0x54C, 0x01}, {0x667, 0x4D}, {0x66C, 0x01}, {0x66D, 0x03},
                                           {0x676, 0xC7}, {0x677, 0x03}, {0x678, 0x58}, {0x679, 0x05}, {0x683, 0x6A},
                                           {0x689, 0x0E}, {0x68C, 0x01}, {0x690, 0x01}};

          struct Picked {
            std::string name;
            Bytes data;
          };

          struct Logo {
            std::array<uint8_t, 1024> palette;
            std::array<uint8_t, 65536> pixels;
            int32_t logo_id = 0;
          };

          static inline int32_t Be32(const uint8_t* d, size_t o) {
            return static_cast<int32_t>(uint32_t(d[o]) << 24 | uint32_t(d[o + 1]) << 16 | uint32_t(d[o + 2]) << 8 | uint32_t(d[o + 3]));
          }
          static inline int32_t Le32(const uint8_t* d, size_t o) {
            return static_cast<int32_t>(uint32_t(d[o]) | uint32_t(d[o + 1]) << 8 | uint32_t(d[o + 2]) << 16 | uint32_t(d[o + 3]) << 24);
          }
          static inline void WBe32(uint8_t* d, size_t o, uint32_t v) {
            d[o] = static_cast<uint8_t>(v >> 24);
            d[o + 1] = static_cast<uint8_t>(v >> 16);
            d[o + 2] = static_cast<uint8_t>(v >> 8);
            d[o + 3] = static_cast<uint8_t>(v);
          }
          static inline int32_t Le24(const uint8_t* d, size_t o) { return d[o] | d[o + 1] << 8 | d[o + 2] << 16; }
          static int32_t ByteSum(const Bytes& d, size_t from, size_t to) {
            int32_t s = 0;
            for (size_t i = from; i < to; ++i) s += d[i];
            return s;
          }

          // ---- files ----

          static bool ReadFile(const fs::path& path, Bytes* out) {
            std::error_code ec;
            if (!fs::is_regular_file(path, ec)) return false;
            const uintmax_t size = fs::file_size(path, ec);
            if (ec || size > 64ull * 1024 * 1024) return false;
            FILE* f = std::fopen(path.c_str(), "rb");
            if (!f) return false;
            out->assign(static_cast<size_t>(size), 0);
            const size_t got = size ? std::fread(out->data(), 1, static_cast<size_t>(size), f) : 0;
            std::fclose(f);
            return got == size;
          }

          // Writes `path` whole or not at all: path.new, flushed, renamed over it.
          static bool WriteFileRaw(const fs::path& path, const uint8_t* data, size_t n) {
            const std::string tmp = path.string() + ".new";
            const int fd = ::open(tmp.c_str(), O_WRONLY | O_CREAT | O_TRUNC, 0644);
            if (fd < 0) return false;
            bool ok = true;
            size_t done = 0;
            while (done < n) {
              const ssize_t w = ::write(fd, data + done, n - done);
              if (w <= 0) {
                ok = false;
                break;
              }
              done += static_cast<size_t>(w);
            }
            if (ok) ::fsync(fd);
            ::close(fd);
            if (!ok || ::rename(tmp.c_str(), path.c_str()) != 0) {
              ::unlink(tmp.c_str());
              return false;
            }
            return true;
          }

          static void WriteFileOrThrow(const fs::path& path, const Bytes& b) {
            if (!WriteFileRaw(path, b.data(), b.size())) throw std::runtime_error("could not write " + path.filename().string());
          }

          // ---- Xbox 360 packages (STFS) ----

          struct Stfs {
            const Bytes& d;
            int sex, step0, step1;
            int32_t first;
            int top, sep;

            int64_t DataBlock(int64_t b) const {
              const int64_t r = (((b + 0xAA) / 0xAA) << sex) + b;
              if (b < 0xAA) return r;
              if (b < 0x70E4) return r + (((b + 0x70E4) / 0x70E4) << sex);
              return (int64_t(1) << sex) + r + (((b + 0x70E4) / 0x70E4) << sex);
            }

            int64_t Next(int64_t b) const {
              int64_t l0 = 0;
              if (b >= 0xAA) {
                l0 = (b / 0xAA) * step0 + (((b / 0x70E4) + 1) << sex);
                if (b / 0x70E4 != 0) l0 += int64_t(1) << sex;
              }
              int64_t at = (l0 << 12) + first + (b % 0xAA) * 0x18;
              if (top == 0) {
                at += int64_t(sep & 2) << 0xB;
              } else {
                const int64_t l1 = b < 0x70E4 ? step0 : (int64_t(1) << sex) + (b / 0x70E4) * step1;
                const int64_t t = (l1 << 12) + first + (int64_t(sep & 2) << 0xB) + (b / 0xAA) * 0x18 + 0x14;
                if (t < 0 || t >= static_cast<int64_t>(d.size())) return -1;
                at += int64_t(d[static_cast<size_t>(t)] & 0x40) << 6;
              }
              if (at < 0 || at + 0x18 > static_cast<int64_t>(d.size())) return -1;
              const size_t a = static_cast<size_t>(at);
              return int64_t(d[a + 0x15]) << 16 | int64_t(d[a + 0x16]) << 8 | int64_t(d[a + 0x17]);
            }

            bool Read(int64_t start, int count, bool in_a_row, Bytes* out) const {
              if (count < 0 || static_cast<int64_t>(count) > static_cast<int64_t>(d.size() / 0x1000) + 1) return false;
              out->assign(static_cast<size_t>(count) * 0x1000, 0);
              int64_t b = start;
              for (int i = 0; i < count; ++i) {
                if (b < 0) return false;  // (-1: the chain ended early)
                const int64_t at = (DataBlock(b) << 12) + first;
                if (at < 0 || at + 0x1000 > static_cast<int64_t>(d.size())) return false;
                std::memcpy(out->data() + static_cast<size_t>(i) * 0x1000, d.data() + at, 0x1000);
                b = in_a_row ? b + 1 : Next(b);
              }
              return true;
            }
          };

          // A 360 saved-game package's save file, or false if `d` isn't one of the game's.
          static bool Unpackage(const Bytes& d, Bytes* out) {
            if (d.size() < 0x1000) return false;
            const uint8_t* p = d.data();
            const std::string magic(reinterpret_cast<const char*>(p), 4);
            if (magic != "CON " && magic != "LIVE" && magic != "PIRS") return false;
            if (Be32(p, 0x360) != kTitleId || Be32(p, 0x344) != 1) return false;
            const int32_t header_size = Be32(p, 0x340);
            const int sep = p[0x379 + 2];
            const int ft_count = p[0x379 + 3] | p[0x379 + 4] << 8;
            const int ft_block = Le24(p, 0x379 + 5);
            const int32_t allocated = Be32(p, 0x379 + 0x1C);
            const int sex = (~sep) & 1;
            const int step0 = sex ? 0xAC : 0xAB;
            const int step1 = sex ? 0x723A : 0x718F;
            const int32_t first = static_cast<int32_t>((static_cast<uint32_t>(header_size) + 0xFFFu) & 0xFFFFF000u);
            const int top = allocated <= 0xAA ? 0 : allocated <= 0x70E4 ? 1 : 2;
            if (top == 2 || ft_count == 0 || ft_count > 64) return false;
            const Stfs k{d, sex, step0, step1, first, top, sep};
            Bytes table;
            if (!k.Read(ft_block, ft_count, false, &table)) return false;
            for (size_t i = 0; i + 0x40 <= table.size(); i += 0x40) {
              const int flags = table[i + 0x28];
              if ((flags & 0x3F) == 0 || (flags & 0x80) != 0) continue;
              const int32_t blocks = Le24(table.data(), i + 0x29), start = Le24(table.data(), i + 0x2F);
              const int32_t size = Be32(table.data(), i + 0x34);
              const int32_t limit = static_cast<int32_t>(static_cast<uint32_t>(blocks) * 0x1000u);
              if (blocks == 0 || size < 0 || size > limit) return false;
              Bytes data;
              if (!k.Read(start, blocks, (flags & 0x40) != 0, &data)) return false;
              data.resize(static_cast<size_t>(size));
              *out = std::move(data);
              return true;
            }
            return false;
          }

          static bool IsCaw(const Bytes& d) {
            return d.size() == static_cast<size_t>(kCasSize) && Be32(d.data(), 0) == 0x4B && Be32(d.data(), 4) == 0x18 &&
                   Be32(d.data(), 8) == 7;
          }
          static bool IsMainSave(const Bytes& d) {
            return d.size() >= static_cast<size_t>(kSdSumTo) && Be32(d.data(), 8) == 0x1C && Be32(d.data(), 12) == 0x4B &&
                   Be32(d.data(), 16) == 0x18 && Be32(d.data(), 20) == 3;
          }

          // ---- the Paint Tool save (Saves/00PaintTool.pt) and the port's extra pages (Saves/.paint/pNN_sMM.bin) ----

          constexpr int kSlots = 20, kSlot = 0x604CC, kPtBytes = 8 + kSlots * kSlot + 4;
          constexpr int32_t kPtMagic = 0x02A78E9A;
          constexpr int kPtVersion = 3, kW = 256, kCanvas = 52, kTga = 0x40034, kDds = 0x50448, kStamp = 0x604C8, kSum = 0x604D0;
          constexpr int kPages = 10;

          static const uint8_t kUsedHeader[44] = {0x00, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00, 0x0E, 0x00,
                                                  0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00,
                                                  0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00,
                                                  0x00, 0x00, 0x01, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00};
          static const uint8_t kEmptyHeader16[16] = {0x00, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x00,
                                                     0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00};
          static const uint8_t kTgaHeader[20] = {0x00, 0x01, 0x01, 0x00, 0x00, 0x01, 0x00, 0x20, 0x00, 0x00,
                                                 0x00, 0x00, 0x01, 0x00, 0x01, 0x00, 0x08, 0x00, 0x04, 0x01};

          static const std::array<uint8_t, 128>& DdsHeader() {
            static const std::array<uint8_t, 128> h = [] {
              std::array<uint8_t, 128> a{};
              const uint8_t base[24] = {0x44, 0x44, 0x53, 0x20, 0x7C, 0x00, 0x00, 0x00, 0x07, 0x10, 0x08, 0x00,
                                        0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00};
              std::memcpy(a.data(), base, sizeof(base));
              a[76] = 0x20;
              a[80] = 0x04;
              a[84] = 0x44;
              a[85] = 0x58;
              a[86] = 0x54;
              a[87] = 0x35;
              a[108] = 0x02;
              a[109] = 0x10;
              return a;
            }();
            return h;
          }

          static inline int32_t Rd32(const Bytes& f, size_t p) { return Be32(f.data(), p); }
          static inline int32_t Rd16(const Bytes& f, size_t p) { return f[p] << 8 | f[p + 1]; }
          static inline void Wr32(Bytes& f, size_t p, uint32_t v) { WBe32(f.data(), p, v); }
          static inline size_t SlotAt(int k) { return static_cast<size_t>(k) * kSlot; }
          static bool SlotUsed(const Bytes& f, int k) { return Rd32(f, SlotAt(k) + 36) != 0; }
          static size_t TgaOffset(int k) { return SlotAt(k) + kTga; }
          static int32_t StoredSum(const Bytes& f, int k) { return Rd32(f, SlotAt(k) + kSum); }

          // The game's slot checksum: every field added as the type the game reads it as.
          static int32_t SlotSum(const Bytes& f, int k) {
            static const int kWords[9] = {8, 12, 16, 28, 32, 36, 40, 44, 48};
            static const int kTb[6] = {0, 1, 2, 7, 16, 17};
            static const int kTh[7] = {3, 5, 8, 10, 12, 14, 18};
            const size_t b = SlotAt(k), t = b + kTga, d = b + kDds, e = b + kStamp;
            uint32_t s = 0;
            for (int i = 20; i < 28; ++i) s += static_cast<uint32_t>(static_cast<int32_t>(static_cast<int8_t>(f[b + i])));
            for (int i = 0; i < 9; ++i) s += static_cast<uint32_t>(Rd32(f, b + kWords[i]));
            for (int i = 0; i < kW * kW; ++i) s += static_cast<uint32_t>(Rd32(f, b + kCanvas + 4 * i));
            for (int i = 0; i < 6; ++i) s += f[t + kTb[i]];
            for (int i = 0; i < 7; ++i) s += static_cast<uint32_t>(Rd16(f, t + kTh[i]));
            for (int i = 0; i < 256; ++i) s += static_cast<uint32_t>(Rd32(f, t + 20 + 4 * i));
            for (int i = 0; i < kW * kW; ++i) s += f[t + 0x414 + i];
            for (int i = 0; i < 32; ++i) s += static_cast<uint32_t>(Rd32(f, d + 4 * i));
            for (int j = 0; j < 2048; ++j) {
              const size_t q = d + 128 + 32 * static_cast<size_t>(j);
              s += static_cast<uint32_t>(Rd16(f, q)) + static_cast<uint32_t>(Rd16(f, q + 2)) + static_cast<uint32_t>(Rd32(f, q + 4)) +
                   static_cast<uint32_t>(Rd16(f, q + 8)) + static_cast<uint32_t>(Rd16(f, q + 10)) + static_cast<uint32_t>(Rd32(f, q + 12)) +
                   static_cast<uint32_t>(Rd16(f, q + 16)) + static_cast<uint32_t>(Rd16(f, q + 18)) + static_cast<uint32_t>(Rd32(f, q + 20)) +
                   static_cast<uint32_t>(Rd16(f, q + 24)) + static_cast<uint32_t>(Rd16(f, q + 26)) + static_cast<uint32_t>(Rd32(f, q + 28));
            }
            s += static_cast<uint32_t>(Rd16(f, e));
            for (int i = 2; i < 8; ++i) s += f[e + i];
            return static_cast<int32_t>(s);
          }

          static void FixSums(Bytes& f) {
            uint32_t total = static_cast<uint32_t>(Rd32(f, 0)) + static_cast<uint32_t>(Rd32(f, 4));
            for (int k = 0; k < kSlots; ++k) {
              const int32_t s = SlotSum(f, k);
              Wr32(f, SlotAt(k) + kSum, static_cast<uint32_t>(s));
              total += static_cast<uint32_t>(s);
            }
            Wr32(f, kPtBytes - 4, total);
          }

          static bool PtValid(const Bytes& f) {
            if (f.size() < static_cast<size_t>(kPtBytes) || Rd32(f, 0) != kPtMagic || Rd32(f, 4) != kPtVersion) return false;
            uint32_t total = static_cast<uint32_t>(Rd32(f, 0)) + static_cast<uint32_t>(Rd32(f, 4));
            for (int k = 0; k < kSlots; ++k) total += static_cast<uint32_t>(Rd32(f, SlotAt(k) + kSum));
            return total == static_cast<uint32_t>(Rd32(f, kPtBytes - 4));
          }

          static fs::path PageFile(const fs::path& saves, int page, int k) {
            char name[32];
            std::snprintf(name, sizeof(name), "p%02d_s%02d.bin", page, k + 1);
            return saves / ".paint" / name;
          }

          static void ClearSlot(Bytes& f, int k) {
            const size_t b = SlotAt(k);
            std::fill(f.begin() + static_cast<ptrdiff_t>(b + 8), f.begin() + static_cast<ptrdiff_t>(b + kStamp), uint8_t(0));
            std::memcpy(&f[b + 8], kEmptyHeader16, 16);  // (the empty header: 44 bytes, the rest zero)
          }

          static bool ReadWhole(const fs::path& path, Bytes* out) {
            Bytes f;
            if (!ReadFile(path, &f) || f.size() != static_cast<size_t>(kPtBytes) || !PtValid(f)) return false;
            *out = std::move(f);
            return true;
          }

          // Page `page` (1-based, 1..10) as a whole Paint Tool file: page 1 is 00PaintTool.pt (false when missing or not valid),
          // pages 2..10 are built from Saves/.paint/pNN_sMM.bin (they need 00PaintTool.pt to exist).
          static bool ReadPage(const fs::path& saves, int page, Bytes* out) {
            const fs::path pt = saves / "00PaintTool.pt";
            if (page < 1 || page > kPages) return false;
            std::error_code ec;
            if (page == 1 || !fs::exists(pt, ec)) return ReadWhole(pt, out);
            Bytes buf(kPtBytes, 0);
            Wr32(buf, 0, static_cast<uint32_t>(kPtMagic));
            Wr32(buf, 4, kPtVersion);
            for (int k = 0; k < kSlots; ++k) {
              size_t got = 0;
              FILE* f = std::fopen(PageFile(saves, page, k).c_str(), "rb");
              if (f) {
                got = std::fread(&buf[SlotAt(k) + 8], 1, kSlot, f);
                std::fclose(f);
              }
              if (got != static_cast<size_t>(kSlot) || !SlotUsed(buf, k)) ClearSlot(buf, k);
            }
            FixSums(buf);
            *out = std::move(buf);
            return true;
          }

          static bool WritePage(const fs::path& saves, int page, Bytes& f) {
            if (page < 1 || page > kPages || f.size() < static_cast<size_t>(kPtBytes)) return false;
            FixSums(f);
            if (page == 1) return WriteFileRaw(saves / "00PaintTool.pt", f.data(), kPtBytes);
            std::error_code ec;
            fs::create_directories(saves / ".paint", ec);
            if (!fs::is_directory(saves / ".paint", ec)) return false;
            bool ok = true;
            for (int k = 0; k < kSlots; ++k) {
              const fs::path file = PageFile(saves, page, k);
              if (!SlotUsed(f, k)) {
                fs::remove(file, ec);
                continue;
              }
              if (!WriteFileRaw(file, &f[SlotAt(k) + 8], kSlot)) ok = false;
            }
            return ok;
          }

          static int To565(int r, int g, int b) { return (((r * 31 + 127) / 255) << 11 | ((g * 63 + 127) / 255) << 5 | ((b * 31 + 127) / 255)) & 0xFFFF; }

          // The slot's 128 x 128-block DXT5 picture, as the game and the PC launcher make it.
          static void MakeDds(Bytes& f, size_t d, const std::vector<uint32_t>& argb) {
            size_t o = d + 128;
            uint32_t px[16];
            int apal[8], cr[4], cg[4], cb[4];
            std::memcpy(&f[d], DdsHeader().data(), 128);
            for (int by = 0; by < kW / 4; ++by) {
              for (int bx = 0; bx < kW / 4; ++bx, o += 16) {
                int amin = 255, amax = 0;
                uint64_t abits = 0;
                uint32_t cbits = 0;
                int c0 = 0, c1 = 0;
                for (int i = 0; i < 16; ++i) {
                  const uint32_t p = argb[static_cast<size_t>((by * 4 + i / 4) * kW + bx * 4 + i % 4)];
                  const int a = static_cast<int>(p >> 24);
                  px[i] = p;
                  if (a < amin) amin = a;
                  if (a > amax) amax = a;
                }
                apal[0] = amax;
                apal[1] = amin;
                for (int i = 1; i < 7; ++i) apal[i + 1] = ((7 - i) * amax + i * amin) / 7;
                for (int i = 0; i < 16; ++i) {
                  const int a = static_cast<int>(px[i] >> 24);
                  int best = 0, bd = 1 << 30;
                  for (int k = 0; k < 8; ++k) {
                    const int dd = std::abs(a - apal[k]);
                    if (dd < bd) {
                      bd = dd;
                      best = k;
                    }
                  }
                  abits |= static_cast<uint64_t>(best) << (3 * i);
                }
                f[o] = static_cast<uint8_t>(amax);
                f[o + 1] = static_cast<uint8_t>(amin);
                for (int i = 0; i < 6; ++i) f[o + 2 + static_cast<size_t>(i)] = static_cast<uint8_t>(abits >> (8 * i));
                {
                  int best = -1, pa = 0, pb = 0;
                  for (int a2 = 0; a2 < 16; ++a2) {
                    for (int b2 = a2 + 1; b2 < 16; ++b2) {
                      const int dr = static_cast<int>((px[a2] >> 16) & 0xFF) - static_cast<int>((px[b2] >> 16) & 0xFF);
                      const int dg = static_cast<int>((px[a2] >> 8) & 0xFF) - static_cast<int>((px[b2] >> 8) & 0xFF);
                      const int db = static_cast<int>(px[a2] & 0xFF) - static_cast<int>(px[b2] & 0xFF);
                      const int dd = dr * dr + dg * dg + db * db;
                      if (dd > best) {
                        best = dd;
                        pa = a2;
                        pb = b2;
                      }
                    }
                  }
                  c0 = To565(static_cast<int>((px[pa] >> 16) & 0xFF), static_cast<int>((px[pa] >> 8) & 0xFF), static_cast<int>(px[pa] & 0xFF));
                  c1 = To565(static_cast<int>((px[pb] >> 16) & 0xFF), static_cast<int>((px[pb] >> 8) & 0xFF), static_cast<int>(px[pb] & 0xFF));
                }
                if (c0 < c1) std::swap(c0, c1);
                if (c0 != c1) {
                  cr[0] = ((c0 >> 11) & 31) * 255 / 31;
                  cg[0] = ((c0 >> 5) & 63) * 255 / 63;
                  cb[0] = (c0 & 31) * 255 / 31;
                  cr[1] = ((c1 >> 11) & 31) * 255 / 31;
                  cg[1] = ((c1 >> 5) & 63) * 255 / 63;
                  cb[1] = (c1 & 31) * 255 / 31;
                  cr[2] = (2 * cr[0] + cr[1]) / 3;
                  cg[2] = (2 * cg[0] + cg[1]) / 3;
                  cb[2] = (2 * cb[0] + cb[1]) / 3;
                  cr[3] = (cr[0] + 2 * cr[1]) / 3;
                  cg[3] = (cg[0] + 2 * cg[1]) / 3;
                  cb[3] = (cb[0] + 2 * cb[1]) / 3;
                  for (int i = 0; i < 16; ++i) {
                    const int r = static_cast<int>((px[i] >> 16) & 0xFF), g = static_cast<int>((px[i] >> 8) & 0xFF),
                              b = static_cast<int>(px[i] & 0xFF);
                    int best = 0, bd = 1 << 30;
                    for (int k = 0; k < 4; ++k) {
                      const int dd = (r - cr[k]) * (r - cr[k]) + (g - cg[k]) * (g - cg[k]) + (b - cb[k]) * (b - cb[k]);
                      if (dd < bd) {
                        bd = dd;
                        best = k;
                      }
                    }
                    cbits |= static_cast<uint32_t>(best) << (2 * i);
                  }
                }
                f[o + 8] = static_cast<uint8_t>(c0);
                f[o + 9] = static_cast<uint8_t>(c0 >> 8);
                f[o + 10] = static_cast<uint8_t>(c1);
                f[o + 11] = static_cast<uint8_t>(c1 >> 8);
                for (int i = 0; i < 4; ++i) f[o + 12 + static_cast<size_t>(i)] = static_cast<uint8_t>(cbits >> (8 * i));
              }
            }
          }

          // A logo given as a palette (256 entries, A R G B bytes) and 256 x 256 8-bit pixels - as a Created Superstar keeps it -
          // in slot k: the slot's 8-bit picture is those exact bytes.
          static void PutIndexed(Bytes& f, int k, const uint8_t* palette, const uint8_t* pixels) {
            const size_t b = SlotAt(k);
            std::vector<uint32_t> argb(static_cast<size_t>(kW) * kW);
            std::memcpy(&f[b + 8], kUsedHeader, 44);
            for (size_t i = 0; i < argb.size(); ++i) {
              const uint32_t c = static_cast<uint32_t>(Be32(palette, 4 * static_cast<size_t>(pixels[i])));
              argb[i] = c;
              Wr32(f, b + kCanvas + 4 * i, c);
            }
            std::memcpy(&f[b + kTga], kTgaHeader, 20);
            std::memcpy(&f[b + kTga + 20], palette, 1024);
            std::memcpy(&f[b + kTga + 0x414], pixels, static_cast<size_t>(kW) * kW);
            MakeDds(f, b + kDds, argb);
            const std::time_t now = std::time(nullptr);
            std::tm st = {};
            gmtime_r(&now, &st);
            const int year = st.tm_year + 1900;
            f[b + kStamp] = static_cast<uint8_t>(year >> 8);
            f[b + kStamp + 1] = static_cast<uint8_t>(year);
            f[b + kStamp + 2] = static_cast<uint8_t>(st.tm_mon + 1);
            f[b + kStamp + 3] = static_cast<uint8_t>(st.tm_mday);
            f[b + kStamp + 4] = static_cast<uint8_t>(st.tm_hour);
            f[b + kStamp + 5] = static_cast<uint8_t>(st.tm_min);
            f[b + kStamp + 6] = static_cast<uint8_t>(st.tm_sec);
            f[b + kStamp + 7] = static_cast<uint8_t>(st.tm_wday + 1);  // Sunday = 1
          }

          // ---- the import ----

          static void AddLogo(std::vector<Logo>& list, const uint8_t* src, size_t palette, size_t pixels, int size, int32_t lid) {
            Logo l;
            std::memcpy(l.palette.data(), src + palette, 1024);
            if (size == 256) {
              std::memcpy(l.pixels.data(), src + pixels, 65536);
            } else {
              for (int y = 0; y < 256; ++y)
                for (int x = 0; x < 256; ++x) l.pixels[static_cast<size_t>(y * 256 + x)] = src[pixels + static_cast<size_t>((y / 2) * 128 + x / 2)];
            }
            l.logo_id = lid;
            for (const Logo& o : list)
              if (o.palette == l.palette && o.pixels == l.pixels) return;
            list.push_back(std::move(l));
          }

          static void CollectLogos(const Bytes& cas, const fs::path& logos_dir, std::vector<Logo>& list) {
            const uint8_t* d = cas.data();
            for (int a = 0; a < kAttires; ++a) {
              const size_t c = static_cast<size_t>(kCache0 + a * kCacheSize), e = c + kExtOffset;
              const bool high = d[c + kHighUsed] != 0 || d[c + kHighUsed + 1] != 0;
              if (high) {
                for (int i = 0; i < 2; ++i)
                  if (d[c + kHighUsed + static_cast<size_t>(i)] != 0)
                    AddLogo(list, d, c + kPalettes + 1024 * static_cast<size_t>(i), c + kHighPixels + 65536 * static_cast<size_t>(i), 256,
                            Be32(d, c + kHighIds + 4 * static_cast<size_t>(i)));
              } else {
                for (int i = 0; i < 10; ++i)
                  if (d[c + kLowUsed + static_cast<size_t>(i)] != 0)
                    AddLogo(list, d, c + kPalettes + 1024 * static_cast<size_t>(i), c + kLowPixels + 16384 * static_cast<size_t>(i), 128,
                            Be32(d, c + kLowIds + 4 * static_cast<size_t>(i)));
              }
              if (!high || Le32(d, e) != kExtMagic) continue;
              for (int i = 2; i < kMaxHigh; ++i) {
                if (d[e + 8 + static_cast<size_t>(i)] == 0) continue;
                uint64_t hash = 0;
                for (int b = 7; b >= 0; --b) hash = hash << 8 | d[e + 24 + 8 * static_cast<size_t>(i) + static_cast<size_t>(b)];
                char name[32];
                std::snprintf(name, sizeof(name), "%016llX.bin", static_cast<unsigned long long>(hash));
                Bytes bin;
                if (ReadFile(logos_dir / name, &bin) && bin.size() == static_cast<size_t>(kLogoBin))
                  AddLogo(list, bin.data(), 0, 1024, 256, Le32(d, e + 104 + 4 * static_cast<size_t>(i)));
              }
            }
          }

          // {added, had already, didn't fit}
          static std::array<int, 3> LogosToPaint(const fs::path& saves, const std::vector<Logo>& logos) {
            std::array<int, 3> r = {0, 0, 0};
            if (logos.empty()) return r;
            std::vector<Bytes> pages(kPages);
            std::array<bool, kPages> have{}, dirty{};
            for (int p = 0; p < kPages; ++p) have[static_cast<size_t>(p)] = ReadPage(saves, p + 1, &pages[static_cast<size_t>(p)]);
            if (!have[0]) {
              r[2] = static_cast<int>(logos.size());
              return r;
            }
            for (const Logo& l : logos) {
              bool found = false, placed = false;
              for (int p = 0; p < kPages && !found; ++p) {
                for (int k = 0; have[static_cast<size_t>(p)] && k < kSlots && !found; ++k) {
                  const Bytes& pg = pages[static_cast<size_t>(p)];
                  if (!SlotUsed(pg, k)) continue;
                  const size_t t = TgaOffset(k);
                  found = (l.logo_id != 0 && StoredSum(pg, k) == l.logo_id) ||
                          (std::memcmp(&pg[t + 20], l.palette.data(), 1024) == 0 && std::memcmp(&pg[t + 0x414], l.pixels.data(), 65536) == 0);
                }
              }
              if (found) {
                ++r[1];
                continue;
              }
              for (int p = 0; p < kPages && !placed; ++p) {
                for (int k = 0; have[static_cast<size_t>(p)] && k < kSlots && !placed; ++k) {
                  Bytes& pg = pages[static_cast<size_t>(p)];
                  if (!SlotUsed(pg, k)) {
                    PutIndexed(pg, k, l.palette.data(), l.pixels.data());
                    dirty[static_cast<size_t>(p)] = placed = true;
                  }
                }
              }
              if (placed) ++r[0];
              else ++r[2];
            }
            for (int p = 0; p < kPages; ++p)
              if (dirty[static_cast<size_t>(p)]) WritePage(saves, p + 1, pages[static_cast<size_t>(p)]);
            return r;
          }

          static bool IsLogoBinName(const std::string& n) {
            if (n.size() != 20 || n.compare(16, 4, ".bin") != 0) {
              if (n.size() != 20) return false;
              std::string tail = n.substr(16);
              for (char& c : tail) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
              if (tail != ".bin") return false;
            }
            for (size_t i = 0; i < 16; ++i)
              if (!std::isxdigit(static_cast<unsigned char>(n[i]))) return false;
            return true;
          }

          // Imports the picked files into the saves folder; returns a summary for the status line. Throws std::runtime_error if
          // nothing could be done (no main save there, ...).
          static std::string Run(const fs::path& saves, std::vector<Picked>& picked) {
            std::vector<Bytes> caws, mains;
            const fs::path logos_dir = saves / ".logos";
            std::error_code ec;
            for (Picked& p : picked) {
              Bytes d = p.data, inner;
              if (Unpackage(d, &inner)) d = std::move(inner);
              if (IsCaw(d)) {
                caws.push_back(std::move(d));
              } else if (IsMainSave(d)) {
                mains.push_back(std::move(d));
              } else if (d.size() == static_cast<size_t>(kLogoBin) && IsLogoBinName(p.name)) {
                fs::create_directories(logos_dir, ec);
                std::string upper = p.name.substr(0, 16);
                for (char& c : upper) c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
                const fs::path to = logos_dir / (upper + ".bin");
                if (!fs::exists(to, ec)) WriteFileOrThrow(to, d);
              }
            }
            if (caws.empty()) throw std::runtime_error("none of the picked files is a Created Superstar (.cas).");
            const fs::path sd_file = saves / "SaveData.dat";
            Bytes sd;
            if (!ReadFile(sd_file, &sd) || sd.size() < static_cast<size_t>(kSdSumTo) || Be32(sd.data(), 0x18) != ByteSum(sd, kSdSumFrom, kSdSumTo))
              throw std::runtime_error("there is no main save (SaveData.dat) the game accepts yet: start the game once first.");
            std::vector<Logo> logos;
            std::vector<std::string> names;
            int full = 0;
            for (Bytes& cas : caws) {
              int slot = -1;
              for (int k = 0; k < kMaxCaw && slot < 0; ++k) {
                bool used = false;
                for (int i = 0; i < kRecSize && !used; ++i) used = sd[static_cast<size_t>(kRecBase + k * kRecSize + i)] != 0;
                char file[40];
                std::snprintf(file, sizeof(file), "%02dCreateSuperStar.cas", k);
                if (!used && !fs::exists(saves / file, ec)) slot = k;
              }
              if (slot < 0) {
                ++full;
                continue;
              }
              // the record: from a picked main save that has this Superstar's, else the .cas's copy
              Bytes rec;
              for (const Bytes& m : mains)
                for (int k = 0; k < kMaxCaw && rec.empty(); ++k)
                  if (Be32(m.data(), static_cast<size_t>(kRecBase + k * kRecSize + 0x65C)) == Be32(cas.data(), 12))
                    rec.assign(m.begin() + (kRecBase + k * kRecSize), m.begin() + (kRecBase + (k + 1) * kRecSize));
              if (rec.empty()) {
                rec.assign(kRecSize, 0);
                std::memcpy(rec.data(), cas.data() + kRecInCas, 0x548);
                for (const auto& t : kTail) rec[static_cast<size_t>(t[0])] = static_cast<uint8_t>(t[1]);
              }
              const size_t at = kRecInCas + 0x20;
              const int old = cas[at] + cas[at + 1];
              cas[at] = static_cast<uint8_t>(slot >> 8);
              cas[at + 1] = static_cast<uint8_t>(slot);
              const int delta = cas[at] + cas[at + 1] - old;
              for (size_t o : {size_t(12), size_t(0x148FC8), size_t(0x148DBC)})
                WBe32(cas.data(), o, static_cast<uint32_t>(Be32(cas.data(), o)) + static_cast<uint32_t>(delta));
              rec[0x20] = static_cast<uint8_t>(slot >> 8);
              rec[0x21] = static_cast<uint8_t>(slot);
              std::memcpy(&rec[0x65C], cas.data() + 12, 4);
              std::fill(rec.begin() + 0x69C, rec.end(), uint8_t(0));
              std::string name;
              for (int i = 0; i < 31 && rec[static_cast<size_t>(0x22 + i)] >= 0x20 && rec[static_cast<size_t>(0x22 + i)] < 0x7F; ++i)
                name.push_back(static_cast<char>(rec[static_cast<size_t>(0x22 + i)]));
              char file_buf[40];
              std::snprintf(file_buf, sizeof(file_buf), "%02dCreateSuperStar.cas", slot);
              const std::string file = file_buf;
              WriteFileOrThrow(saves / file, cas);
              Bytes h(328, 0);
              h[3] = 1;
              h[7] = 1;
              char disp_buf[40];
              std::snprintf(disp_buf, sizeof(disp_buf), "%02d.CREATED SUPERSTAR", slot + 1);
              const std::string disp = disp_buf;
              for (size_t i = 0; i < disp.size(); ++i) h[8 + 2 * i + 1] = static_cast<uint8_t>(disp[i]);
              for (size_t i = 0; i < file.size(); ++i) h[264 + i] = static_cast<uint8_t>(file[i]);
              h[320] = 0x54;
              h[321] = 0x51;
              h[322] = 0x08;
              h[323] = 0x5D;
              const fs::path info = saves / ".info";
              fs::create_directories(info, ec);
              WriteFileOrThrow(info / (file + ".header"), h);
              std::memcpy(&sd[static_cast<size_t>(kRecBase + slot * kRecSize)], rec.data(), kRecSize);
              WBe32(sd.data(), 0x18, static_cast<uint32_t>(ByteSum(sd, kSdSumFrom, kSdSumTo)));
              WriteFileOrThrow(sd_file, sd);
              CollectLogos(cas, logos_dir, logos);
              names.push_back(name + " (slot " + std::to_string(slot + 1) + ")");
            }
            const std::array<int, 3> r = LogosToPaint(saves, logos);
            std::string joined;
            for (size_t i = 0; i < names.size(); ++i) joined += (i ? ", " : "") + names[i];
            std::string s = "Imported " + std::to_string(names.size()) + " Created Superstar" + (names.size() == 1 ? "" : "s") +
                            (names.empty() ? "" : ": " + joined) + ". Logos: " + std::to_string(r[0]) + " added to the Paint Tool";
            if (r[1] > 0) s += ", some you had already";
            if (r[2] > 0) s += ", some didn't fit (the Paint Tool is full, or not made yet)";
            s += ".";
            if (full > 0) s += " " + std::to_string(full) + " didn't fit: all " + std::to_string(kMaxCaw) + " slots are in use.";
            return s;
          }

          }  // namespace svrsave


          // ---- the Save Manager tab: the game's save files (Documents/Saves), back up / restore (Documents/SaveBackups),
          // export / import through the Files picker, import someone's Created Superstars, and delete (to SaveBackups, as a
          // phone has no Recycle Bin). The Android launcher's Saves page, the same rules. ----

          static std::string SvrSavesDir() { return SvrDocs() + "/Saves"; }
          static std::string SvrBackupsDir() { return SvrDocs() + "/SaveBackups"; }

          // A save entry: not hidden (the dot folders), not desktop.ini, not a half-written copy.
          static BOOL SvrIsSaveName(NSString* n) {
            return n.length > 0 && ![n hasPrefix:@"."] && [n caseInsensitiveCompare:@"desktop.ini"] != NSOrderedSame &&
                   ![n hasSuffix:@".part"] && ![n hasSuffix:@".new"] && ![n containsString:@"/"];
          }

          static NSString* SvrSaveKind(NSString* name) {
            NSString* n = [name lowercaseString];
            if ([n isEqualToString:@"savedata.dat"]) return @"Main save";
            if ([n hasSuffix:@".cas"]) return @"Created Superstar";
            if ([n hasSuffix:@".pt"]) return @"Paint Tool logos";
            if ([n hasSuffix:@".rec"]) return @"Replay";
            if ([n hasSuffix:@".scn"]) return @"Highlight reel";
            return @"Created content";
          }

          // The name the game shows (the content header's UTF-16BE display name), or nil.
          static NSString* SvrSaveDisplayName(NSString* savesDir, NSString* name) {
            NSString* header = [[savesDir stringByAppendingPathComponent:@".info"] stringByAppendingPathComponent:[name stringByAppendingString:@".header"]];
            NSData* d = [NSData dataWithContentsOfFile:header];
            if (d.length < 264) return nil;
            const uint8_t* b = static_cast<const uint8_t*>(d.bytes) + 8;
            NSUInteger len = 0;
            while (len + 1 < 256 && (b[len] != 0 || b[len + 1] != 0)) len += 2;
            NSString* s = [[NSString alloc] initWithBytes:b length:len encoding:NSUTF16BigEndianStringEncoding];
            s = [s stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
            return s.length > 0 ? s : nil;
          }

          static NSString* SvrStamp() {
            NSDateFormatter* f = [[NSDateFormatter alloc] init];
            f.locale = [NSLocale localeWithLocaleIdentifier:@"en_US_POSIX"];
            f.dateFormat = @"yyyy-MM-dd HH-mm-ss";
            return [f stringFromDate:[NSDate date]];
          }

          static int SvrCountSaves(NSString* dir) {
            int n = 0;
            NSFileManager* fm = [NSFileManager defaultManager];
            for (NSString* name in [fm contentsOfDirectoryAtPath:dir error:nil]) {
              BOOL isDir = NO;
              if (SvrIsSaveName(name) && [fm fileExistsAtPath:[dir stringByAppendingPathComponent:name] isDirectory:&isDir] && !isDir) ++n;
            }
            return n;
          }

          // Copies a folder's contents (skipping .mount: the game's scratch folder). Every file lands whole or not at all
          // (name.part, then renamed). nil: done; else what went wrong.
          static NSString* SvrCopyTree(NSString* from, NSString* to) {
            NSFileManager* fm = [NSFileManager defaultManager];
            NSError* e = nil;
            if (![fm createDirectoryAtPath:to withIntermediateDirectories:YES attributes:nil error:&e]) return e.localizedDescription;
            for (NSString* n in [fm contentsOfDirectoryAtPath:from error:nil]) {
              if ([n isEqualToString:@".mount"]) continue;
              NSString* f = [from stringByAppendingPathComponent:n];
              NSString* t = [to stringByAppendingPathComponent:n];
              BOOL isDir = NO;
              [fm fileExistsAtPath:f isDirectory:&isDir];
              if (isDir) {
                NSString* err = SvrCopyTree(f, t);
                if (err) return err;
                continue;
              }
              NSString* part = [t stringByAppendingString:@".part"];
              [fm removeItemAtPath:part error:nil];
              if (![fm copyItemAtPath:f toPath:part error:&e]) return e.localizedDescription;
              [fm removeItemAtPath:t error:nil];
              if (![fm moveItemAtPath:part toPath:t error:&e]) return e.localizedDescription;
              NSDate* date = [fm attributesOfItemAtPath:f error:nil][NSFileModificationDate];
              if (date) [fm setAttributes:@{NSFileModificationDate : date} ofItemAtPath:t error:nil];
            }
            return nil;
          }

          // Moves a file (rename; copy + delete if that can't).
          static NSString* SvrMoveFile(NSString* from, NSString* to) {
            NSFileManager* fm = [NSFileManager defaultManager];
            NSError* e = nil;
            if (![fm createDirectoryAtPath:[to stringByDeletingLastPathComponent] withIntermediateDirectories:YES attributes:nil error:&e]) return e.localizedDescription;
            [fm removeItemAtPath:to error:nil];
            if ([fm moveItemAtPath:from toPath:to error:nil]) return nil;
            if (![fm copyItemAtPath:from toPath:to error:&e]) return e.localizedDescription;
            [fm removeItemAtPath:from error:nil];
            return nil;
          }

          // A copy of the whole Saves folder in SaveBackups/<date><suffix>. Returns the folder's name, or nil when there was
          // nothing to back up (error stays nil) or it failed (error says why).
          static NSString* SvrBackup(NSString* suffix, NSString** error) {
            NSFileManager* fm = [NSFileManager defaultManager];
            NSString* src = SvrNS(SvrSavesDir());
            BOOL isDir = NO;
            if (![fm fileExistsAtPath:src isDirectory:&isDir] || !isDir || SvrCountSaves(src) == 0) return nil;
            NSString* root = SvrNS(SvrBackupsDir());
            NSString* stamp = SvrStamp();
            NSString* name = [stamp stringByAppendingString:suffix];
            for (int i = 2; [fm fileExistsAtPath:[root stringByAppendingPathComponent:name]]; ++i) {
              name = [NSString stringWithFormat:@"%@%@ %d", stamp, suffix, i];
            }
            NSString* err = SvrCopyTree(src, [root stringByAppendingPathComponent:name]);
            if (err) {
              if (error) *error = err;
              return nil;
            }
            return name;
          }

          static UIStackView* SvrPair(UIView* a, UIView* b) {
            UIStackView* s = [[UIStackView alloc] initWithArrangedSubviews:@[ a, b ]];
            s.axis = UILayoutConstraintAxisHorizontal;
            s.spacing = 8.0;
            s.distribution = UIStackViewDistributionFillEqually;
            return s;
          }

          typedef NS_ENUM(NSInteger, SvrSavesPick) { SvrSavesPickFiles, SvrSavesPickSuperstars, SvrSavesPickExport };

          @interface SvrSavesPage : NSObject <UIDocumentPickerDelegate>
          @property(nonatomic, strong) UIScrollView* view;
          @property(nonatomic, weak) UIViewController* presenter;
          @property(nonatomic) BOOL busy;
          - (void)refresh;
          @end

          @implementation SvrSavesPage {
            UIStackView* _list;
            UILabel* _info;
            UILabel* _status;
            NSMutableArray<NSString*>* _names;
            NSMutableArray<SvrSwitch*>* _checks;
            NSMutableSet<NSString*>* _picked;
            NSArray<SvrGradButton*>* _actionButtons;
            SvrSavesPick _pick;
            unsigned long long _totalBytes;
          }

          - (instancetype)init {
            self = [super init];
            if (!self) return nil;
            UIStackView* stack = nil;
            _view = SvrScrollPage(&stack);
            _names = [NSMutableArray array];
            _checks = [NSMutableArray array];
            _picked = [NSMutableSet set];
            __weak SvrSavesPage* weakSelf = self;

            _info = SvrLabel(@"", 13.0, SVR_DIM, NO);
            _list = [[UIStackView alloc] init];
            _list.axis = UILayoutConstraintAxisVertical;
            _list.spacing = 8.0;
            SvrGradButton* all = SvrButton(@"Select all", NO, ^{
              [weakSelf selectAll:YES];
            });
            SvrGradButton* none = SvrButton(@"Select none", NO, ^{
              [weakSelf selectAll:NO];
            });
            [stack addArrangedSubview:SvrCard(@[
              SvrHeading(@"Save files"),
              SvrLabel(@"Your saves: the main save, Created Superstars, Paint Tool logos, replays and highlight reels. Back them up, move them to or from another device, or remove some. Switch on the ones to export or delete.",
                       13.0, SVR_DIM, NO),
              _info,
              _list,
              SvrPair(all, none),
            ])];

            SvrGradButton* backup = SvrButton(@"Back up all", YES, ^{
              [weakSelf backupAll];
            });
            SvrGradButton* restore = SvrButton(@"Restore backup…", NO, ^{
              [weakSelf restore];
            });
            SvrGradButton* exportBtn = SvrButton(@"Export selected…", NO, ^{
              [weakSelf exportSelected];
            });
            SvrGradButton* importBtn = SvrButton(@"Import…", NO, ^{
              [weakSelf pickFiles:SvrSavesPickFiles];
            });
            SvrGradButton* importCaw = SvrButton(@"Import Superstar…", NO, ^{
              [weakSelf pickFiles:SvrSavesPickSuperstars];
            });
            SvrGradButton* del = SvrButton(@"Delete selected", NO, ^{
              [weakSelf deleteSelected];
            });
            _actionButtons = @[ all, none, backup, restore, exportBtn, importBtn, importCaw, del ];
            _status = SvrLabel(@"", 13.0, SVR_DIM, NO);
            [stack addArrangedSubview:SvrCard(@[
              SvrPair(backup, restore),
              SvrPair(exportBtn, importBtn),
              SvrPair(importCaw, del),
              SvrLabel(@"Import Superstar: pick someone's Created Superstar files (.cas, from a PC or an Xbox 360 save). Add their SaveData.dat too to keep each Superstar's details. Each goes into a free slot, and its logos into free Paint Tool slots.",
                       12.0, SVR_DIM, NO),
              _status,
              SvrLabel(@"Saves: Documents/Saves  ·  backups: Documents/SaveBackups (both in the Files app)", 12.0, SVR_DIM, NO),
            ])];
            [self refresh];
            return self;
          }

          // ---- the list ----

          - (void)refresh {
            for (UIView* v in [_list.arrangedSubviews copy]) {
              [_list removeArrangedSubview:v];
              [v removeFromSuperview];
            }
            [_names removeAllObjects];
            [_checks removeAllObjects];
            _totalBytes = 0;
            NSFileManager* fm = [NSFileManager defaultManager];
            NSString* dir = SvrNS(SvrSavesDir());
            NSMutableArray<NSString*>* found = [NSMutableArray array];
            for (NSString* n in [fm contentsOfDirectoryAtPath:dir error:nil]) {
              BOOL isDir = NO;
              if (SvrIsSaveName(n) && [fm fileExistsAtPath:[dir stringByAppendingPathComponent:n] isDirectory:&isDir] && !isDir) [found addObject:n];
            }
            [found sortUsingComparator:^NSComparisonResult(NSString* a, NSString* b) {
              const BOOL am = [a caseInsensitiveCompare:@"SaveData.dat"] == NSOrderedSame, bm = [b caseInsensitiveCompare:@"SaveData.dat"] == NSOrderedSame;
              if (am != bm) return am ? NSOrderedAscending : NSOrderedDescending;  // (the main save first)
              return [a caseInsensitiveCompare:b];
            }];
            NSDateFormatter* when = [[NSDateFormatter alloc] init];
            when.dateStyle = NSDateFormatterShortStyle;
            when.timeStyle = NSDateFormatterShortStyle;
            NSMutableSet<NSString*>* still = [NSMutableSet set];
            __weak SvrSavesPage* weakSelf = self;
            for (NSString* name in found) {
              NSDictionary* attrs = [fm attributesOfItemAtPath:[dir stringByAppendingPathComponent:name] error:nil];
              const unsigned long long size = [attrs fileSize];
              _totalBytes += size;
              NSString* shown = SvrSaveDisplayName(dir, name);
              NSString* hint = [NSString stringWithFormat:@"%@  ·  %@  ·  %@", SvrSaveKind(name), SvrHuman(size),
                                                          attrs.fileModificationDate ? [when stringFromDate:attrs.fileModificationDate] : @""];
              if (shown && ![shown isEqualToString:name]) hint = [hint stringByAppendingFormat:@"  ·  %@", name];
              if ([_picked containsObject:name]) [still addObject:name];
              SvrSwitch* tick = SvrToggle([_picked containsObject:name], ^(BOOL on) {
                SvrSavesPage* s = weakSelf;
                if (!s) return;
                if (on) [s->_picked addObject:name];
                else [s->_picked removeObject:name];
                [s updateInfo];
              });
              [_list addArrangedSubview:SvrRowBox(shown ? shown : name, hint, @[ tick ])];
              [_names addObject:name];
              [_checks addObject:tick];
            }
            _picked = still;  // (what was ticked and is still there)
            if (_names.count == 0) {
              [_list addArrangedSubview:SvrLabel(@"No saves yet: the game makes them when it saves.", 15.0, SVR_DIM, NO)];
            }
            [self updateInfo];
          }

          - (void)updateInfo {
            if (_names.count == 0) {
              _info.text = @"";
              return;
            }
            _info.text = [NSString stringWithFormat:@"%lu save file%@  ·  %@  ·  %lu ticked", static_cast<unsigned long>(_names.count),
                                                    _names.count == 1 ? @"" : @"s", SvrHuman(_totalBytes),
                                                    static_cast<unsigned long>(_picked.count)];
          }

          - (void)selectAll:(BOOL)all {
            if (self.busy) return;
            [_picked removeAllObjects];
            for (NSUInteger i = 0; i < _names.count; ++i) {
              _checks[i].on = all;
              if (all) [_picked addObject:_names[i]];
            }
            [self updateInfo];
          }

          - (NSArray<NSString*>*)selectedNames {
            NSMutableArray<NSString*>* sel = [NSMutableArray array];
            for (NSString* n in _names) {
              if ([_picked containsObject:n]) [sel addObject:n];
            }
            return sel;
          }

          // ---- running things ----

          - (void)say:(NSString*)text {
            _status.text = text;
          }

          // Runs `work` away from the screen's thread, with the buttons off; its result is the status line.
          - (void)background:(NSString* (^)(void))work starting:(NSString*)starting {
            self.busy = YES;
            for (SvrGradButton* b in _actionButtons) b.enabled = NO;
            [self say:starting];
            __weak SvrSavesPage* weakSelf = self;
            dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
              NSString* result = work();
              dispatch_async(dispatch_get_main_queue(), ^{
                SvrSavesPage* s = weakSelf;
                if (!s) return;
                s.busy = NO;
                for (SvrGradButton* b in s->_actionButtons) b.enabled = YES;
                [s say:result];
                [s refresh];
              });
            });
          }

          - (void)confirm:(NSString*)title message:(NSString*)message verb:(NSString*)verb handler:(void (^)(void))go {
            UIViewController* host = self.presenter;
            if (!host) return;
            UIAlertController* alert = [UIAlertController alertControllerWithTitle:title message:message preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
            [alert addAction:[UIAlertAction actionWithTitle:verb style:UIAlertActionStyleDestructive handler:^(UIAlertAction* action) {
              go();
            }]];
            [host presentViewController:alert animated:YES completion:nil];
          }

          // ---- back up / restore ----

          - (void)backupAll {
            if (self.busy) return;
            [self background:^NSString* {
              NSString* err = nil;
              NSString* dest = SvrBackup(@"", &err);
              if (err) return [NSString stringWithFormat:@"The backup failed: %@", err];
              return dest ? [NSString stringWithFormat:@"Backed up to SaveBackups/%@.", dest] : @"Nothing was backed up: there are no saves yet.";
            } starting:@"Backing up…"];
          }

          - (void)restore {
            if (self.busy) return;
            UIViewController* host = self.presenter;
            if (!host) return;
            NSFileManager* fm = [NSFileManager defaultManager];
            NSString* root = SvrNS(SvrBackupsDir());
            NSMutableArray<NSString*>* dirs = [NSMutableArray array];
            for (NSString* n in [fm contentsOfDirectoryAtPath:root error:nil]) {
              BOOL isDir = NO;
              if (![n hasPrefix:@"."] && [fm fileExistsAtPath:[root stringByAppendingPathComponent:n] isDirectory:&isDir] && isDir) [dirs addObject:n];
            }
            if (dirs.count == 0) {
              [self say:@"There are no backups yet (Back up all makes one)."];
              return;
            }
            [dirs sortUsingComparator:^NSComparisonResult(NSString* a, NSString* b) {
              return [b compare:a];  // (newest first)
            }];
            UIAlertController* sheet = [UIAlertController alertControllerWithTitle:@"Restore a backup" message:nil preferredStyle:UIAlertControllerStyleActionSheet];
            __weak SvrSavesPage* weakSelf = self;
            for (NSString* name in dirs) {
              const int n = SvrCountSaves([root stringByAppendingPathComponent:name]);
              NSString* title = [NSString stringWithFormat:@"%@  (%d saves)", name, n];
              [sheet addAction:[UIAlertAction actionWithTitle:title style:UIAlertActionStyleDefault handler:^(UIAlertAction* action) {
                [weakSelf confirm:@"Restore"
                          message:[NSString stringWithFormat:@"Replace your saves with the %d in %@? Your current saves are backed up first.", n, name]
                             verb:@"Restore"
                          handler:^{
                  [weakSelf restoreFrom:name];
                }];
              }]];
            }
            [sheet addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
            sheet.popoverPresentationController.sourceView = host.view;
            sheet.popoverPresentationController.sourceRect = CGRectMake(CGRectGetMidX(host.view.bounds), CGRectGetMidY(host.view.bounds), 1.0, 1.0);
            sheet.popoverPresentationController.permittedArrowDirections = 0;
            [host presentViewController:sheet animated:YES completion:nil];
          }

          - (void)restoreFrom:(NSString*)name {
            if (self.busy) return;
            [self background:^NSString* {
              NSString* err = nil;
              SvrBackup(@" (before restore)", &err);
              if (err) return [NSString stringWithFormat:@"Restoring failed: %@", err];
              NSFileManager* fm = [NSFileManager defaultManager];
              NSString* saves = SvrNS(SvrSavesDir());
              for (NSString* n in [fm contentsOfDirectoryAtPath:saves error:nil]) {
                if (![n isEqualToString:@".mount"]) [fm removeItemAtPath:[saves stringByAppendingPathComponent:n] error:nil];
              }
              err = SvrCopyTree([SvrNS(SvrBackupsDir()) stringByAppendingPathComponent:name], saves);
              if (err) return [NSString stringWithFormat:@"Restoring failed: %@", err];
              return [NSString stringWithFormat:@"Restored %@ (your previous saves are in SaveBackups).", name];
            } starting:@"Restoring…"];
          }

          // ---- export / import ----

          - (void)exportSelected {
            if (self.busy) return;
            NSArray<NSString*>* sel = [self selectedNames];
            if (sel.count == 0) {
              [self say:@"Tick the saves to export first."];
              return;
            }
            UIViewController* host = self.presenter;
            if (!host) return;
            NSString* dir = SvrNS(SvrSavesDir());
            NSMutableArray<NSURL*>* urls = [NSMutableArray array];
            for (NSString* n in sel) [urls addObject:[NSURL fileURLWithPath:[dir stringByAppendingPathComponent:n]]];
            _pick = SvrSavesPickExport;
            UIDocumentPickerViewController* picker = [[UIDocumentPickerViewController alloc] initForExportingURLs:urls asCopy:YES];
            picker.delegate = self;
            [host presentViewController:picker animated:YES completion:nil];
          }

          - (void)pickFiles:(SvrSavesPick)kind {
            if (self.busy) return;
            UIViewController* host = self.presenter;
            if (!host) return;
            _pick = kind;
            UIDocumentPickerViewController* picker = [[UIDocumentPickerViewController alloc] initWithDocumentTypes:@[ @"public.data" ]
                                                                                                              inMode:UIDocumentPickerModeOpen];
            picker.allowsMultipleSelection = YES;
            picker.delegate = self;
            [host presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController*)controller didPickDocumentsAtURLs:(NSArray<NSURL*>*)urls {
            if (urls.count == 0) return;
            switch (_pick) {
              case SvrSavesPickExport:
                [self say:[NSString stringWithFormat:@"Exported %lu save%@.", static_cast<unsigned long>(urls.count), urls.count == 1 ? @"" : @"s"]];
                break;
              case SvrSavesPickSuperstars:
                [self importSuperstars:urls];
                break;
              default:
                [self askImportFiles:urls];
                break;
            }
          }

          - (void)askImportFiles:(NSArray<NSURL*>*)urls {
            NSMutableArray<NSURL*>* ok = [NSMutableArray array];
            NSFileManager* fm = [NSFileManager defaultManager];
            NSString* saves = SvrNS(SvrSavesDir());
            int replacing = 0;
            for (NSURL* url in urls) {
              NSString* name = url.lastPathComponent;
              if (!SvrIsSaveName(name)) continue;
              [ok addObject:url];
              if ([fm fileExistsAtPath:[saves stringByAppendingPathComponent:name]]) ++replacing;
            }
            if (ok.count == 0) {
              [self say:@"None of the picked files can be a save."];
              return;
            }
            __weak SvrSavesPage* weakSelf = self;
            void (^go)(void) = ^{
              [weakSelf importFiles:ok backupFirst:replacing > 0];
            };
            if (replacing > 0) {
              [self confirm:@"Replace saves?"
                    message:[NSString stringWithFormat:@"%d of the %lu files replace saves you have. Replace them? Your current saves are backed up first.",
                                                       replacing, static_cast<unsigned long>(ok.count)]
                       verb:@"Replace"
                    handler:go];
            } else {
              go();
            }
          }

          - (void)importFiles:(NSArray<NSURL*>*)urls backupFirst:(BOOL)backupFirst {
            [self background:^NSString* {
              NSFileManager* fm = [NSFileManager defaultManager];
              NSString* saves = SvrNS(SvrSavesDir());
              if (backupFirst) {
                NSString* err = nil;
                SvrBackup(@" (before import)", &err);
                if (err) return [NSString stringWithFormat:@"Importing failed: %@", err];
              }
              [fm createDirectoryAtPath:saves withIntermediateDirectories:YES attributes:nil error:nil];
              int n = 0;
              for (NSURL* url in urls) {
                const BOOL scoped = [url startAccessingSecurityScopedResource];
                NSString* to = [saves stringByAppendingPathComponent:url.lastPathComponent];
                NSString* part = [to stringByAppendingString:@".part"];
                [fm removeItemAtPath:part error:nil];
                NSError* e = nil;
                BOOL done = [fm copyItemAtPath:url.path toPath:part error:&e];
                if (done) {
                  [fm removeItemAtPath:to error:nil];
                  done = [fm moveItemAtPath:part toPath:to error:&e];
                }
                if (scoped) [url stopAccessingSecurityScopedResource];
                if (!done) return [NSString stringWithFormat:@"Importing failed: %@", e.localizedDescription];
                ++n;
              }
              return [NSString stringWithFormat:@"Imported %d file%@.", n, n == 1 ? @"" : @"s"];
            } starting:@"Importing…"];
          }

          // Someone else's Created Superstars: the .cas files, with their main save and extra logo files if picked too.
          - (void)importSuperstars:(NSArray<NSURL*>*)urls {
            [self background:^NSString* {
              std::vector<svrsave::Picked> picked;
              for (NSURL* url in urls) {
                const BOOL scoped = [url startAccessingSecurityScopedResource];
                NSError* e = nil;
                NSData* data = [NSData dataWithContentsOfURL:url options:0 error:&e];
                if (scoped) [url stopAccessingSecurityScopedResource];
                if (!data) continue;
                if (data.length > 64u * 1024u * 1024u) return @"Importing failed: a picked file is too big";
                svrsave::Picked p;
                p.name = std::string(url.lastPathComponent.UTF8String ? url.lastPathComponent.UTF8String : "");
                const uint8_t* bytes = static_cast<const uint8_t*>(data.bytes);
                p.data.assign(bytes, bytes + data.length);
                picked.push_back(std::move(p));
              }
              NSString* err = nil;
              SvrBackup(@" (before Superstar import)", &err);
              if (err) return [NSString stringWithFormat:@"Importing failed: %@", err];
              try {
                const std::string summary = svrsave::Run(SvrSavesDir(), picked);
                return [NSString stringWithFormat:@"%@ (Your saves were backed up first.)", SvrNS(summary)];
              } catch (const std::exception& ex) {
                return [NSString stringWithFormat:@"Importing failed: %@", SvrNS(ex.what())];
              }
            } starting:@"Importing…"];
          }

          // ---- delete ----

          - (void)deleteSelected {
            if (self.busy) return;
            NSArray<NSString*>* sel = [self selectedNames];
            if (sel.count == 0) {
              [self say:@"Tick the saves to delete first."];
              return;
            }
            BOOL main = NO;
            for (NSString* n in sel) main |= [n caseInsensitiveCompare:@"SaveData.dat"] == NSOrderedSame;
            NSString* message = [NSString stringWithFormat:@"Delete %lu save%@? They're moved to SaveBackups, so you can bring them back with Restore.%@",
                                                           static_cast<unsigned long>(sel.count), sel.count == 1 ? @"" : @"s",
                                                           main ? @"\n\nThe main save (SaveData.dat) is included: the game starts over." : @""];
            __weak SvrSavesPage* weakSelf = self;
            [self confirm:@"Delete saves?" message:message verb:@"Delete" handler:^{
              SvrSavesPage* s = weakSelf;
              if (!s) return;
              [s background:^NSString* {
                NSString* saves = SvrNS(SvrSavesDir());
                NSString* destName = [SvrStamp() stringByAppendingString:@" (deleted)"];
                NSString* dest = [SvrNS(SvrBackupsDir()) stringByAppendingPathComponent:destName];
                for (NSString* n in sel) {
                  NSString* err = SvrMoveFile([saves stringByAppendingPathComponent:n], [dest stringByAppendingPathComponent:n]);
                  if (err) return [NSString stringWithFormat:@"Deleting failed: %@", err];
                  for (NSString* ext in @[ @".header", @".file", @".png" ]) {
                    NSString* side = [[saves stringByAppendingPathComponent:@".info"] stringByAppendingPathComponent:[n stringByAppendingString:ext]];
                    if ([[NSFileManager defaultManager] fileExistsAtPath:side]) {
                      SvrMoveFile(side, [[dest stringByAppendingPathComponent:@".info"] stringByAppendingPathComponent:side.lastPathComponent]);
                    }
                  }
                }
                return [NSString stringWithFormat:@"Deleted %lu (kept in SaveBackups/%@).", static_cast<unsigned long>(sel.count), destName];
              } starting:@"Deleting…"];
            }];
          }
          @end

          // ---- the arena backdrop: dark navy, hazy smoke, a curved rig of stage lights with soft beams, bokeh, vignette ----

          struct SvrStop {
            CGFloat loc, r, g, b, a;  // colours 0-255, alpha 0-1
          };

          static CGGradientRef SvrMakeGradient(const std::vector<SvrStop>& stops) {
            std::vector<CGFloat> comps, locs;
            for (const SvrStop& s : stops) {
              locs.push_back(s.loc);
              comps.push_back(s.r / 255.0);
              comps.push_back(s.g / 255.0);
              comps.push_back(s.b / 255.0);
              comps.push_back(s.a);
            }
            CGColorSpaceRef rgb = CGColorSpaceCreateDeviceRGB();
            CGGradientRef g = CGGradientCreateWithColorComponents(rgb, comps.data(), locs.data(), stops.size());
            CGColorSpaceRelease(rgb);
            return g;  // (the caller releases it)
          }

          // A soft radial blob: the stops run from the centre out to radius r, squeezed by (sx, sy).
          static void SvrBlob(CGContextRef c, CGFloat x, CGFloat y, CGFloat r, const std::vector<SvrStop>& stops, CGFloat sx,
                              CGFloat sy) {
            CGGradientRef g = SvrMakeGradient(stops);
            CGContextSaveGState(c);
            CGContextTranslateCTM(c, x, y);
            CGContextScaleCTM(c, sx, sy);
            CGContextClipToRect(c, CGRectMake(-r, -r, r * 2.0, r * 2.0));
            CGContextDrawRadialGradient(c, g, CGPointZero, 0.0, CGPointZero, r, kCGGradientDrawsAfterEndLocation);
            CGContextRestoreGState(c);
            CGGradientRelease(g);
          }

          @interface SvrBackdropView : UIView
          @end

          @implementation SvrBackdropView

          - (instancetype)initWithFrame:(CGRect)frame {
            self = [super initWithFrame:frame];
            if (!self) return nil;
            self.contentMode = UIViewContentModeRedraw;
            self.backgroundColor = [UIColor blackColor];
            self.userInteractionEnabled = NO;
            return self;
          }

          - (void)drawRect:(CGRect)rect {
            CGContextRef c = UIGraphicsGetCurrentContext();
            const CGFloat w = self.bounds.size.width, h = self.bounds.size.height;
            long long seed = 11;
            auto rnd = [&seed]() -> CGFloat {
              seed = (seed * 16807) % 2147483647;
              return static_cast<CGFloat>(seed) / 2147483647.0;
            };

            // 1. base: dark navy, steel blue lifting behind the middle
            {
              CGGradientRef g = SvrMakeGradient({{0.0, 6, 26, 47, 1.0}, {0.55, 10, 38, 64, 1.0}, {1.0, 3, 12, 19, 1.0}});
              CGContextDrawLinearGradient(c, g, CGPointMake(0.0, 0.0), CGPointMake(0.0, h), 0);
              CGGradientRelease(g);
            }
            SvrBlob(c, w * 0.5, h * 0.46, w * 0.66, {{0.0, 58, 128, 168, 0.62}, {0.5, 30, 82, 120, 0.34}, {1.0, 10, 32, 56, 0.0}}, 1.0, 0.66);

            CGContextSaveGState(c);
            CGContextSetBlendMode(c, kCGBlendModePlusLighter);

            // 2. smoke: big soft teal and blue clouds in the upper two thirds
            for (int i = 0; i < 16; ++i) {
              const CGFloat x = rnd() * w;
              const CGFloat y = h * (0.08 + rnd() * 0.6);
              const CGFloat r = w * (0.10 + rnd() * 0.16);
              const bool teal = rnd() < 0.5;
              const CGFloat a = 0.07 + rnd() * 0.09;
              const CGFloat sy = 0.62 + rnd() * 0.3;
              if (teal) {
                SvrBlob(c, x, y, r, {{0.0, 70, 175, 205, a}, {1.0, 40, 100, 170, 0.0}}, 1.0, sy);
              } else {
                SvrBlob(c, x, y, r, {{0.0, 55, 115, 205, a}, {1.0, 40, 100, 170, 0.0}}, 1.0, sy);
              }
            }

            // 3. the rig: a glowing elliptical truss seen from below
            const CGFloat cx = w * 0.5, cy = h * 0.34, rx = w * 0.44, ry = h * 0.2;
            const CGFloat a0 = M_PI * 1.04, a1 = M_PI * 1.96;
            {
              const CGFloat widths[5] = {44.0, 30.0, 18.0, 9.0, 3.5};
              const CGFloat alphas[5] = {0.025, 0.04, 0.06, 0.10, 0.17};
              for (int i = 0; i < 5; ++i) {
                CGContextBeginPath(c);
                for (int k = 0; k <= 64; ++k) {
                  const CGFloat a = a0 + (a1 - a0) * k / 64.0;
                  const CGPoint p = CGPointMake(cx + std::cos(a) * rx, cy + std::sin(a) * ry);
                  if (k == 0) {
                    CGContextMoveToPoint(c, p.x, p.y);
                  } else {
                    CGContextAddLineToPoint(c, p.x, p.y);
                  }
                }
                CGContextSetLineWidth(c, widths[i]);
                CGContextSetLineCap(c, kCGLineCapRound);
                CGContextSetLineJoin(c, kCGLineJoinRound);
                CGContextSetStrokeColorWithColor(c, SvrHex(0x69d2e8, alphas[i]).CGColor);
                CGContextStrokePath(c);
              }
            }

            // 4. lights along the rig, each with a soft wide beam toward the middle of the screen
            const CGFloat ts[8] = {0.04, 0.17, 0.30, 0.43, 0.57, 0.70, 0.83, 0.96};
            const CGFloat ks[4] = {0.45, 0.8, 1.25, 1.8};
            for (int i = 0; i < 8; ++i) {
              const CGFloat a = a0 + (a1 - a0) * ts[i];
              const CGFloat x = cx + std::cos(a) * rx, y = cy + std::sin(a) * ry;
              const CGFloat bx = x + (cx - x) * 0.55, by = y + h * 0.78;
              // feathered: four stacked beams of growing width, each very faint, so the edges fade out
              for (int j = 0; j < 4; ++j) {
                const CGFloat k = ks[j];
                CGGradientRef bm = SvrMakeGradient({{0.0, 140, 210, 250, 0.050}, {0.7, 90, 170, 230, 0.016}, {1.0, 60, 140, 210, 0.0}});
                CGContextSaveGState(c);
                CGContextBeginPath(c);
                CGContextMoveToPoint(c, x - 6.0 * k, y);
                CGContextAddLineToPoint(c, x + 6.0 * k, y);
                CGContextAddLineToPoint(c, bx + w * 0.055 * k, by);
                CGContextAddLineToPoint(c, bx - w * 0.055 * k, by);
                CGContextClosePath(c);
                CGContextClip(c);
                CGContextDrawLinearGradient(c, bm, CGPointMake(x, y), CGPointMake(bx, by),
                                            kCGGradientDrawsBeforeStartLocation | kCGGradientDrawsAfterEndLocation);
                CGContextRestoreGState(c);
                CGGradientRelease(bm);
              }
            }
            for (int i = 0; i < 8; ++i) {
              const CGFloat a = a0 + (a1 - a0) * ts[i];
              const CGFloat x = cx + std::cos(a) * rx, y = cy + std::sin(a) * ry;
              SvrBlob(c, x, y, w * 0.10, {{0.0, 110, 205, 235, 0.30}, {1.0, 40, 120, 210, 0.0}}, 1.0, 0.85);
              SvrBlob(c, x, y, w * 0.026, {{0.0, 240, 252, 255, 0.95}, {0.3, 180, 232, 255, 0.55}, {1.0, 80, 170, 240, 0.0}}, 1.0, 1.0);
            }

            // 5. low blue glow where the crowd is
            SvrBlob(c, w * 0.5, h * 0.86, w * 0.56, {{0.0, 36, 104, 164, 0.40}, {1.0, 10, 40, 80, 0.0}}, 1.0, 0.38);

            // 6. bokeh (soft, no rim) and tiny crowd sparkle
            for (int i = 0; i < 40; ++i) {
              const CGFloat x = rnd() * w;
              const CGFloat y = rnd() * h * 0.78;
              const CGFloat r = 3.0 + rnd() * 9.0;
              const CGFloat a = 0.04 + rnd() * 0.08;
              SvrBlob(c, x, y, r, {{0.0, 160, 215, 255, a}, {1.0, 110, 180, 240, 0.0}}, 1.0, 1.0);
            }
            for (int i = 0; i < 150; ++i) {
              const CGFloat x = rnd() * w;
              const CGFloat y = h * (0.36 + rnd() * 0.6);
              const CGFloat r = 0.8 + rnd() * 1.1;
              const CGFloat a = 0.10 + rnd() * 0.22;
              SvrBlob(c, x, y, r * 2.0, {{0.0, 200, 235, 255, a}, {1.0, 120, 190, 250, 0.0}}, 1.0, 1.0);
            }
            CGContextRestoreGState(c);

            // 7. vignette, and the very bottom close to black
            SvrBlob(c, w * 0.5, h * 0.5, w * 0.78, {{0.0, 0, 6, 14, 0.0}, {0.42, 0, 6, 14, 0.0}, {1.0, 0, 6, 14, 0.80}}, 1.0, 0.74);
            {
              CGGradientRef g = SvrMakeGradient({{0.0, 1, 8, 14, 0.0}, {1.0, 1, 8, 14, 0.62}});
              CGContextSaveGState(c);
              CGContextClipToRect(c, CGRectMake(0.0, h * 0.72, w, h * 0.28));
              CGContextDrawLinearGradient(c, g, CGPointMake(0.0, h * 0.72), CGPointMake(0.0, h), 0);
              CGContextRestoreGState(c);
              CGGradientRelease(g);
            }
          }

          @end

          // The page area: its top and bottom 7 points fade out, so scrolled content melts away at the edges.
          @interface SvrFadeView : UIView
          @end

          @implementation SvrFadeView {
            CAGradientLayer* _mask;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
            self = [super initWithFrame:frame];
            if (!self) return nil;
            _mask = [CAGradientLayer layer];
            _mask.colors = @[
              (id)[UIColor clearColor].CGColor, (id)[UIColor blackColor].CGColor, (id)[UIColor blackColor].CGColor,
              (id)[UIColor clearColor].CGColor
            ];
            self.layer.mask = _mask;
            return self;
          }

          - (void)layoutSubviews {
            [super layoutSubviews];
            _mask.frame = self.bounds;
            const CGFloat h = self.bounds.size.height;
            if (h > 20.0) {
              const CGFloat e = 7.0 / h;
              _mask.locations = @[ @0.0, @(e), @(1.0 - e), @1.0 ];
            }
          }

          @end

          // ---- the Paint Tool tab: the Paint Tool logos (10 pages of 20 slots) as pictures. See them, bring your own pictures in,
          // save one out as a PNG, delete one. The same files the Created Superstar import fills (Saves/00PaintTool.pt for page 1,
          // Saves/.paint for pages 2-10), written the way the game writes them. ----

          static CGBitmapInfo SvrRgbaInfo() {
            return static_cast<CGBitmapInfo>(static_cast<uint32_t>(kCGImageAlphaPremultipliedLast) | static_cast<uint32_t>(kCGBitmapByteOrder32Big));
          }

          // A logo's 256 x 256 picture (palette: 256 x A R G B bytes, pixels: one index each) as an image.
          static UIImage* SvrLogoImage(const uint8_t* palette, const uint8_t* pixels) {
            const size_t w = 256;
            uint8_t pre[256][4];
            for (int i = 0; i < 256; ++i) {
              const unsigned a = palette[i * 4], r = palette[i * 4 + 1], g = palette[i * 4 + 2], b = palette[i * 4 + 3];
              pre[i][0] = static_cast<uint8_t>((r * a + 127) / 255);
              pre[i][1] = static_cast<uint8_t>((g * a + 127) / 255);
              pre[i][2] = static_cast<uint8_t>((b * a + 127) / 255);
              pre[i][3] = static_cast<uint8_t>(a);
            }
            std::vector<uint8_t> rgba(w * w * 4);
            for (size_t p = 0; p < w * w; ++p) std::memcpy(&rgba[p * 4], pre[pixels[p]], 4);
            CGColorSpaceRef space = CGColorSpaceCreateDeviceRGB();
            CGContextRef ctx = CGBitmapContextCreate(rgba.data(), w, w, 8, w * 4, space, SvrRgbaInfo());
            CGColorSpaceRelease(space);
            if (!ctx) return nil;
            CGImageRef cg = CGBitmapContextCreateImage(ctx);
            CGContextRelease(ctx);
            if (!cg) return nil;
            UIImage* image = [UIImage imageWithCGImage:cg];
            CGImageRelease(cg);
            return image;
          }

          // A picture as the Paint Tool's canvas: 256 x 256 (fitted, not stretched; the margins stay clear), straight ARGB.
          static BOOL SvrImageToArgb(UIImage* image, std::vector<uint32_t>* out) {
            if (!image || image.size.width < 1.0 || image.size.height < 1.0) return NO;
            UIGraphicsImageRendererFormat* format = [UIGraphicsImageRendererFormat defaultFormat];
            format.scale = 1.0;
            format.opaque = NO;
            UIGraphicsImageRenderer* renderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(256.0, 256.0) format:format];
            const CGFloat fit = MIN(256.0 / image.size.width, 256.0 / image.size.height);
            const CGSize size = CGSizeMake(image.size.width * fit, image.size.height * fit);
            UIImage* fitted = [renderer imageWithActions:^(UIGraphicsImageRendererContext* context) {
              [image drawInRect:CGRectMake((256.0 - size.width) * 0.5, (256.0 - size.height) * 0.5, size.width, size.height)];
            }];
            CGImageRef cg = fitted.CGImage;
            if (!cg) return NO;
            const size_t w = 256;
            std::vector<uint8_t> px(w * w * 4, 0);
            CGColorSpaceRef space = CGColorSpaceCreateDeviceRGB();
            CGContextRef ctx = CGBitmapContextCreate(px.data(), w, w, 8, w * 4, space, SvrRgbaInfo());
            CGColorSpaceRelease(space);
            if (!ctx) return NO;
            CGContextDrawImage(ctx, CGRectMake(0.0, 0.0, static_cast<CGFloat>(w), static_cast<CGFloat>(w)), cg);
            CGContextRelease(ctx);
            out->assign(w * w, 0u);
            for (size_t i = 0; i < w * w; ++i) {
              const unsigned r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2], a = px[i * 4 + 3];
              if (a < 8) continue;  // clear
              const unsigned ur = std::min(255u, (r * 255 + a / 2) / a), ug = std::min(255u, (g * 255 + a / 2) / a),
                             ub = std::min(255u, (b * 255 + a / 2) / a);
              (*out)[i] = (static_cast<uint32_t>(a) << 24) | (ur << 16) | (ug << 8) | ub;
            }
            return YES;
          }

          // Turns a straight-ARGB 256 x 256 picture into the Paint Tool's 256-colour palette (256 x A R G B bytes) and one
          // palette index per pixel: median cut over the picture's own colours (alpha too), so clear stays clear.
          static void SvrQuantize(const std::vector<uint32_t>& argb, uint8_t* palette, uint8_t* pixels) {
            struct Col {
              uint32_t c;
              uint32_t n;
            };
            struct Box {
              size_t lo, hi;
            };
            std::vector<uint32_t> sorted(argb);
            std::sort(sorted.begin(), sorted.end());
            std::vector<Col> cols;
            for (size_t i = 0; i < sorted.size();) {
              size_t j = i;
              while (j < sorted.size() && sorted[j] == sorted[i]) ++j;
              cols.push_back({sorted[i], static_cast<uint32_t>(j - i)});
              i = j;
            }
            auto chan = [](uint32_t c, int ch) -> uint32_t { return (c >> (24 - 8 * ch)) & 0xFFu; };  // 0 A, 1 R, 2 G, 3 B
            std::vector<Box> boxes;
            boxes.push_back({0, cols.size()});
            while (boxes.size() < 256) {
              int best = -1, bestChan = 0;
              uint32_t bestSpread = 0;
              for (size_t b = 0; b < boxes.size(); ++b) {
                if (boxes[b].hi - boxes[b].lo < 2) continue;
                for (int ch = 0; ch < 4; ++ch) {
                  uint32_t lo = 255, hi = 0;
                  for (size_t i = boxes[b].lo; i < boxes[b].hi; ++i) {
                    const uint32_t v = chan(cols[i].c, ch);
                    lo = std::min(lo, v);
                    hi = std::max(hi, v);
                  }
                  if (hi - lo > bestSpread) {
                    bestSpread = hi - lo;
                    best = static_cast<int>(b);
                    bestChan = ch;
                  }
                }
              }
              if (best < 0) break;  // every box holds one colour (or all alike)
              Box box = boxes[static_cast<size_t>(best)];
              std::sort(cols.begin() + static_cast<ptrdiff_t>(box.lo), cols.begin() + static_cast<ptrdiff_t>(box.hi),
                        [&](const Col& a, const Col& b) { return chan(a.c, bestChan) < chan(b.c, bestChan); });
              uint64_t total = 0;
              for (size_t i = box.lo; i < box.hi; ++i) total += cols[i].n;
              uint64_t running = 0;
              size_t mid = box.lo + 1;
              for (size_t i = box.lo; i + 1 < box.hi; ++i) {
                running += cols[i].n;
                mid = i + 1;
                if (running * 2 >= total) break;
              }
              boxes[static_cast<size_t>(best)] = {box.lo, mid};
              boxes.push_back({mid, box.hi});
            }
            std::memset(palette, 0, 1024);
            std::vector<std::pair<uint32_t, uint8_t>> lookup;
            lookup.reserve(cols.size());
            for (size_t b = 0; b < boxes.size(); ++b) {
              uint64_t sum[4] = {0, 0, 0, 0}, total = 0;
              for (size_t i = boxes[b].lo; i < boxes[b].hi; ++i) {
                for (int ch = 0; ch < 4; ++ch) sum[ch] += static_cast<uint64_t>(chan(cols[i].c, ch)) * cols[i].n;
                total += cols[i].n;
                lookup.push_back({cols[i].c, static_cast<uint8_t>(b)});
              }
              for (int ch = 0; ch < 4; ++ch) palette[b * 4 + static_cast<size_t>(ch)] = static_cast<uint8_t>(total ? (sum[ch] + total / 2) / total : 0);
            }
            std::sort(lookup.begin(), lookup.end());
            for (size_t i = 0; i < argb.size(); ++i) {
              auto it = std::lower_bound(lookup.begin(), lookup.end(), std::make_pair(argb[i], static_cast<uint8_t>(0)));
              pixels[i] = it != lookup.end() && it->first == argb[i] ? it->second : 0;
            }
          }

          @interface SvrPaintPage : NSObject <UIImagePickerControllerDelegate, UINavigationControllerDelegate, UIDocumentPickerDelegate>
          @property(nonatomic, strong) UIScrollView* view;
          @property(nonatomic, weak) UIViewController* presenter;
          - (void)refresh;
          @end

          @implementation SvrPaintPage {
            UILabel* _info;
            UILabel* _slotInfo;
            UILabel* _status;
            SvrSegmented* _pageControl;
            NSMutableArray<UIImageView*>* _thumbs;
            NSMutableArray<UIView*>* _boxes;
            svrsave::Bytes _bytes;
            BOOL _loaded;
            int _page;
            int _selected;
            int _target;
          }

          - (instancetype)init {
            self = [super init];
            if (!self) return nil;
            UIStackView* stack = nil;
            _view = SvrScrollPage(&stack);
            _page = 1;
            _selected = -1;
            _target = -1;
            _thumbs = [NSMutableArray array];
            _boxes = [NSMutableArray array];
            __weak SvrPaintPage* weakSelf = self;

            NSMutableArray<NSString*>* labels = [NSMutableArray array];
            for (int i = 1; i <= svrsave::kPages; ++i) [labels addObject:[NSString stringWithFormat:@"%d", i]];
            _pageControl = SvrSegment(labels, 0, ^(NSInteger i) {
              [weakSelf showPageNumber:static_cast<int>(i) + 1];
            });

            UIStackView* grid = [[UIStackView alloc] init];
            grid.axis = UILayoutConstraintAxisVertical;
            grid.spacing = 8.0;
            for (int row = 0; row < 4; ++row) {
              UIStackView* line = [[UIStackView alloc] init];
              line.axis = UILayoutConstraintAxisHorizontal;
              line.spacing = 8.0;
              line.distribution = UIStackViewDistributionFillEqually;
              for (int col = 0; col < 5; ++col) {
                const int k = row * 5 + col;
                UIView* box = [[UIView alloc] init];
                box.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.35];
                box.layer.borderWidth = 2.0;
                box.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.12].CGColor;
                [box.heightAnchor constraintEqualToAnchor:box.widthAnchor].active = YES;
                UIImageView* picture = [[UIImageView alloc] init];
                picture.contentMode = UIViewContentModeScaleAspectFit;
                picture.translatesAutoresizingMaskIntoConstraints = NO;
                [box addSubview:picture];
                UILabel* number = SvrLabel([NSString stringWithFormat:@"%d", k + 1], 10.0, SVR_DIM, NO);
                number.translatesAutoresizingMaskIntoConstraints = NO;
                [box addSubview:number];
                UIButton* tap = [UIButton buttonWithType:UIButtonTypeCustom];
                tap.translatesAutoresizingMaskIntoConstraints = NO;
                [tap addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
                  [weakSelf selectSlot:k];
                }] forControlEvents:UIControlEventTouchUpInside];
                [box addSubview:tap];
                [NSLayoutConstraint activateConstraints:@[
                  [picture.topAnchor constraintEqualToAnchor:box.topAnchor constant:3.0],
                  [picture.bottomAnchor constraintEqualToAnchor:box.bottomAnchor constant:-3.0],
                  [picture.leadingAnchor constraintEqualToAnchor:box.leadingAnchor constant:3.0],
                  [picture.trailingAnchor constraintEqualToAnchor:box.trailingAnchor constant:-3.0],
                  [number.leadingAnchor constraintEqualToAnchor:box.leadingAnchor constant:5.0],
                  [number.bottomAnchor constraintEqualToAnchor:box.bottomAnchor constant:-3.0],
                  [tap.topAnchor constraintEqualToAnchor:box.topAnchor],
                  [tap.bottomAnchor constraintEqualToAnchor:box.bottomAnchor],
                  [tap.leadingAnchor constraintEqualToAnchor:box.leadingAnchor],
                  [tap.trailingAnchor constraintEqualToAnchor:box.trailingAnchor],
                ]];
                [line addArrangedSubview:box];
                [_thumbs addObject:picture];
                [_boxes addObject:box];
              }
              [grid addArrangedSubview:line];
            }

            _info = SvrLabel(@"", 13.0, SVR_DIM, NO);
            _slotInfo = SvrLabel(@"", 13.0, SVR_TEXT, YES);
            _status = SvrLabel(@"", 13.0, SVR_DIM, NO);
            [stack addArrangedSubview:SvrCard(@[
              SvrHeading(@"Paint Tool logos"),
              SvrLabel(@"Your Paint Tool logos: 20 slots a page, 10 pages. Pick a page, then tap a logo.", 13.0, SVR_DIM, NO),
              _pageControl,
              _info,
              grid,
            ])];

            SvrGradButton* photos = SvrButton(@"Import from Photos…", YES, ^{
              [weakSelf pickFromPhotos];
            });
            SvrGradButton* files = SvrButton(@"Import from Files…", NO, ^{
              [weakSelf pickFromFiles];
            });
            SvrGradButton* save = SvrButton(@"Save as picture…", NO, ^{
              [weakSelf exportSelected];
            });
            SvrGradButton* del = SvrButton(@"Delete logo", NO, ^{
              [weakSelf deleteSelected];
            });
            [stack addArrangedSubview:SvrCard(@[
              SvrHeading(@"The logo you picked"),
              _slotInfo,
              SvrPair(photos, files),
              SvrPair(save, del),
              SvrLabel(@"An imported picture is fitted into 256 × 256 and cut down to the 256 colours a Paint Tool logo has (clear parts stay clear). It goes into the logo you picked, or into the first free slot of the page if you picked none.",
                       12.0, SVR_DIM, NO),
              _status,
              SvrLabel(@"Logos: Documents/Saves/00PaintTool.pt (page 1) and Documents/Saves/.paint (pages 2-10)", 12.0, SVR_DIM, NO),
            ])];
            [self refresh];
            return self;
          }

          - (void)say:(NSString*)text {
            _status.text = text;
          }

          - (void)refresh {
            svrsave::Bytes bytes;
            _loaded = svrsave::ReadPage(std::filesystem::path(SvrSavesDir()), _page, &bytes);
            if (_loaded) {
              _bytes = std::move(bytes);
            } else {
              _bytes.clear();
            }
            int used = 0;
            for (int k = 0; k < svrsave::kSlots; ++k) {
              UIImage* image = nil;
              if (_loaded && svrsave::SlotUsed(_bytes, k)) {
                ++used;
                const size_t t = svrsave::TgaOffset(k);
                image = SvrLogoImage(&_bytes[t + 20], &_bytes[t + 0x414]);
              }
              _thumbs[static_cast<NSUInteger>(k)].image = image;
            }
            if (_loaded) {
              _info.text = [NSString stringWithFormat:@"Page %d of %d: %d of %d slots used.", _page, svrsave::kPages, used, svrsave::kSlots];
            } else {
              _info.text = @"There is no Paint Tool save yet. Start the game once and open Created Superstar → Paint Tool, so the game makes it, then come back.";
            }
            [self markSelection];
          }

          - (void)markSelection {
            for (int k = 0; k < svrsave::kSlots; ++k) {
              UIView* box = _boxes[static_cast<NSUInteger>(k)];
              box.layer.borderColor = (k == _selected ? SVR_BLUE : [UIColor colorWithWhite:1.0 alpha:0.12]).CGColor;
            }
            if (_selected < 0) {
              _slotInfo.text = @"Tap a logo above.";
            } else if (_loaded && svrsave::SlotUsed(_bytes, _selected)) {
              _slotInfo.text = [NSString stringWithFormat:@"Page %d, slot %d: a logo.", _page, _selected + 1];
            } else {
              _slotInfo.text = [NSString stringWithFormat:@"Page %d, slot %d: empty.", _page, _selected + 1];
            }
          }

          - (void)showPageNumber:(int)page {
            _page = page;
            _selected = -1;
            [self say:@""];
            [self refresh];
          }

          - (void)selectSlot:(int)k {
            _selected = _selected == k ? -1 : k;
            [self markSelection];
          }

          - (void)confirm:(NSString*)title message:(NSString*)message verb:(NSString*)verb handler:(void (^)(void))go {
            UIViewController* host = self.presenter;
            if (!host) return;
            UIAlertController* alert = [UIAlertController alertControllerWithTitle:title message:message preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
            [alert addAction:[UIAlertAction actionWithTitle:verb style:UIAlertActionStyleDestructive handler:^(UIAlertAction* action) {
              go();
            }]];
            [host presentViewController:alert animated:YES completion:nil];
          }

          // ---- bringing a picture in ----

          // The slot a picture goes into: the one picked, else the page's first free one (-1: none).
          - (int)targetSlot {
            if (_selected >= 0) return _selected;
            for (int k = 0; k < svrsave::kSlots; ++k)
              if (!svrsave::SlotUsed(_bytes, k)) return k;
            return -1;
          }

          // Checks there is somewhere to put a picture, asks before replacing a logo, then runs `go`.
          - (void)beforeImport:(void (^)(void))go {
            if (!_loaded) {
              [self say:@"There is no Paint Tool save yet: start the game once and open Created Superstar → Paint Tool first."];
              return;
            }
            const int k = [self targetSlot];
            if (k < 0) {
              [self say:@"This page is full. Pick a logo to replace, or another page."];
              return;
            }
            _target = k;
            if (!svrsave::SlotUsed(_bytes, k)) {
              go();
              return;
            }
            [self confirm:@"Replace this logo?"
                  message:[NSString stringWithFormat:@"Page %d, slot %d already has a logo. The picture you pick takes its place.", _page, k + 1]
                     verb:@"Replace"
                  handler:go];
          }

          - (void)pickFromPhotos {
            __weak SvrPaintPage* weakSelf = self;
            [self beforeImport:^{
              SvrPaintPage* s = weakSelf;
              UIViewController* host = s.presenter;
              if (!s || !host) return;
              if (![UIImagePickerController isSourceTypeAvailable:UIImagePickerControllerSourceTypePhotoLibrary]) {
                [s say:@"The photo library isn't available here. Try Import from Files."];
                return;
              }
              UIImagePickerController* picker = [[UIImagePickerController alloc] init];
              picker.sourceType = UIImagePickerControllerSourceTypePhotoLibrary;
              picker.delegate = s;
              [host presentViewController:picker animated:YES completion:nil];
            }];
          }

          - (void)pickFromFiles {
            __weak SvrPaintPage* weakSelf = self;
            [self beforeImport:^{
              SvrPaintPage* s = weakSelf;
              UIViewController* host = s.presenter;
              if (!s || !host) return;
              UIDocumentPickerViewController* picker = [[UIDocumentPickerViewController alloc] initWithDocumentTypes:@[ @"public.image" ]
                                                                                                              inMode:UIDocumentPickerModeOpen];
              picker.delegate = s;
              [host presentViewController:picker animated:YES completion:nil];
            }];
          }

          - (void)imagePickerController:(UIImagePickerController*)picker didFinishPickingMediaWithInfo:(NSDictionary<UIImagePickerControllerInfoKey, id>*)info {
            UIImage* image = info[UIImagePickerControllerOriginalImage];
            [picker dismissViewControllerAnimated:YES completion:nil];
            [self importImage:image];
          }

          - (void)imagePickerControllerDidCancel:(UIImagePickerController*)picker {
            [picker dismissViewControllerAnimated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController*)controller didPickDocumentsAtURLs:(NSArray<NSURL*>*)urls {
            NSURL* url = urls.firstObject;
            if (!url) return;
            const BOOL scoped = [url startAccessingSecurityScopedResource];
            UIImage* image = [UIImage imageWithContentsOfFile:url.path];
            if (scoped) [url stopAccessingSecurityScopedResource];
            [self importImage:image];
          }

          - (void)importImage:(UIImage*)image {
            const int k = _target;
            _target = -1;
            if (k < 0 || k >= svrsave::kSlots || !_loaded) return;
            std::vector<uint32_t> argb;
            if (!SvrImageToArgb(image, &argb)) {
              [self say:@"That picture couldn't be read."];
              return;
            }
            uint8_t palette[1024];
            std::vector<uint8_t> pixels(65536);
            SvrQuantize(argb, palette, pixels.data());
            svrsave::PutIndexed(_bytes, k, palette, pixels.data());
            if (!svrsave::WritePage(std::filesystem::path(SvrSavesDir()), _page, _bytes)) {
              [self say:@"The Paint Tool save couldn't be written."];
              [self refresh];
              return;
            }
            _selected = k;
            [self refresh];
            [self say:[NSString stringWithFormat:@"Done: the picture is in page %d, slot %d.", _page, k + 1]];
          }

          // ---- taking one out, removing one ----

          - (void)exportSelected {
            if (!_loaded || _selected < 0 || !svrsave::SlotUsed(_bytes, _selected)) {
              [self say:@"Tap a logo first."];
              return;
            }
            UIViewController* host = self.presenter;
            UIImage* image = _thumbs[static_cast<NSUInteger>(_selected)].image;
            NSData* png = image ? UIImagePNGRepresentation(image) : nil;
            if (!png || !host) {
              [self say:@"That logo couldn't be turned into a picture."];
              return;
            }
            NSString* name = [NSString stringWithFormat:@"Paint Tool logo %d-%02d.png", _page, _selected + 1];
            NSString* path = [NSTemporaryDirectory() stringByAppendingPathComponent:name];
            if (![png writeToFile:path atomically:YES]) {
              [self say:@"The picture couldn't be written."];
              return;
            }
            UIActivityViewController* sheet = [[UIActivityViewController alloc] initWithActivityItems:@[ [NSURL fileURLWithPath:path] ]
                                                                                applicationActivities:nil];
            sheet.popoverPresentationController.sourceView = host.view;
            sheet.popoverPresentationController.sourceRect = CGRectMake(CGRectGetMidX(host.view.bounds), CGRectGetMidY(host.view.bounds), 1.0, 1.0);
            [host presentViewController:sheet animated:YES completion:nil];
          }

          - (void)deleteSelected {
            if (!_loaded || _selected < 0 || !svrsave::SlotUsed(_bytes, _selected)) {
              [self say:@"Tap a logo first."];
              return;
            }
            const int k = _selected;
            __weak SvrPaintPage* weakSelf = self;
            [self confirm:@"Delete this logo?"
                  message:[NSString stringWithFormat:@"Page %d, slot %d is emptied.", _page, k + 1]
                     verb:@"Delete"
                  handler:^{
                    SvrPaintPage* s = weakSelf;
                    if (!s || !s->_loaded) return;
                    svrsave::ClearSlot(s->_bytes, k);
                    if (!svrsave::WritePage(std::filesystem::path(SvrSavesDir()), s->_page, s->_bytes)) {
                      [s say:@"The Paint Tool save couldn't be written."];
                    } else {
                      [s say:[NSString stringWithFormat:@"Deleted page %d, slot %d.", s->_page, k + 1]];
                    }
                    [s refresh];
                  }];
          }
          @end


          // ---- the launcher screen ----

          // The tabs top to bottom, and the page each one shows (the page numbers of showPage:).
          static NSString* const kSvrTabNames[] = {@"Play", @"Mods", @"DLC", @"Save Manager", @"Paint Tool", @"Online", @"Settings", @"Install"};
          static const NSInteger kSvrTabPages[] = {0, 5, 4, 6, 7, 2, 1, 3};
          static const NSInteger kSvrTabCount = 8;

          @interface SvrLauncherViewController : UIViewController
          @property(nonatomic, copy) void (^onPlay)(void);
          @end

          @implementation SvrLauncherViewController {
            UIView* _content;
            UIView* _playPage;
            UILabel* _banner;
            UIColor* _bannerColor;
            NSMutableArray<SvrGradButton*>* _tabs;
            SvrOnlinePage* _online;
            SvrInstallPage* _install;
            SvrDlcPage* _dlc;
            SvrModsPage* _mods;
            SvrSavesPage* _saves;
            SvrPaintPage* _paint;
          }

          - (UIView*)buildPlayPage {
            const char* home = getenv("HOME");
            const std::string docs = home ? std::string(home) + "/Documents" : std::string();
            const bool hasGame = SvrFileExists(docs + "/default.xex");
            const bool hasShaders = SvrFileExists(docs + "/native_shaders/shaders.spv.pak");

            UIStackView* stack = nil;
            UIScrollView* page = SvrScrollPage(&stack);

            UILabel* gameState = SvrLabel(hasGame ? @"Found" : @"Not found", 15.0, hasGame ? SVR_OK : SVR_BAD, YES);
            UILabel* shaderState = SvrLabel(hasShaders ? @"Found" : @"Not found", 15.0, hasShaders ? SVR_OK : SVR_BAD, YES);
            UILabel* hint = SvrLabel(hasGame ? @"Game folder:"
                                             : @"Install the game from the Install tab, or copy your game folder (the one with default.xex) into:",
                                     13.0, SVR_DIM, NO);
            SvrCardView* card = SvrCard(@[ SvrRow(@"Game files", gameState), SvrRow(@"Shaders", shaderState), hint, SvrMono(SvrNS(docs)) ]);
            [stack addArrangedSubview:card];

            __weak SvrLauncherViewController* weakSelf = self;
            SvrGradButton* play = [[SvrGradButton alloc] initWithTitle:@"Start Game"
                                                                 style:kSvrRedStyle
                                                              fontSize:32.0
                                                                  kern:5.0
                                                                radius:8.0
                                                                insets:NSDirectionalEdgeInsetsMake(0.0, 16.0, 0.0, 16.0)];
            play.shine = YES;
            [play.heightAnchor constraintGreaterThanOrEqualToConstant:62.0].active = YES;
            [play addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
              SvrLauncherViewController* strongSelf = weakSelf;
              if (strongSelf && strongSelf.onPlay) strongSelf.onPlay();
            }] forControlEvents:UIControlEventTouchUpInside];
            play.enabled = hasGame;
            [stack addArrangedSubview:play];
            [stack setCustomSpacing:16.0 afterView:card];
            return page;
          }

          // The page title: chrome-filled capitals with a dark edge.
          - (void)setBannerText:(NSString*)text {
            if (!_bannerColor) {
              UIGraphicsImageRenderer* renderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(4.0, 36.0)];
              UIImage* fill = [renderer imageWithActions:^(UIGraphicsImageRendererContext* ctx) {
                CGGradientRef g = SvrMakeGradient({{0.0, 255, 255, 255, 1.0},
                                                   {0.38, 227, 233, 242, 1.0},
                                                   {0.50, 140, 150, 168, 1.0},
                                                   {0.53, 198, 207, 220, 1.0},
                                                   {1.0, 245, 248, 252, 1.0}});
                CGContextDrawLinearGradient(ctx.CGContext, g, CGPointMake(0.0, 0.0), CGPointMake(0.0, 36.0), 0);
                CGGradientRelease(g);
              }];
              _bannerColor = [UIColor colorWithPatternImage:fill];
            }
            NSShadow* shadow = [[NSShadow alloc] init];
            shadow.shadowColor = SvrHex(0x060c18, 1.0);
            shadow.shadowOffset = CGSizeMake(0.0, 2.0);
            shadow.shadowBlurRadius = 0.0;
            _banner.attributedText = [[NSAttributedString alloc]
                initWithString:text.uppercaseString
                    attributes:@{
                      NSFontAttributeName : SvrCondensed(30.0, YES),
                      NSForegroundColorAttributeName : _bannerColor,
                      NSKernAttributeName : @1.5,
                      NSShadowAttributeName : shadow
                    }];
          }

          - (void)showPage:(NSInteger)index {
            [self.view endEditing:YES];
            for (UIView* v in [_content.subviews copy]) [v removeFromSuperview];
            UIView* page = nil;
            if (index == 1) {
              page = SvrBuildSettingsPage();  // rebuilt each time, so it shows what is saved
            } else if (index == 2) {
              [_online refresh];
              page = _online.view;
            } else if (index == 3) {
              [_install refresh];
              page = _install.view;
            } else if (index == 4) {
              [_dlc refresh];
              page = _dlc.view;
            } else if (index == 5) {
              [_mods refresh];
              page = _mods.view;
            } else if (index == 6) {
              [_saves refresh];
              page = _saves.view;
            } else if (index == 7) {
              [_paint refresh];
              page = _paint.view;
            } else {
              _playPage = [self buildPlayPage];  // rebuilt each time: it shows whether the game is installed
              page = _playPage;
            }
            page.translatesAutoresizingMaskIntoConstraints = NO;
            [_content addSubview:page];
            [NSLayoutConstraint activateConstraints:@[
              [page.topAnchor constraintEqualToAnchor:_content.topAnchor],
              [page.bottomAnchor constraintEqualToAnchor:_content.bottomAnchor],
              [page.leadingAnchor constraintEqualToAnchor:_content.leadingAnchor],
              [page.trailingAnchor constraintEqualToAnchor:_content.trailingAnchor],
            ]];
            for (NSInteger i = 0; i < kSvrTabCount; ++i) {
              _tabs[i].style = kSvrTabPages[i] == index ? kSvrTabOn : kSvrTab;
              if (kSvrTabPages[i] == index) [self setBannerText:kSvrTabNames[i]];
            }
            UIView* content = _content;
            content.alpha = 0.0;
            content.transform = CGAffineTransformMakeTranslation(14.0, 0.0);
            [UIView animateWithDuration:0.22
                                  delay:0.0
                                options:UIViewAnimationOptionCurveEaseOut
                             animations:^{
                               content.alpha = 1.0;
                               content.transform = CGAffineTransformIdentity;
                             }
                             completion:nil];
          }

          - (void)viewDidLoad {
            [super viewDidLoad];
            self.view.backgroundColor = SVR_BG;
            UILayoutGuide* safe = self.view.safeAreaLayoutGuide;

            SvrBackdropView* backdrop = [[SvrBackdropView alloc] init];
            backdrop.translatesAutoresizingMaskIntoConstraints = NO;
            [self.view addSubview:backdrop];
            [NSLayoutConstraint activateConstraints:@[
              [backdrop.topAnchor constraintEqualToAnchor:self.view.topAnchor],
              [backdrop.bottomAnchor constraintEqualToAnchor:self.view.bottomAnchor],
              [backdrop.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
              [backdrop.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
            ]];

            // the side column: the logo (launcher_logo.png in the app; the name in type when it is not there) and the tabs
            UIView* logo = nil;
            NSString* logoPath = [[NSBundle mainBundle] pathForResource:@"launcher_logo" ofType:@"png"];
            UIImage* logoImage = logoPath ? [UIImage imageWithContentsOfFile:logoPath] : nil;
            if (logoImage) {
              UIImageView* iv = [[UIImageView alloc] initWithImage:logoImage];
              iv.contentMode = UIViewContentModeScaleAspectFit;
              iv.layer.shadowColor = [UIColor blackColor].CGColor;
              iv.layer.shadowOpacity = 0.5f;
              iv.layer.shadowOffset = CGSizeMake(0.0, 3.0);
              iv.layer.shadowRadius = 3.0;
              [iv setContentHuggingPriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisHorizontal];
              [iv setContentCompressionResistancePriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisHorizontal];
              [iv setContentHuggingPriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisVertical];
              [iv setContentCompressionResistancePriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisVertical];
              logo = iv;
            } else {
              UILabel* name = SvrLabel(@"SMACKDOWN\nVS. RAW 2011", 24.0, SVR_TEXT, YES);
              name.font = SvrCondensed(24.0, YES);
              name.textAlignment = NSTextAlignmentCenter;
              logo = name;
            }
            // (the logo gives way first when the screen is short: eight tabs need the room)
            NSLayoutConstraint* logoHeight = [logo.heightAnchor constraintEqualToConstant:94.0];
            logoHeight.priority = UILayoutPriorityDefaultHigh;
            logoHeight.active = YES;

            UIStackView* tabsStack = [[UIStackView alloc] init];
            tabsStack.axis = UILayoutConstraintAxisVertical;
            tabsStack.spacing = 3.0;
            _tabs = [NSMutableArray array];
            __weak SvrLauncherViewController* weakSelf = self;
            for (NSInteger i = 0; i < kSvrTabCount; ++i) {
              SvrGradButton* b = [[SvrGradButton alloc] initWithTitle:kSvrTabNames[i]
                                                                style:i == 0 ? kSvrTabOn : kSvrTab
                                                             fontSize:15.0
                                                                 kern:1.4
                                                               radius:0.0
                                                               insets:NSDirectionalEdgeInsetsMake(0.0, 14.0, 0.0, 24.0)];
              b.slanted = YES;
              b.contentHorizontalAlignment = UIControlContentHorizontalAlignmentLeading;
              [b.heightAnchor constraintEqualToConstant:30.0].active = YES;
              const NSInteger page = kSvrTabPages[i];
              [b addAction:[UIAction actionWithHandler:^(__kindof UIAction* action) {
                [weakSelf showPage:page];
              }] forControlEvents:UIControlEventTouchUpInside];
              [tabsStack addArrangedSubview:b];
              [_tabs addObject:b];
            }

            UIStackView* side = [[UIStackView alloc] initWithArrangedSubviews:@[ logo, tabsStack ]];
            side.axis = UILayoutConstraintAxisVertical;
            side.spacing = 8.0;
            side.translatesAutoresizingMaskIntoConstraints = NO;
            [self.view addSubview:side];

            // the page title and the light line under it
            _banner = [[UILabel alloc] init];
            _banner.translatesAutoresizingMaskIntoConstraints = NO;
            [self.view addSubview:_banner];

            UIGraphicsImageRenderer* lineRenderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(230.0, 2.0)];
            UIImage* lineImage = [lineRenderer imageWithActions:^(UIGraphicsImageRendererContext* ctx) {
              CGGradientRef g = SvrMakeGradient({{0.0, 120, 195, 255, 0.95}, {1.0, 120, 195, 255, 0.0}});
              CGContextDrawLinearGradient(ctx.CGContext, g, CGPointMake(0.0, 0.0), CGPointMake(230.0, 0.0), 0);
              CGGradientRelease(g);
            }];
            UIImageView* line = [[UIImageView alloc] initWithImage:lineImage];
            line.translatesAutoresizingMaskIntoConstraints = NO;
            [self.view addSubview:line];

            SvrFadeView* content = [[SvrFadeView alloc] init];
            content.translatesAutoresizingMaskIntoConstraints = NO;
            [self.view addSubview:content];
            _content = content;

            [NSLayoutConstraint activateConstraints:@[
              [side.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16.0],
              [side.topAnchor constraintEqualToAnchor:self.view.topAnchor constant:12.0],
              [side.widthAnchor constraintEqualToConstant:190.0],
              [side.bottomAnchor constraintLessThanOrEqualToAnchor:safe.bottomAnchor constant:-6.0],
              [_banner.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:224.0],
              [_banner.topAnchor constraintEqualToAnchor:self.view.topAnchor constant:11.0],
              [_banner.heightAnchor constraintEqualToConstant:36.0],
              [line.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:224.0],
              [line.topAnchor constraintEqualToAnchor:self.view.topAnchor constant:49.0],
              [content.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:224.0],
              [content.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-18.0],
              [content.topAnchor constraintEqualToAnchor:self.view.topAnchor constant:54.0],
              [content.bottomAnchor constraintEqualToAnchor:self.view.keyboardLayoutGuide.topAnchor constant:-8.0],
            ]];

            _online = [[SvrOnlinePage alloc] init];
            _install = [[SvrInstallPage alloc] init];
            _install.presenter = self;
            _dlc = [[SvrDlcPage alloc] init];
            _dlc.presenter = self;
            _mods = [[SvrModsPage alloc] init];
            _mods.presenter = self;
            _saves = [[SvrSavesPage alloc] init];
            _saves.presenter = self;
            _paint = [[SvrPaintPage alloc] init];
            _paint.presenter = self;
            [self showPage:0];
          }

          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
            return UIInterfaceOrientationMaskLandscape;
          }

          - (BOOL)prefersStatusBarHidden {
            return YES;
          }

          @end

          extern "C" void SvrIosLauncherShow(void) {
            @autoreleasepool {
              const char* home = getenv("HOME");
              if (home && SvrFileExists(std::string(home) + "/Documents/skip_launcher")) {
                std::fprintf(stderr, "[boot] launcher: skipped (skip_launcher file)\n");
                return;
              }
              UIWindowScene* scene = nil;
              for (UIScene* candidate in [UIApplication sharedApplication].connectedScenes) {
                if ([candidate isKindOfClass:[UIWindowScene class]]) {
                  scene = (UIWindowScene*)candidate;
                  break;
                }
              }
              if (!scene) {
                std::fprintf(stderr, "[boot] launcher: no window scene, starting the game directly\n");
                return;
              }
              __block BOOL play = NO;
              SvrLauncherViewController* controller = [[SvrLauncherViewController alloc] init];
              controller.onPlay = ^{ play = YES; };
              UIWindow* window = [[UIWindow alloc] initWithWindowScene:scene];
              window.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;  // (dark alerts, keyboard and file picker)
              window.rootViewController = controller;
              [window makeKeyAndVisible];
              std::fprintf(stderr, "[boot] launcher: shown\n");
              NSRunLoop* loop = [NSRunLoop currentRunLoop];
              while (!play) {
                BOOL ran = [loop runMode:NSDefaultRunLoopMode beforeDate:[NSDate dateWithTimeIntervalSinceNow:0.05]];
                if (!ran) usleep(10000);
              }
              std::fprintf(stderr, "[boot] launcher: Play pressed\n");
              window.hidden = YES;
              // let UIKit finish hiding it before the game makes its own window (else the log fills with
              // "Unbalanced calls to begin/end appearance transitions")
              for (int i = 0; i < 6; ++i) {
                [loop runMode:NSDefaultRunLoopMode beforeDate:[NSDate dateWithTimeIntervalSinceNow:0.05]];
              }
              window.rootViewController = nil;
            }
          }

          // An https request for the game's online client (the game has no TLS of its own on iPhone).
          // `raw` gets a whole HTTP answer ("HTTP/1.1 200 OK", headers, blank line, body); false = no answer.
          bool SvrIosHttpsRequest(const std::string& method, const std::string& url, const std::string& headerLines,
                                  const std::string& body, std::string* raw) {
            @autoreleasepool {
              NSURL* u = [NSURL URLWithString:SvrNS(url)];
              if (!u) return false;
              NSMutableURLRequest* req = [NSMutableURLRequest requestWithURL:u
                                                                 cachePolicy:NSURLRequestReloadIgnoringLocalCacheData
                                                             timeoutInterval:60.0];
              req.HTTPMethod = SvrNS(method);
              size_t at = 0;
              while (at < headerLines.size()) {
                size_t end = headerLines.find("\r\n", at);
                if (end == std::string::npos) end = headerLines.size();
                const std::string line = headerLines.substr(at, end - at);
                at = end + 2;
                const size_t colon = line.find(':');
                if (colon == std::string::npos) continue;
                const std::string name = SvrTrim(line.substr(0, colon));
                if (strcasecmp(name.c_str(), "content-length") == 0 || strcasecmp(name.c_str(), "host") == 0) continue;
                [req setValue:SvrNS(SvrTrim(line.substr(colon + 1))) forHTTPHeaderField:SvrNS(name)];
              }
              if (!body.empty()) req.HTTPBody = [NSData dataWithBytes:body.data() length:body.size()];

              __block NSData* resultData = nil;
              __block NSHTTPURLResponse* resultResponse = nil;
              dispatch_semaphore_t done = dispatch_semaphore_create(0);
              [[[NSURLSession sharedSession]
                  dataTaskWithRequest:req
                    completionHandler:^(NSData* data, NSURLResponse* response, NSError* error) {
                      if (!error && [response isKindOfClass:[NSHTTPURLResponse class]]) {
                        resultData = data;
                        resultResponse = (NSHTTPURLResponse*)response;
                      }
                      dispatch_semaphore_signal(done);
                    }] resume];
              dispatch_semaphore_wait(done, DISPATCH_TIME_FOREVER);
              if (!resultResponse) return false;

              std::string out = "HTTP/1.1 " + std::to_string(static_cast<long>(resultResponse.statusCode)) + " OK\r\n";
              for (id key in resultResponse.allHeaderFields) {
                const std::string name = SvrStr(key);
                // (the body arrives whole and already decoded, so these three would be wrong)
                if (name.empty() || strcasecmp(name.c_str(), "content-length") == 0 ||
                    strcasecmp(name.c_str(), "transfer-encoding") == 0 || strcasecmp(name.c_str(), "content-encoding") == 0) {
                  continue;
                }
                out += name + ": " + SvrStd([NSString stringWithFormat:@"%@", resultResponse.allHeaderFields[key]]) + "\r\n";
              }
              const size_t length = resultData ? static_cast<size_t>(resultData.length) : 0;
              out += "Content-Length: " + std::to_string(length) + "\r\n\r\n";
              if (length > 0) out.append(static_cast<const char*>(resultData.bytes), length);
              *raw = out;
              return true;
            }
          }
          EOF

          cat >> port-src/port/CMakeLists.txt <<'EOF'

          if(IOS)
            target_sources(svr2011 PRIVATE src/ios_launcher.mm)
            set_source_files_properties(src/ios_launcher.mm PROPERTIES COMPILE_FLAGS "-fobjc-arc")
          endif()
          EOF

          # call the launcher at the start of main (before SDL makes the game window)
          python3 - <<'PYEOF'
          p = "sdk/src/ui/windowed_app_main_sdl.cpp"
          s = open(p).read()
          old = "int main(int argc, char* argv[]) {\n  return RunWindowedApp(argc, argv);\n}"
          assert s.count(old) == 1, s.count(old)
          new = ("#if defined(__APPLE__) && TARGET_OS_IPHONE\n"
                 "extern \"C\" void SvrIosLauncherShow(void);\n"
                 "#endif\n"
                 "int main(int argc, char* argv[]) {\n"
                 "#if defined(__APPLE__) && TARGET_OS_IPHONE\n"
                 "  SvrIosLauncherShow();\n"
                 "#endif\n"
                 "  return RunWindowedApp(argc, argv);\n"
                 "}")
          open(p, "w").write(s.replace(old, new))
          PYEOF
          echo "---- main() after the launcher edit ----"
          grep -n -B3 -A8 "SvrIosLauncherShow" sdk/src/ui/windowed_app_main_sdl.cpp
          tail -n 6 port-src/port/CMakeLists.txt
          test -f port-src/port/src/ios_launcher.mm
          grep -q "SvrIosLauncherShow();" sdk/src/ui/windowed_app_main_sdl.cpp

      - name: Debug - what the port source looks like (anchors for the next patch steps)
        run: |
          git -C port-src log -1 --format='port-src @ %H %cd' || true
          f=port-src/port/src/online_net.cpp
          file "$f" || true
          grep -n 'rex/logging.h\|REXCVAR_DEFINE_STRING(online_token\|SvrIosHttpsRequest\|__ANDROID__\|BridgeRequest' "$f" || true
          grep -n 'BuildEntryPac' port-src/port/src/move_packs.cpp || true

      - name: iOS online (the game's https requests go through the system)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          p = "port-src/port/src/online_net.cpp"
          raw = open(p, newline="").read()
          nl = "\r\n" if "\r\n" in raw else "\n"
          s = raw.replace("\r\n", "\n")

          if "SvrIosHttpsRequest" in s:
              print("online_net.cpp already has the iOS https hook, nothing to do")
              sys.exit(0)

          def skip(why):
              # Best effort: without this hook the build still works, only the launcher's Online tab stays inert.
              print("::warning::iOS online hook skipped: " + why)
              sys.exit(0)

          # anchor 1: right after the <rex/logging.h> include (else after the last #include)
          m1 = re.search(r'^#include <rex/logging\.h>[ \t]*\n', s, re.M)
          if not m1:
              incs = list(re.finditer(r'^#include [^\n]*\n', s, re.M))
              m1 = incs[-1] if incs else None
          if not m1:
              skip("no #include line found in online_net.cpp")

          # anchor 2: the Android branch of the request function (whitespace tolerant)
          m2 = re.search(r'#if defined\(__ANDROID__\)[ \t]*\n[ \t]*return BridgeRequest\([^;]*\);[ \t]*\n#else[ \t]*\n', s)
          if not m2:
              skip("the __ANDROID__ / BridgeRequest block was not found (upstream changed online_net.cpp)")
          if m2.start() < m1.end():
              skip("anchors are in an unexpected order")

          decl = ('\n#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n'
                  '// ios_launcher.mm: an https request through the system; false when there was no answer.\n'
                  'bool SvrIosHttpsRequest(const std::string& method, const std::string& url,\n'
                  '                        const std::string& header_lines, const std::string& body, std::string* raw);\n'
                  '#endif\n')
          ios_branch = ('#elif defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n'
                        '    std::string header_lines;\n'
                        '    for (const auto& h : headers) header_lines += h.first + ": " + h.second + "\\r\\n";\n'
                        '    std::string raw;\n'
                        '    if (!SvrIosHttpsRequest(method, full_url, header_lines, body, &raw)) return std::nullopt;\n'
                        '    return ParseRaw(raw);\n'
                        '#else\n')

          android_part = m2.group(0)[:m2.group(0).rindex('#else')]
          s = s[:m2.start()] + android_part + ios_branch + s[m2.end():]   # later edit first, offsets of m1 stay valid
          s = s[:m1.end()] + decl + s[m1.end():]
          open(p, "w", newline="").write(s.replace("\n", nl))
          print("iOS https hook added to online_net.cpp")
          PYEOF
          echo "---- online_net.cpp edits ----"
          grep -n -B1 -A7 "SvrIosHttpsRequest" port-src/port/src/online_net.cpp || true

      - name: Hide REPORT A PROBLEM from the pause menu (reports can't be sent from iOS yet)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          p = "port-src/port/src/report_page.cpp"
          try:
              raw = open(p, newline="").read()
          except FileNotFoundError:
              print("::warning::REPORT A PROBLEM hide skipped: report_page.cpp not found")
              sys.exit(0)
          nl = "\r\n" if "\r\n" in raw else "\n"
          s = raw.replace("\r\n", "\n")
          if "[ios] no REPORT A PROBLEM row" in s:
              print("report_page.cpp already patched, nothing to do")
              sys.exit(0)
          # the pause screen's hook: right after its online (Lockstep) check, before it builds the extra row
          m = re.search(r'^[ \t]*if \(svr2011::Lockstep\(\)\) return;[^\n]*\n(?=[ \t]*const uint32_t items\s*=)', s, re.M)
          if not m:
              print("::warning::REPORT A PROBLEM hide skipped: the pause-menu hook was not found (upstream changed report_page.cpp)")
              sys.exit(0)
          add = ("#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n"
                 "  if (true) return;  // [ios] no REPORT A PROBLEM row: reports can't be sent from iOS yet\n"
                 "#endif\n")
          s = s[:m.end()] + add + s[m.end():]
          open(p, "w", newline="").write(s.replace("\n", nl))
          print("REPORT A PROBLEM row hidden on iOS")
          PYEOF
          grep -n -B2 -A3 "no REPORT A PROBLEM row" port-src/port/src/report_page.cpp || true

