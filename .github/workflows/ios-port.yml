          if not m:
              print("::warning::OPTIONS report patch skipped: the OpenReportPage(false) call was not found (upstream changed menu_hooks.cpp)")
              sys.exit(0)
          i = m.group(1)
          new = ("#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n"
                 + i + "// [ios] REPORT A PROBLEM: no page - reports can't be sent from iOS yet (the choice is just ignored)\n"
                 "#else\n"
                 + m.group(0) +
                 "#endif\n")
          s = s[:m.start()] + new + s[m.end():]
          open(p, "w", newline="").write(s.replace("\n", nl))
          print("OPTIONS -> REPORT A PROBLEM now does nothing on iOS")
          PYEOF
          grep -n -B3 -A6 "\[ios\] REPORT A PROBLEM" port-src/port/src/menu_hooks.cpp || true

      - name: Remove the OPTIONS -> REPORT A PROBLEM row on iOS (reports can't be sent from iOS yet)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          p = "port-src/port/src/match_types.cpp"
          try:
              raw = open(p, newline="").read()
          except FileNotFoundError:
              print("::warning::OPTIONS report row removal skipped: match_types.cpp not found")
              sys.exit(0)
          nl = "\r\n" if "\r\n" in raw else "\n"
          s = raw.replace("\r\n", "\n")
          if "[ios] no REPORT A PROBLEM row in OPTIONS" in s:
              print("match_types.cpp already patched, nothing to do")
              sys.exit(0)
          # the block of WithRows() that adds the row (a copy of WEAPONS, the group's last) to MY WWE -> OPTIONS
          m = re.search(r'^([ \t]*)if \(Rd32\(rec\) == kOptionsWeaponsLabel[^\n]*\{[ \t]*\n', s, re.M)
          if not m:
              print("::warning::OPTIONS report row removal skipped: the row-adding block was not found (upstream changed match_types.cpp)")
              sys.exit(0)
          i = m.group(1)
          new = ("#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n"
                 + i + "if (false) {  // [ios] no REPORT A PROBLEM row in OPTIONS: reports can't be sent from iOS yet (WEAPONS stays the last row)\n"
                 "#else\n"
                 + m.group(0) +
                 "#endif\n")
          s = s[:m.start()] + new + s[m.end():]
          open(p, "w", newline="").write(s.replace("\n", nl))
          print("OPTIONS -> REPORT A PROBLEM row removed on iOS")
          PYEOF
          grep -n -B2 -A6 "no REPORT A PROBLEM row in OPTIONS" port-src/port/src/match_types.cpp || true

      - name: Move packs - a bad entrance pac must not cancel every pack
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          p = "port-src/port/src/move_packs.cpp"
          raw = open(p, newline="").read()
          nl = "\r\n" if "\r\n" in raw else "\n"
          s = raw.replace("\r\n", "\n")

          if "mod entrances left out" in s:
              print("move_packs.cpp already has this fix, nothing to do")
              sys.exit(0)
          m = re.search(r'^([ \t]*)ok = ok && BuildEntryPac\(game, overlay, pac, entries\);[ \t]*\n', s, re.M)
          if not m:
              # Best effort: this only fixes modded moves freezing, the build does not depend on it.
              print("::warning::move_packs fix skipped: the BuildEntryPac line was not found (upstream changed move_packs.cpp)")
              sys.exit(0)
          i = m.group(1)
          new = (i + "if (ok && !BuildEntryPac(game, overlay, pac, entries)) {\n" +
                 i + "  // [ios] the game's own entrance pac is missing or not a pac: only the mods' entrances are lost,\n" +
                 i + "  // not every move pack (without this the whole merge was dropped and modded moves froze)\n" +
                 i + "  const std::string pac_name = pac;  // (a plain copy: a structured binding can't be captured by the log macro)\n" +
                 i + "  REXLOG_WARN(\"[svr2011] move packs: {}: mod entrances left out (the game's own file is missing or damaged)\", pac_name);\n" +
                 i + "  pacs.erase(pac_name);\n" +
                 i + "  SetModEntrances(decltype(packs.entry_lines){});\n" +
                 i + "}\n")
          s = s[:m.start()] + new + s[m.end():]
          open(p, "w", newline="").write(s.replace("\n", nl))
          print("move_packs.cpp patched")
          PYEOF
          echo "---- move_packs.cpp edit ----"
          grep -n -B2 -A8 "mod entrances left out" port-src/port/src/move_packs.cpp || true

      - name: Put the generated code in place, and stop codegen re-running
        run: |
          cp -R generated port-src/port/generated
          F=port-src/port/generated/rexglue.cmake
          perl -0pi -e 's/add_custom_command\(\s*OUTPUT "\$\{CMAKE_CURRENT_SOURCE_DIR\}\/generated\/default\/codegen\.build\.stamp".*?add_custom_target\(svr2011_codegen\s+DEPENDS "[^"]*"\)/add_custom_target(svr2011_codegen)/s' "$F"
          echo "---- end of rexglue.cmake after patch ----"; tail -n 12 "$F"

      - name: Configure the port (iOS arm64)
        run: |
          set -o pipefail
          cmake -S port-src/port -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_SHARED_LINKER_FLAGS="-framework UIKit -framework CoreGraphics -framework QuartzCore -framework AudioToolbox -framework CoreFoundation -framework AVFoundation -framework CoreMedia -framework CoreVideo" \
            -DCMAKE_EXE_LINKER_FLAGS="-framework UIKit -framework CoreGraphics -framework QuartzCore -framework AudioToolbox -framework CoreFoundation -framework AVFoundation -framework CoreMedia -framework CoreVideo -lz" \
            -DREXSDK_DIR="$PWD/sdk" \
            -DREXGLUE_ROOT="$PWD/sdk" \
            -DPLUME_DIR="$PWD/plume" \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_ENABLE_TRACY=OFF \
            2>&1 | tee configure.log

      - name: Build svr2011 (keeps going to show every error, then fails if there were any)
        run: |
          set -o pipefail
          cmake --build build --target svr2011 -- -j3 -k 0 2>&1 | tee build.log

      - name: Inspect the binary (platform, size, dependencies)
        run: |
          set -euo pipefail
          exec > >(tee -a package.log) 2>&1
          B=build/svr2011
          ls -l "$B"
          file "$B"
          otool -l "$B" | grep -A5 LC_BUILD_VERSION
          echo "---- exe dependencies ----"
          otool -L "$B"
          echo "---- exe rpaths ----"
          otool -l "$B" | grep -A2 LC_RPATH || echo "(none)"
          echo "---- SDK dylibs ----"
          ls -l sdk/out/mac-arm64/*.dylib
          for d in librexruntime.dylib librexgpu-xenos.dylib libMoltenVK.dylib; do
            echo "== $d"; otool -L "sdk/out/mac-arm64/$d"
          done

      - name: Package unsigned IPA (best-effort first version)
        run: |
          set -euo pipefail
          exec > >(tee -a package.log) 2>&1
          APP="ipa/Payload/SvR2011.app"
          FW="$APP/Frameworks"
          rm -rf ipa svr2011-unsigned.ipa
          mkdir -p "$FW"
          cp build/svr2011 "$APP/svr2011"

          # the SDK's own staged Vulkan runtime (lib/ + share/vulkan/icd.d/); the app looks in <bundle>/vulkan
          test -f build/vulkan/lib/libvulkan.1.dylib
          test -f build/vulkan/lib/libMoltenVK.dylib
          test -f build/vulkan/share/vulkan/icd.d/MoltenVK_icd.json
          cp -RL build/vulkan "$APP/vulkan"

          # the native renderer's shader pack (private repo: shaders/); the app copies it to Documents
          if [ -d shaders ]; then
            mkdir -p "$APP/native_shaders"
            cp shaders/* "$APP/native_shaders/"
            echo "bundled shaders:"; ls -l "$APP/native_shaders"
          else
            echo "NOTE: no shaders/ folder in the repo - the IPA has no shaders (add them as described)."
          fi

          # the launcher's logo (private repo: icon/launcher_logo.png); without it the launcher shows the name in type
          if [ -f icon/launcher_logo.png ]; then
            cp icon/launcher_logo.png "$APP/launcher_logo.png"
            echo "bundled launcher logo:"; ls -l "$APP/launcher_logo.png"
          else
            echo "NOTE: no icon/launcher_logo.png in the repo - the launcher shows the game name in type instead."
          fi

          # real dylib files (symlink names resolved to the real file)
          for n in librexruntime.dylib librexgpu-xenos.dylib; do
            src="sdk/out/mac-arm64/$n"
            cp -L "$src" "$FW/$(basename "$(realpath "$src")")"
          done

          # point every dependency that lives in the build tree at @rpath/<file>, pulling it into Frameworks
          for pass in 1 2 3; do
            for f in "$APP/svr2011" "$FW"/*.dylib; do
              otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                case "$dep" in
                  /usr/lib/*|/System/*) continue ;;
                  @rpath/*) cand="sdk/out/mac-arm64/${dep#@rpath/}" ;;
                  /*) cand="$dep" ;;
                  *) continue ;;
                esac
                [ -e "$cand" ] || { echo "MISSING: $f -> $dep"; continue; }
                base="$(basename "$(realpath "$cand")")"
                [ -e "$FW/$base" ] || cp -L "$cand" "$FW/$base"
                install_name_tool -change "$dep" "@rpath/$base" "$f"
              done
            done
          done

          # each dylib: own name; every file: drop build-machine rpaths, add the app's
          for f in "$FW"/*.dylib; do install_name_tool -id "@rpath/$(basename "$f")" "$f"; done
          for f in "$APP/svr2011" "$FW"/*.dylib; do
            for rp in $(otool -l "$f" | awk '/LC_RPATH/{r=1} r && /path /{print $2; r=0}'); do
              case "$rp" in /Users/*) install_name_tool -delete_rpath "$rp" "$f" ;; esac
            done
          done
          install_name_tool -add_rpath "@executable_path/Frameworks" "$APP/svr2011"
          for f in "$FW"/*.dylib; do install_name_tool -add_rpath "@loader_path" "$f"; done

          cat > "$APP/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.ke619.svr2011</string>
            <key>CFBundleName</key><string>SvR2011</string>
            <key>CFBundleDisplayName</key><string>SvR 2011</string>
            <key>CFBundleExecutable</key><string>svr2011</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.8.1</string>
            <key>CFBundleVersion</key><string>0.8.1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
            <key>NSLocalNetworkUsageDescription</key>
            <string>Lets the game reach a Community Creations server on your local network.</string>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array><string>AppIcon60x60</string></array>
              </dict>
            </dict>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
            <key>UIRequiresFullScreen</key><true/>
            <key>UIStatusBarHidden</key><true/>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Info.plist"

          # the home-screen icon: icon/icon.png from the repo, made into the two sizes iPhones use
          if [ -f icon/icon.png ]; then
            sips -s format jpeg icon/icon.png --out "$RUNNER_TEMP/icon.jpg" > /dev/null
            sips -s format png -z 120 120 "$RUNNER_TEMP/icon.jpg" --out "$APP/AppIcon60x60@2x.png" > /dev/null
            sips -s format png -z 180 180 "$RUNNER_TEMP/icon.jpg" --out "$APP/AppIcon60x60@3x.png" > /dev/null
            echo "icon files:"; ls -l "$APP"/AppIcon60x60*
          else
            echo "NOTE: no icon/icon.png in the repo - the app keeps the blank icon."
          fi

          # leftover references to the build machine would make the app fail at launch
          if otool -L "$APP/svr2011" "$FW"/*.dylib "$APP/vulkan/lib"/*.dylib | grep "/Users/"; then
            echo "ERROR: build-machine paths left in the binaries"; exit 1
          fi

          # ad-hoc signature (sideload tools replace it)
          codesign --force --sign - "$FW"/*.dylib "$APP/vulkan/lib"/*.dylib
          codesign --force --sign - "$APP/svr2011"

          (cd ipa && zip -qry ../svr2011-unsigned.ipa Payload)
          ls -l svr2011-unsigned.ipa
          echo "---- app contents ----"
          ls -l "$APP" "$FW"
          find "$APP/vulkan" -type f -exec ls -l {} \;

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: svr2011-unsigned-ipa
          path: svr2011-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Cache stats
        if: always()
        run: ccache -s || true

      - name: Error summary
        if: always()
        run: |
          {
            echo "### port on iOS"
            echo '```'
            grep -hE "error:|CMake Error|FAILED:|fatal error|Undefined symbols" configure.log build.log 2>/dev/null | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-logs
          path: |
            configure.log
            build.log
            package.log

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
