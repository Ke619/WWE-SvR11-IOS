name: ios-port
# Builds the port (generated game code + port/src) for iOS arm64. Lives in the PRIVATE repo.
on:
  workflow_dispatch:
    inputs:
      port_repo:
        description: "Port source repo (default: the original PC port)"
        required: false
        default: "https://github.com/KaikoClanworth1/wwe-svr2011-pc"
      port_ref:
        description: "Branch, tag or commit SHA of the port source to build (empty = default branch)"
        required: false
        default: ""

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  port:
    runs-on: macos-15
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated code is here (and no game file)
        run: |
          test -f generated/rexglue.cmake && echo "rexglue.cmake ok"
          test -f generated/default/sources.cmake && echo "sources.cmake ok"
          test -f generated/default/svr2011_pch.h && echo "pch ok"
          echo "files in generated: $(find generated -type f | wc -l)"
          if find . -name "default.xex" | grep -q .; then echo "ERROR: default.xex is in this repo"; exit 1; fi

      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Tools
        run: brew install ninja ccache || true

      - name: Fetch SDK (pinned), the port, and plume (pinned)
        env:
          PORT_REPO: ${{ inputs.port_repo || 'https://github.com/KaikoClanworth1/wwe-svr2011-pc' }}
          PORT_REF: ${{ inputs.port_ref }}
        run: |
          git clone https://github.com/rexglue/rexglue-sdk sdk
          git -C sdk checkout c94f5ebdcb3c9d1a460ca48e04f9758448f8d518
          git -C sdk submodule update --init --recursive --jobs 8
          git clone "$PORT_REPO" port-src
          if [ -n "$PORT_REF" ]; then git -C port-src checkout "$PORT_REF"; fi
          git -C port-src log -1 --format='port-src @ %H %cd'
          git clone https://github.com/renderbag/plume plume
          git -C plume checkout d723793
          git -C plume submodule update --init --recursive --jobs 8

      - name: Apply patches (the port's own, plus our iOS fixes)
        run: |
          git -C sdk apply --whitespace=nowarn ../port-src/port/patches/rexglue-sdk-svr2011.patch
          git -C plume apply --whitespace=nowarn ../port-src/port/patches/plume-svr2011.patch

          # SDK: MoltenVK has no AppKit on iOS; thread id; no mach_vm.h on iOS
          perl -i -pe 's/^(\s*find_library\(APPKIT_LIBRARY.*)$/if(NOT IOS)\n$1\nendif()/' sdk/thirdparty/moltenvk/Common/CMakeLists.txt
          perl -i -pe 's/return pthread_gettid_np\(thread_\);/return [&]{ uint64_t t__ = 0; pthread_threadid_np(thread_, &t__); return static_cast<pid_t>(t__); }();/' sdk/src/core/threading_posix.cpp
          cat > sdk/src/core/ios_mach_vm_shim.h <<'EOF'
          // iOS: the SDK has no mach/mach_vm.h; vm_region_64 does the same job.
          #pragma once
          #include <mach/mach.h>
          #include <mach/mach_init.h>
          #include <mach/vm_map.h>
          #include <mach/vm_region.h>
          static inline kern_return_t mach_vm_region(vm_map_t task, mach_vm_address_t* address,
                                                     mach_vm_size_t* size, vm_region_flavor_t flavor,
                                                     vm_region_info_t info, mach_msg_type_number_t* count,
                                                     mach_port_t* object_name) {
            vm_address_t a = static_cast<vm_address_t>(*address);
            vm_size_t s = 0;
            kern_return_t kr = vm_region_64(task, &a, &s, flavor, info, count, object_name);
            *address = a;
            *size = s;
            return kr;
          }
          EOF
          perl -i -pe 's{#\s*include\s*[<"]mach/mach_vm\.h[>"]}{#include "ios_mach_vm_shim.h"}' sdk/src/core/memory_posix.cpp
          echo "---- mach_vm.h users in the SDK (should only be the shim now) ----"
          grep -rn "mach_vm.h\|ios_mach_vm_shim" sdk/src sdk/include | head

          # plume: no Metal backend on iOS (Vulkan only)
          perl -0pi -e 's/if\(APPLE\)\n(\s+list\(APPEND PLUME_SOURCES\n\s+plume_metal\.cpp)/if(APPLE AND NOT IOS)\n$1/' plume/CMakeLists.txt

          # port: ObjC languages, the launcher/ Bink + include dir on iOS, gettid on Apple
          sed -i '' 's/^project(svr2011 LANGUAGES C CXX)/project(svr2011 LANGUAGES C CXX OBJC OBJCXX)/' port-src/port/CMakeLists.txt
          sed -i '' 's/^if(WIN32 OR ANDROID)$/if(WIN32 OR ANDROID OR IOS)/' port-src/port/CMakeLists.txt
          cat >> port-src/port/src/compat.h <<'EOF'

          #if defined(__APPLE__) && defined(__cplusplus)
          #include <pthread.h>
          #include <sys/types.h>
          #include <cstdint>
          inline pid_t gettid() { uint64_t t = 0; pthread_threadid_np(nullptr, &t); return static_cast<pid_t>(t); }
          #endif
          EOF
          grep -n "^project\|WIN32 OR ANDROID" port-src/port/CMakeLists.txt

      - name: Patch bink_decode.c for Apple (malloc.h -> malloc/malloc.h)
        run: |
          f=port-src/port/launcher/bink_decode.c
          perl -0pi -e 's|#include <malloc\.h>\n#define _msize malloc_usable_size|#ifdef __APPLE__\n#include <malloc/malloc.h>\n#define _msize malloc_size\n#else\n#include <malloc.h>\n#define _msize malloc_usable_size\n#endif|' "$f"
          echo "---- edited lines ----"
          sed -n 20,35p "$f"
          grep -q 'malloc/malloc.h' "$f"

      - name: iOS link fixes (music stubs + plume window wrapper)
        run: |
          # 1) iOS boot log and bundled shaders (the music functions are music.cpp: see the "iOS music" step)
          cat > port-src/port/src/ios_stubs.cpp <<'EOF'
          // iOS: boot log and bundled shader copy. (The music functions are music.cpp, patched by the "iOS music" step.)
          #include "music.h"
          #include <cstdio>
          #include <cstdlib>
          #include <ctime>
          #include <string>
          #include <sys/stat.h>
          #include <filesystem>
          #include <system_error>
          #include <vector>
          #include <mach-o/dyld.h>

          // iOS boot log: before main() runs, send stdout/stderr to Documents/boot.log so a
          // startup failure leaves text behind (works from any sideload method).
          namespace {
          __attribute__((constructor(101))) void IosBootLog() {
            const char* home = std::getenv("HOME");
            if (!home) return;
            std::string dir = std::string(home) + "/Documents";
            mkdir(dir.c_str(), 0755);
            std::string file = dir + "/boot.log";
            if (!freopen(file.c_str(), "a", stderr)) return;
            freopen(file.c_str(), "a", stdout);
            setvbuf(stderr, nullptr, _IONBF, 0);
            setvbuf(stdout, nullptr, _IOLBF, 0);
            std::fprintf(stderr, "[boot] started t=%ld home=%s\n", static_cast<long>(std::time(nullptr)), home);
            std::atexit([] { std::fprintf(stderr, "[boot] process exit\n"); });
          }
          }  // namespace

          // The native renderer's shader pack ships inside the app (<bundle>/native_shaders). Copy
          // it into Documents/native_shaders when a file is missing there or its size differs.
          namespace {
          __attribute__((constructor(102))) void IosInstallBundledShaders() {
            namespace fs = std::filesystem;
            const char* home = std::getenv("HOME");
            if (!home) return;
            uint32_t size = 0;
            _NSGetExecutablePath(nullptr, &size);
            std::vector<char> buf(size + 1, 0);
            if (_NSGetExecutablePath(buf.data(), &size) != 0) return;
            std::error_code ec;
            const fs::path src_dir = fs::path(buf.data()).parent_path() / "native_shaders";
            if (!fs::is_directory(src_dir, ec)) {
              std::fprintf(stderr, "[boot] shaders: none bundled in the app\n");
              return;
            }
            const fs::path dst_dir = fs::path(home) / "Documents" / "native_shaders";
            fs::create_directories(dst_dir, ec);
            for (fs::directory_iterator it(src_dir, ec), end; !ec && it != end; it.increment(ec)) {
              std::error_code e1;
              if (!it->is_regular_file(e1)) continue;
              const fs::path dst = dst_dir / it->path().filename();
              const bool have = fs::is_regular_file(dst, e1);
              std::error_code e2, e3;
              if (have && fs::file_size(dst, e2) == fs::file_size(it->path(), e3)) continue;
              std::error_code e4;
              fs::copy_file(it->path(), dst, fs::copy_options::overwrite_existing, e4);
              std::fprintf(stderr, "[boot] shaders: %s %s\n", it->path().filename().c_str(),
                           e4 ? e4.message().c_str() : "copied");
            }
          }
          }  // namespace

          EOF
          cat >> port-src/port/CMakeLists.txt <<'EOF'

          if(IOS)
            target_sources(svr2011 PRIVATE src/ios_stubs.cpp src/music.cpp src/hd_movies_ios.mm)
            set_source_files_properties(src/hd_movies_ios.mm PROPERTIES COMPILE_FLAGS "-fobjc-arc")
          endif()
          EOF

          # 2) plume: UIKit version of CocoaWindow (plume_apple.mm is AppKit-only)
          cat > plume/plume_ios.mm <<'EOF'
          // iOS version of plume::CocoaWindow (the macOS one in plume_apple.mm uses AppKit).
          // The handle is expected to be a UIWindow*, UIView* or CALayer* (not yet tested at run time).
          #include "plume_apple.h"
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <Foundation/Foundation.h>
          #include <cmath>

          namespace plume {
              static bool plumeIosReadSize(void* handle, CocoaWindowAttributes* out) {
                  id obj = (__bridge id)handle;
                  CGRect b = CGRectZero;
                  CGFloat scale = 1.0;
                  if ([obj isKindOfClass:[UIWindow class]]) {
                      UIWindow* w = (UIWindow*)obj;
                      b = w.bounds;
                      scale = w.screen.nativeScale;
                  } else if ([obj isKindOfClass:[UIView class]]) {
                      UIView* v = (UIView*)obj;
                      b = v.bounds;
                      scale = v.contentScaleFactor;
                  } else if ([obj isKindOfClass:[CALayer class]]) {
                      CALayer* l = (CALayer*)obj;
                      b = l.bounds;
                      scale = l.contentsScale;
                  } else {
                      return false;
                  }
                  out->x = (int)std::lround(b.origin.x);
                  out->y = (int)std::lround(b.origin.y);
                  out->width = (int)std::lround(b.size.width * scale);
                  out->height = (int)std::lround(b.size.height * scale);
                  return true;
              }

              CocoaWindow::CocoaWindow(void* window)
                  : windowHandle(window), cachedAttributes{}, cachedRefreshRate(0) {
                  updateWindowAttributesInternal(false);
              }

              CocoaWindow::~CocoaWindow() {}

              void CocoaWindow::updateWindowAttributesInternal(bool forceSync) {
                  auto updateBlock = ^{
                      CocoaWindowAttributes a = {};
                      if (plumeIosReadSize(windowHandle, &a)) {
                          std::lock_guard<std::mutex> lock(attributesMutex);
                          cachedAttributes = a;
                      }
                  };
                  if (forceSync && ![NSThread isMainThread]) {
                      dispatch_sync(dispatch_get_main_queue(), updateBlock);
                  } else if ([NSThread isMainThread]) {
                      updateBlock();
                  } else {
                      dispatch_async(dispatch_get_main_queue(), updateBlock);
                  }
              }

              void CocoaWindow::updateRefreshRateInternal(bool forceSync) {
                  auto updateBlock = ^{
                      int fps = 60;
                      id obj = (__bridge id)windowHandle;
                      if ([obj isKindOfClass:[UIWindow class]]) {
                          fps = (int)((UIWindow*)obj).screen.maximumFramesPerSecond;
                      } else if ([obj isKindOfClass:[UIView class]] && ((UIView*)obj).window) {
                          fps = (int)((UIView*)obj).window.screen.maximumFramesPerSecond;
                      }
                      cachedRefreshRate.store(fps);
                  };
                  if (forceSync && ![NSThread isMainThread]) {
                      dispatch_sync(dispatch_get_main_queue(), updateBlock);
                  } else if ([NSThread isMainThread]) {
                      updateBlock();
                  } else {
                      dispatch_async(dispatch_get_main_queue(), updateBlock);
                  }
              }

              void CocoaWindow::getWindowAttributes(CocoaWindowAttributes* attributes) const {
                  const_cast<CocoaWindow*>(this)->updateWindowAttributesInternal(false);
                  std::lock_guard<std::mutex> lock(attributesMutex);
                  *attributes = cachedAttributes;
              }

              int CocoaWindow::getRefreshRate() const {
                  const_cast<CocoaWindow*>(this)->updateRefreshRateInternal(false);
                  int r = cachedRefreshRate.load();
                  return r > 0 ? r : 60;
              }

              void CocoaWindow::toggleFullscreen() {}
          }
          EOF
          cat >> plume/CMakeLists.txt <<'EOF'

          if(IOS)
            target_sources(plume PRIVATE plume_ios.mm)
          endif()
          EOF
          echo "---- tails ----"
          tail -n 5 port-src/port/CMakeLists.txt
          tail -n 5 plume/CMakeLists.txt
          test -f port-src/port/src/ios_stubs.cpp && test -f plume/plume_ios.mm
          grep -q "plume_ios.mm" plume/CMakeLists.txt && grep -q "ios_stubs.cpp" port-src/port/CMakeLists.txt

      - name: iOS music (AudioToolbox decoder for the port's music.cpp)
        run: |
          # Entrance themes (USER PLAYLIST), the jukebox, a superstar mod's announcer call and the media
          # mods' replacement sounds all play through music.cpp. Upstream has it for Windows (Media
          # Foundation) and Android (NDK media decoders) only, so on iOS they were silent and the game
          # fell back to its own music. This adds an iOS player: the Android one (SDL audio stream, own
          # thread, volume / pause / loop / clip logic) with Apple's AudioToolbox decoding the files
          # (mp3, m4a / aac, flac, wav; no wma / ogg). It also brings back two hooks that live in the
          # same file (the entrance-save freeze fix).
          python3 - <<'PY'
          # Adds an iOS backend to the port's music.cpp: the Android player (SDL audio stream, its own thread, the
          # volume / pause / loop / clip logic) with Apple's AudioToolbox decoder in place of the NDK's.
          import sys

          root = sys.argv[1] if len(sys.argv) > 1 else 'port-src/port/src'
          path = root + '/music.cpp'
          s = open(path, encoding='utf-8').read()


          def die(what):
              raise SystemExit('iOS music patch: music.cpp changed upstream, cannot find: ' + what)


          def rep(old, new, what, text=None):
              global s
              t = s if text is None else text
              if t.count(old) != 1:
                  die(what)
              t = t.replace(old, new)
              if text is None:
                  s = t
              return t


          def cut(t, start, end, new, what):
              # replaces everything from `start` up to (not including) `end`
              if t.count(start) != 1:
                  die(what + ' (start)')
              i = t.index(start)
              if t.count(end, i) < 1:
                  die(what + ' (end)')
              j = t.index(end, i)
              return t[:i] + new + t[j:]


          # 1. includes (after the port's own, so Apple's headers cannot disturb them)
          rep('#include "jukebox.h"\n',
              '#include "jukebox.h"\n\n#if defined(__APPLE__)\n#include <cstring>\n#include <AudioToolbox/AudioToolbox.h>\n'
              '#include <CoreFoundation/CoreFoundation.h>\n#include <SDL3/SDL.h>\n#endif\n',
              'include of jukebox.h')

          # 2. file types: what AudioToolbox decodes (no WMA, no OGG)
          rep('#else\n// (Android\'s decoders: no WMA)\n',
              '#elif defined(__APPLE__)\n// (iOS\'s decoders (AudioToolbox): no WMA, no OGG)\n'
              'constexpr const wchar_t* kExtensions[] = {L".mp3", L".m4a", L".aac", L".wav", L".flac"};\n'
              '#else\n// (Android\'s decoders: no WMA)\n',
              'extension list')

          # 3. the player: a copy of the Android one with the decoding replaced
          a = s.index('#elif defined(__ANDROID__)\n\n// Android: the phone')
          b = s.index('\n#endif\n\nPlayer* g_player')
          apple = s[a:b]
          apple = apple.replace('#elif defined(__ANDROID__)\n\n// Android: the phone\'s own decoders (NDK AMediaExtractor + AMediaCodec: mp3,\n'
                                '// m4a / aac, flac, wav...) into an SDL audio stream, on a thread of its own.',
                                '#elif defined(__APPLE__)\n\n// iOS: the system decoders (AudioToolbox ExtAudioFile: mp3, m4a / aac, flac, wav...)\n'
                                '// into an SDL audio stream, on a thread of its own. (The Android player, the decoding swapped.)', 1)
          if not apple.startswith('#elif defined(__APPLE__)'):
              die('Android player heading comment')

          NEW_OPEN = r'''  bool Open(const std::filesystem::path& path) {
              song_gain_ = clip_gain_ > 0.0f ? clip_gain_ : SongGain(path);
              if (song_gain_ != 1.0f)
                REXLOG_INFO("user music: {} at {:.1f} dB (theme_gain)", path.filename().string(), 20.0f * std::log10(song_gain_));
              const std::string native = path.string();
              CFURLRef url = CFURLCreateFromFileSystemRepresentation(
                  kCFAllocatorDefault, reinterpret_cast<const UInt8*>(native.c_str()), static_cast<CFIndex>(native.size()), false);
              if (!url) {
                REXLOG_WARN("user music: cannot open {}", path.string());
                return false;
              }
              const OSStatus opened = ExtAudioFileOpenURL(url, &file_);
              CFRelease(url);
              if (opened != noErr || !file_) {
                REXLOG_WARN("user music: cannot read {} (AudioToolbox error {})", path.string(), static_cast<int>(opened));
                file_ = nullptr;
                return false;
              }
              // the file's own rate and channels; decoded to 16-bit PCM, mono or stereo (the stream's input format)
              AudioStreamBasicDescription src = {};
              UInt32 size = sizeof(src);
              ExtAudioFileGetProperty(file_, kExtAudioFileProperty_FileDataFormat, &size, &src);
              const int rate = src.mSampleRate > 0.0 ? static_cast<int>(src.mSampleRate) : 44100;
              const int channels = src.mChannelsPerFrame >= 2 ? 2 : 1;
              AudioStreamBasicDescription out = {};
              out.mSampleRate = rate;
              out.mFormatID = kAudioFormatLinearPCM;
              out.mFormatFlags = kAudioFormatFlagIsSignedInteger | kAudioFormatFlagIsPacked;
              out.mBitsPerChannel = 16;
              out.mChannelsPerFrame = static_cast<UInt32>(channels);
              out.mFramesPerPacket = 1;
              out.mBytesPerFrame = out.mBytesPerPacket = static_cast<UInt32>(channels * 2);
              const OSStatus set = ExtAudioFileSetProperty(file_, kExtAudioFileProperty_ClientDataFormat, sizeof(out), &out);
              if (set != noErr) {
                REXLOG_WARN("user music: cannot decode {} (AudioToolbox error {})", path.string(), static_cast<int>(set));
                Close();
                return false;
              }
              SInt64 frames = 0;
              size = sizeof(frames);
              duration_us_ = (ExtAudioFileGetProperty(file_, kExtAudioFileProperty_FileLengthFrames, &size, &frames) == noErr &&
                              frames > 0 && src.mSampleRate > 0.0)
                                 ? static_cast<int64_t>(static_cast<double>(frames) / src.mSampleRate * 1e6)
                                 : 0;
              SetFormat(rate, channels);
              frame_bytes_ = channels * 2;
              if (!stream_) {
                REXLOG_WARN("user music: cannot play {} (no audio output)", path.string());
                Close();
                return false;
              }
              ended_ = input_done_ = false;
              drain_rounds_ = 0;
              last_queued_ = -1;
              started_ = std::chrono::steady_clock::now();
              paused_at_ = {};
              stream_paused_ = true;  // started by the loop (unless paused)
              volume_ = -1.0f;
              return true;
            }

          '''

          NEW_CLOSE = r'''  void Close() {
              if (file_) {
                ExtAudioFileDispose(file_);
                file_ = nullptr;
              }
              if (stream_) SDL_ClearAudioStream(stream_);
            }

          '''

          NEW_FEED = r'''  // Keeps ~0.3 s decoded audio queued on the stream.
            void Feed() {
              while (!ended_ && SDL_GetAudioStreamQueued(stream_) < int(bytes_per_second_ * 0.3)) {
                UInt32 frames = static_cast<UInt32>(pcm_.size() * sizeof(int16_t)) / static_cast<UInt32>(frame_bytes_);
                AudioBufferList list = {};
                list.mNumberBuffers = 1;
                list.mBuffers[0].mNumberChannels = static_cast<UInt32>(frame_bytes_ / 2);
                list.mBuffers[0].mDataByteSize = frames * static_cast<UInt32>(frame_bytes_);
                list.mBuffers[0].mData = pcm_.data();
                const OSStatus read = ExtAudioFileRead(file_, &frames, &list);
                if (read != noErr || frames == 0) {  // (the end, or a file that breaks half way)
                  ended_ = true;
                  REXLOG_INFO("user music: {}: decoded to the end", song_.filename().string());
                  break;
                }
                SDL_PutAudioStreamData(stream_, pcm_.data(), static_cast<int>(frames) * frame_bytes_);
              }
            }

          '''

          apple = cut(apple, '  bool Open(const std::filesystem::path& path) {\n    song_gain_',
                      '  // The decoder\'s output (16-bit PCM): the stream\'s input format.', NEW_OPEN, 'Open()')
          apple = cut(apple, '  void Close() {\n    if (codec_) {', '  void UpdateVolume() {', NEW_CLOSE, 'Close()')
          apple = cut(apple, '  // Keeps ~0.3 s decoded audio queued on the stream.\n  void Feed() {',
                      '  // Requests (any thread).', NEW_FEED, 'Feed()')
          apple = rep('  int fd_ = -1;\n  AMediaExtractor* extractor_ = nullptr;\n  AMediaCodec* codec_ = nullptr;\n',
                      '  ExtAudioFileRef file_ = nullptr;\n  int frame_bytes_ = 4;\n  std::vector<int16_t> pcm_ = std::vector<int16_t>(8192);\n',
                      'decoder members', text=apple)
          # the loop's "a song is open" test
          if apple.count('codec_') != 3:
              die('the three codec_ tests in Run()')
          apple = apple.replace('codec_', 'file_')
          # SDL's audio may not have been started yet
          apple = rep('    if (!stream_) {\n      stream_ = SDL_OpenAudioDeviceStream(',
                      '    if (!stream_) {\n      if (!SDL_WasInit(SDL_INIT_AUDIO)) SDL_InitSubSystem(SDL_INIT_AUDIO);\n      stream_ = SDL_OpenAudioDeviceStream(',
                      'SetFormat()', text=apple)
          for left in ('AMedia', 'AMEDIA', 'fd_', 'extractor_', 'lseek', 'O_RDONLY', 'off64_t'):
              if left in apple:
                  raise SystemExit('iOS music patch: leftover Android code in the iOS player: ' + left)

          s = s[:b] + '\n' + apple + s[b:]
          open(path, 'w', encoding='utf-8').write(s)

          # 4. posix_stubs.cpp: it stubs the same three functions for every platform but Android
          q = root + '/posix_stubs.cpp'
          t = open(q, encoding='utf-8').read()
          old = '#if !defined(__ANDROID__)  // (Android: music.cpp)'
          if t.count(old) != 1:
              die('posix_stubs.cpp guard')
          open(q, 'w', encoding='utf-8').write(t.replace(old, '#if !defined(__ANDROID__) && !defined(__APPLE__)  // (Android, iOS: music.cpp)'))
          print('iOS music patch applied')
          PY
          echo "---- music.cpp iOS branches ----"
          grep -n "defined(__APPLE__)" port-src/port/src/music.cpp port-src/port/src/posix_stubs.cpp
          grep -q "ExtAudioFileRead" port-src/port/src/music.cpp

      - name: iOS HD movies (AVFoundation decoder for the port's hd_movies.cpp)
        run: |
          # A mod's entrance movie is an .mp4 (movie= / video.<id>=). The game plays it HD with the platform's
          # own decoder: Windows (Media Foundation) and Android (MediaCodec) have one in hd_movies.cpp, every
          # other platform a stub that says "no decoder", so on iOS the game showed the superstar's own movie.
          # This adds an iOS decoder: AVFoundation's AVAssetReader (the phone's H.264 decoder) -> NV12, scaled
          # to the frame size, on a thread per open movie like the other two. The small Objective-C++ helper
          # is src/hd_movies_ios.mm; hd_movies.cpp gets an iOS branch.
          cat > port-src/port/src/hd_movies_ios.h <<'EOF'
          // WWE SmackDown vs. Raw 2011 - iOS HD movie decoding (hd_movies.cpp): AVFoundation reading a mod's .mp4
          // with the phone's own decoder (hd_movies_ios.mm). Plain C++ so hd_movies.cpp can use it.
          #pragma once

          #include <cstdint>
          #include <string>

          namespace svr2011::hdios {

          // The .mp4's length (s) and picture size, and whether this phone can decode it.
          bool Probe(const std::string& mp4, double* seconds, uint32_t* width, uint32_t* height);

          // Starts reading at the first frame. nullptr: it can't be decoded.
          void* Open(const std::string& mp4);
          void Close(void* reader);
          // Starts again at the first frame (the game looped the movie). false: it can't.
          bool Rewind(void* reader);

          // The next frame, scaled to w x h (even) as NV12 (w * h * 3 / 2 bytes) into `nv12`, and its time in seconds.
          //  1: a frame   0: the end of the movie   2: a sample with no picture (call again)   -1: the decoder failed
          int Next(void* reader, uint8_t* nv12, uint32_t w, uint32_t h, double* seconds);

          }  // namespace svr2011::hdios
          EOF
          cat > port-src/port/src/hd_movies_ios.mm <<'EOF'
          // WWE SmackDown vs. Raw 2011 - iOS HD movie decoding (see hd_movies_ios.h, hd_movies.cpp).
          // AVAssetReader hands out the .mp4's pictures decoded by the phone's own H.264 decoder as NV12 (bi-planar
          // 4:2:0); they are scaled here (nearest pixel, like the Android decoder) to the frame size the game's Bink
          // movie has.

          #import <AVFoundation/AVFoundation.h>
          #import <CoreMedia/CoreMedia.h>
          #import <CoreVideo/CoreVideo.h>

          #include <cstring>

          #include "hd_movies_ios.h"

          #pragma clang diagnostic ignored "-Wdeprecated-declarations"  // (the synchronous track / duration reads)

          namespace {

          struct Reader {
            NSURL* url = nil;
            AVAssetReader* reader = nil;
            AVAssetReaderTrackOutput* output = nil;
          };

          NSURL* FileURL(const std::string& path) {
            NSString* p = [NSString stringWithUTF8String:path.c_str()];
            return p ? [NSURL fileURLWithPath:p] : nil;
          }

          AVAssetTrack* VideoTrack(AVAsset* asset) {
            NSArray<AVAssetTrack*>* tracks = [asset tracksWithMediaType:AVMediaTypeVideo];
            return tracks.count > 0 ? tracks[0] : nil;
          }

          // (Re)starts reading at the first frame.
          bool Start(Reader* r) {
            r->reader = nil;
            r->output = nil;
            if (!r->url) return false;
            AVURLAsset* asset = [AVURLAsset URLAssetWithURL:r->url options:nil];
            AVAssetTrack* track = VideoTrack(asset);
            if (!track) return false;
            NSError* error = nil;
            AVAssetReader* reader = [[AVAssetReader alloc] initWithAsset:asset error:&error];
            if (!reader) return false;
            NSDictionary* settings = @{
              (__bridge id)kCVPixelBufferPixelFormatTypeKey : @(kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange),
            };
            AVAssetReaderTrackOutput* output = [AVAssetReaderTrackOutput assetReaderTrackOutputWithTrack:track outputSettings:settings];
            output.alwaysCopiesSampleData = NO;
            if (![reader canAddOutput:output]) return false;
            [reader addOutput:output];
            if (![reader startReading]) return false;
            r->reader = reader;
            r->output = output;
            return true;
          }

          // The decoder's NV12 picture to w x h NV12 (nearest pixel: the titantron's size is near the source's).
          void Scale(CVPixelBufferRef image, uint8_t* nv12, uint32_t w, uint32_t h) {
            const uint8_t* ys = static_cast<const uint8_t*>(CVPixelBufferGetBaseAddressOfPlane(image, 0));
            const size_t yrow = CVPixelBufferGetBytesPerRowOfPlane(image, 0);
            const uint64_t sw = CVPixelBufferGetWidthOfPlane(image, 0), sh = CVPixelBufferGetHeightOfPlane(image, 0);
            const uint8_t* cs = static_cast<const uint8_t*>(CVPixelBufferGetBaseAddressOfPlane(image, 1));
            const size_t crow = CVPixelBufferGetBytesPerRowOfPlane(image, 1);
            const uint64_t cw = CVPixelBufferGetWidthOfPlane(image, 1), ch = CVPixelBufferGetHeightOfPlane(image, 1);
            for (uint32_t y = 0; y < h; ++y) {
              const uint8_t* src = ys + size_t(y * sh / h) * yrow;
              uint8_t* dst = nv12 + size_t(y) * w;
              for (uint32_t x = 0; x < w; ++x) dst[x] = src[size_t(x * sw / w)];
            }
            uint8_t* uv = nv12 + size_t(w) * h;
            for (uint32_t y = 0; y < h / 2; ++y) {
              const uint8_t* src = cs + size_t(y * ch / (h / 2)) * crow;
              uint8_t* dst = uv + size_t(y) * w;
              for (uint32_t x = 0; x < w / 2; ++x) {
                const size_t sx = size_t(x * cw / (w / 2));
                dst[2 * x] = src[2 * sx];
                dst[2 * x + 1] = src[2 * sx + 1];
              }
            }
          }

          }  // namespace

          namespace svr2011::hdios {

          bool Probe(const std::string& mp4, double* seconds, uint32_t* width, uint32_t* height) {
            @autoreleasepool {
              NSURL* url = FileURL(mp4);
              if (!url) return false;
              AVURLAsset* asset = [AVURLAsset URLAssetWithURL:url options:nil];
              AVAssetTrack* track = VideoTrack(asset);
              if (!track || !track.isDecodable) return false;
              const double length = CMTimeGetSeconds(asset.duration);
              const CGSize size = track.naturalSize;
              if (!(length > 0.0) || size.width < 1.0 || size.height < 1.0) return false;
              *seconds = length;
              *width = static_cast<uint32_t>(size.width);
              *height = static_cast<uint32_t>(size.height);
              return true;
            }
          }

          void* Open(const std::string& mp4) {
            @autoreleasepool {
              Reader* r = new Reader();
              r->url = FileURL(mp4);
              if (!Start(r)) {
                delete r;
                return nullptr;
              }
              return r;
            }
          }

          void Close(void* reader) {
            @autoreleasepool {
              Reader* r = static_cast<Reader*>(reader);
              if (r && r->reader) [r->reader cancelReading];
              delete r;
            }
          }

          bool Rewind(void* reader) {
            @autoreleasepool {
              Reader* r = static_cast<Reader*>(reader);
              if (!r) return false;
              if (r->reader) [r->reader cancelReading];
              return Start(r);
            }
          }

          int Next(void* reader, uint8_t* nv12, uint32_t w, uint32_t h, double* seconds) {
            @autoreleasepool {
              Reader* r = static_cast<Reader*>(reader);
              if (!r || !r->output || w == 0 || h < 2) return -1;
              CMSampleBufferRef sample = [r->output copyNextSampleBuffer];
              if (!sample) return r->reader.status == AVAssetReaderStatusFailed ? -1 : 0;  // (failed, or the end)
              int result = 2;
              CVImageBufferRef image = CMSampleBufferGetImageBuffer(sample);
              if (image && CVPixelBufferIsPlanar(image) && CVPixelBufferGetPlaneCount(image) >= 2 &&
                  CVPixelBufferLockBaseAddress(image, kCVPixelBufferLock_ReadOnly) == kCVReturnSuccess) {
                Scale(image, nv12, w, h);
                CVPixelBufferUnlockBaseAddress(image, kCVPixelBufferLock_ReadOnly);
                *seconds = CMTimeGetSeconds(CMSampleBufferGetPresentationTimeStamp(sample));
                result = 1;
              }
              CFRelease(sample);
              return result;
            }
          }

          }  // namespace svr2011::hdios
          EOF
          python3 - <<'PY'
          # Adds an iOS decoder to the port's hd_movies.cpp: the HD entrance movies (a mod's .mp4) played with the
          # phone's own decoder, as Windows (Media Foundation) and Android (MediaCodec) do. Upstream's iOS fallback is
          # a stub that says "no decoder", so a mod whose movie is an .mp4 showed the superstar's own movie.
          import sys

          root = sys.argv[1] if len(sys.argv) > 1 else 'port-src/port/src'
          path = root + '/hd_movies.cpp'
          s = open(path, encoding='utf-8').read()


          def die(what):
              raise SystemExit('iOS HD movies patch: hd_movies.cpp changed upstream, cannot find: ' + what)


          def rep(old, new, what):
              global s
              if s.count(old) != 1:
                  die(what)
              s = s.replace(old, new)


          rep('#include <media/NdkMediaExtractor.h>\n#endif\n',
              '#include <media/NdkMediaExtractor.h>\n#elif defined(__APPLE__)\n#include <pthread/qos.h>\n#include "hd_movies_ios.h"\n#endif\n',
              'platform includes')

          APPLE = r'''#elif defined(__APPLE__)

          // iOS: AVFoundation's AVAssetReader decodes the .mp4 with the phone's own decoder (hd_movies_ios.mm), scaled
          // to the frame size.

          bool Probe(const fs::path& mp4, double* seconds, uint32_t* sw, uint32_t* sh) {
            return svr2011::hdios::Probe(mp4.string(), seconds, sw, sh);
          }

          class Decoder : public DecoderBase {
           public:
            explicit Decoder(HdMovie movie) : DecoderBase(std::move(movie)) { Start(); }
            ~Decoder() override { Stop(); }

           private:
            void Run() override {
              pthread_set_qos_class_self_np(QOS_CLASS_UTILITY, 0);  // (this thread: below the game's own)
              void* reader = svr2011::hdios::Open(movie_.mp4.string());
              if (!reader) {
                REXLOG_WARN("[svr2011] hd movies: can't decode {}", movie_.mp4.string());
                return;
              }
              if (LogOn()) REXLOG_INFO("[svr2011] hd movies: decoding {} at {}x{} (AVFoundation)", movie_.mp4.string(), w_, h_);
              double last = -1;
              bool ended = false;
              while (!stop_) {
                if (Looped(last)) {
                  if (!svr2011::hdios::Rewind(reader)) break;
                  last = -1;
                  ended = false;
                  Clear();
                }
                if (ended || Ahead(last)) {
                  std::this_thread::sleep_for(std::chrono::milliseconds(4));
                  continue;
                }
                Frame f;
                f.nv12.resize(size_t(w_) * h_ * 3 / 2);
                double time = 0;
                const int got = svr2011::hdios::Next(reader, f.nv12.data(), w_, h_, &time);
                if (got == 0) {  // (the end: the last frame stays until the game loops or closes)
                  ended = true;
                  continue;
                }
                if (got < 0) {
                  REXLOG_WARN("[svr2011] hd movies: the decoder failed on {}", movie_.mp4.string());
                  break;
                }
                if (got != 1) continue;
                f.time = time;
                f.ready = true;
                last = time;
                Push(std::move(f));
              }
              svr2011::hdios::Close(reader);
            }
          };

          '''
          rep('#else\n\nbool Probe(const fs::path&, double*, uint32_t*, uint32_t*) { return false; }\n',
              APPLE + '#else\n\nbool Probe(const fs::path&, double*, uint32_t*, uint32_t*) { return false; }\n',
              'the non-Windows non-Android stub')
          open(path, 'w', encoding='utf-8').write(s)
          print('iOS HD movies patch applied')
          PY
          echo "---- hd_movies.cpp iOS branches ----"
          grep -n "defined(__APPLE__)" port-src/port/src/hd_movies.cpp
          grep -q "svr2011::hdios::Next" port-src/port/src/hd_movies.cpp
          test -f port-src/port/src/hd_movies_ios.mm && test -f port-src/port/src/hd_movies_ios.h
          grep -q "hd_movies_ios.mm" port-src/port/CMakeLists.txt

      - name: iOS paths and startup (game folder, GPU plugin, SDL entry point)
        run: |
          set -euo pipefail
          F=sdk/src/core/filesystem_posix.cpp
          P=sdk/src/system/gpu_plugin_loader.cpp
          perl -0pi -e 's/\A/#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#endif\n#include <cstdlib>\n#include <system_error>\n/' "$F" "$P"
          perl -0pi -e 's/(std::filesystem::path GetExecutableFolder\(\) \{\n)/$1#if defined(__APPLE__) && TARGET_OS_IPHONE\n  \/\/ [ios] The app bundle is read-only: the game folder is the app\x27s Documents folder.\n  if (const char* home = std::getenv("HOME")) {\n    std::filesystem::path docs = std::filesystem::path(home) \/ "Documents";\n    std::error_code ec;\n    std::filesystem::create_directories(docs, ec);\n    return docs;\n  }\n#endif\n/' "$F"
          perl -0pi -e 's/  auto path = rex::filesystem::GetExecutableFolder\(\) \/ PluginFileName\(name\);\n/#if defined(__APPLE__) && TARGET_OS_IPHONE\n  auto path = rex::filesystem::GetExecutablePath().parent_path() \/ "Frameworks" \/ PluginFileName(name);\n#else\n  auto path = rex::filesystem::GetExecutableFolder() \/ PluginFileName(name);\n#endif\n/' "$P"
          echo "---- edited lines ----"
          grep -n -A9 "GetExecutableFolder() {" "$F" | head -14
          grep -n -B2 -A5 "Frameworks" "$P"
          grep -q "TARGET_OS_IPHONE" "$F"
          grep -q 'Frameworks' "$P"

          # SDL must own the iOS entry point (UIApplicationMain), so main has to become SDL_main:
          # without this SDL_InitSubSystem(VIDEO) fails and the app exits with code 1.
          M=sdk/src/ui/windowed_app_main_sdl.cpp
          perl -0pi -e 's/(#include <rex\/ui\/windowed_app_context_sdl\.h>\n)/$1\n#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#if TARGET_OS_IPHONE\n#include <SDL3\/SDL_main.h>\n#endif\n#endif\n/' "$M"
          # MoltenVK (Metal) has no geometry shaders or non-solid fill mode: do not require them.
          perl -0pi -e 's/(  rex::cvar::ApplyEnvironment\(\);\n)(  rex::InitLoggingEarly\(\);)/$1#if defined(__APPLE__) && TARGET_OS_IPHONE\n  rex::cvar::SetFlagByName("vulkan_require_geometry_shader", "false");\n  rex::cvar::SetFlagByName("vulkan_require_fill_mode_non_solid", "false");\n#endif\n$2/' "$M"
          # The SDK treats every Apple platform as macOS (REX_PLATFORM_MAC) and forces SDL's "cocoa"
          # video driver, which does not exist on iOS ("cocoa not available"). iOS needs "uikit".
          C=sdk/src/ui/windowed_app_context_sdl.cpp
          perl -0pi -e 's/\A/#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#endif\n/' "$C"
          perl -0pi -e 's/requested_driver = "cocoa";/#if defined(TARGET_OS_IPHONE) \&\& TARGET_OS_IPHONE\n    requested_driver = "uikit";\n#else\n    requested_driver = "cocoa";\n#endif/' "$C"
          # The Vulkan runtime lives in <app bundle>/vulkan. The SDK looks beside "the executable
          # folder", which on iOS is now Documents, so point this one lookup at the bundle.
          V=sdk/src/ui/vulkan/vulkan_moltenvk.cpp
          perl -0pi -e 's/\A/#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#endif\n/' "$V"
          perl -0pi -e 's/  const fs::path executable_dir = rex::filesystem::GetExecutableFolder\(\);\n/#if defined(TARGET_OS_IPHONE) \&\& TARGET_OS_IPHONE\n  const fs::path executable_dir = rex::filesystem::GetExecutablePath().parent_path();\n#else\n  const fs::path executable_dir = rex::filesystem::GetExecutableFolder();\n#endif\n/' "$V"
          # The iOS sandbox refuses shm_open, which is how the 4.5 GB guest memory is created
          # ("Unable to reserve the 4gb guest address space"). Use a plain file in the app's tmp
          # folder, deleted at once (the open handle keeps it alive; it stays sparse on APFS).
          python3 - <<'PYEOF'
          p = "sdk/src/core/memory_posix.cpp"
          s = open(p).read()
          anchor = "#else\n  int oflag;\n  switch (access) {\n"
          assert s.count(anchor) == 1, "anchor count %d" % s.count(anchor)
          new = """#elif defined(__APPLE__) && TARGET_OS_IPHONE
            (void)access;
            (void)commit;
            const char* ios_tmp = std::getenv("TMPDIR");
            std::filesystem::path ios_dir = ios_tmp ? ios_tmp : "/tmp";
            std::error_code ios_ec;
            std::filesystem::create_directories(ios_dir, ios_ec);
            std::filesystem::path ios_backing = ios_dir / path.filename();
            int ios_fd = open(ios_backing.c_str(), O_RDWR | O_CREAT | O_TRUNC, 0600);
            if (ios_fd < 0) {
              return kFileMappingHandleInvalid;
            }
            unlink(ios_backing.c_str());
            if (rex_ftruncate64(ios_fd, static_cast<off_t>(length)) != 0) {
              close(ios_fd);
              return kFileMappingHandleInvalid;
            }
            return static_cast<FileMappingHandle>(ios_fd);
          """
          s = s.replace(anchor, new + anchor)
          s = "#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#endif\n#include <cstdlib>\n" + s
          open(p, "w").write(s)
          PYEOF
          echo "---- memory_posix.cpp edit ----"
          grep -n -A6 "ios_tmp" sdk/src/core/memory_posix.cpp | head -12
          grep -q "ios_backing" sdk/src/core/memory_posix.cpp
          echo "---- vulkan_moltenvk.cpp edit ----"
          grep -n -B1 -A5 "GetExecutablePath" "$V"
          grep -q "GetExecutablePath" "$V"
          echo "---- windowed_app_context_sdl.cpp edit ----"
          grep -n -B2 -A6 '"uikit"' "$C"
          grep -q '"uikit"' "$C"
          echo "---- windowed_app_main_sdl.cpp edits ----"
          grep -n -B1 -A6 "TargetConditionals" "$M"
          grep -n -B2 -A3 "vulkan_require_geometry_shader" "$M"
          grep -q "SDL3/SDL_main.h" "$M"
          grep -q "vulkan_require_fill_mode_non_solid" "$M"

