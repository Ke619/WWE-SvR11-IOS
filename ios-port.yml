            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-logs
          path: |
            configure.log
            build.log
            package.log

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}