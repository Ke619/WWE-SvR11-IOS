# WWE SmackDown vs. Raw 2011 - codegen overrides for default.xex
# (included from svr2011_manifest.toml)

# The CRT's setjmp / longjmp (buffer in r3; they save / restore f14-f31 and
# r13-r31). libjpeg reports bad data with longjmp: recompiled as plain code it
# "returned" into the wrong frame with the wrong registers and crashed (Create
# A Superstar -> TATTOOS -> LETTERING). The codegen replaces calls to them.
setjmp_address = 0x82BC9A20
longjmp_address = 0x82BC95F0

[functions]
# Small functions the scanner leaves in gaps; each is only reached by a tail-call.
0x8227FD28 = {}
0x824C6E38 = {}
0x82BBA778 = {}
0x82C2A020 = {}

